  T.rows.forEach(r=>{
    const st=String(r[c.start]||"").trim();
    if(!/^\d{4}-\d{2}-\d{2}/.test(st))return;
    const kind=wkKind(r[c.type]);
    const min=c.dur>=0?hmsMin(r[c.dur]):null;
    const km=c.km>=0?cnum(r[c.km]):null;
    const kj=c.kj>=0?cnum(r[c.kj]):null;
    const s={
      date:st.slice(0,10),
      heureCle:st.slice(0,10).replace(/-/g,"")+"_"+st.slice(11,13)+st.slice(14,16),
      kind:kind,
      debut:st.slice(11,16),
      /* Durée gardée en secondes : 2 h 08:59 ne se reconstitue pas depuis
         129,0 min, et une durée de séance s'annonce à la seconde. */
      dureeMin:min===null?null:r2(min),
      dureeSec:min===null?null:Math.round(min*60),
      /* Deux décimales : 10,02 km et 40,29 km disparaîtraient au dixième. */
      km:km===null?null:r2(km),
      allure:kind==="course"?allureOf(min,km):null,
      fcMoy:c.fcMoy>=0?nr1(r[c.fcMoy]):null,
      fcMax:c.fcMax>=0?nr1(r[c.fcMax]):null,
      kcal:kj===null?null:Math.round(kj/KJ),          /* piège 1 */
      denivele:c.dplus>=0?nr1(r[c.dplus]):null,
      pctHorsZoneHaut:null,pctHorsZoneBas:null
    };
    out.push(s);
  });
  return out;
}

/* --- % de temps hors zone (§2.5) ---
   Le nom du fichier porte les secondes, Workouts tronque à la minute :
   l'appariement se fait sur AAAAMMJJ_HHMM avec tolérance de deux
   minutes. Le calcul porte sur la colonne Avg, à la minute — une
   approximation, mais identique d'une semaine sur l'autre, ce qui est la
   seule chose qui compte pour comparer. */
const HZ_METHOD="minute/avg";
function hrKeyMinutes(k){
  const m=/^(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/.exec(k);
  if(!m)return null;
  return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5])/60000;
}
function parseHR(txt,zones){
  const T=csvTable(txt);
  const avgI=colIdx(T.head,/^Avg|Moyenne/i);
  if(avgI<0)return null;
  let n=0,haut=0,bas=0;
  T.rows.forEach(r=>{
    const v=cnum(r[avgI]);
    if(v===null)return;
    n++;
    if(v>zones.haut)haut++;
    if(v<zones.bas)bas++;
  });
  if(!n)return null;
  return{n:n,haut:Math.round(haut/n*100),bas:Math.round(bas/n*100)};
}

/* --- Assemblage du digest (§3) --- */
function emptyDigest(){
  return{source:"",importe:TODAY,du:null,au:null,jours:{},seances:[],
         semaine:{},manquant:[],symptomes:[],methodeHorsZone:HZ_METHOD};
}
async function parseExport(file,zones){
  const buf=await file.arrayBuffer();
  /* Vingt-deux octets est la taille d'une archive vide : en dessous, il
     n'y a rien à lire, et lire quatre octets jetterait une erreur de
     tableau typé que personne ne sait interpréter. */
  if(buf.byteLength<22)throw new Error("Fichier vide ou tronqué.");
  const sig=new Uint8Array(buf,0,4);
  if(!(sig[0]===0x50&&sig[1]===0x4b&&sig[2]===0x03&&sig[3]===0x04))
    throw new Error("Ce fichier n'est pas une archive zip.");
  const all=zipEntries(buf);
  /* On ne décompresse que ce qui sert : les traces GPS pèsent 99 % de
     l'archive et n'apportent rien. */
  const garde=e=>!/-Route-/.test(e.name)&&!/\.gpx$/i.test(e.name);
  const main=all.filter(e=>garde(e)&&/HealthAutoExport-\d{4}-\d{2}-\d{2}/.test(e.name)&&/\.csv$/i.test(e.name));
  const wk=all.filter(e=>garde(e)&&/(^|\/)Workouts[-_]/i.test(e.name)&&/\.csv$/i.test(e.name));
  /* Le tiret avant « Fréquence » est ce qui distingue la série de la
     « Récupération de la Fréquence Cardiaque », qui porte le même mot. */
  const hr=all.filter(e=>garde(e)&&/-Fr.quence Cardiaque-/i.test(e.name)&&/\.csv$/i.test(e.name));
  const sym=all.filter(e=>garde(e)&&/(^|\/)(Symptoms|ECG)-/i.test(e.name)&&/\.csv$/i.test(e.name));

  const d=emptyDigest();
  d.source=file.name;
  for(const e of main){
    const j=parseMain(await zipRead(buf,e));
    Object.keys(j).forEach(k=>{
      const cur=d.jours[k]||{};
      /* Fusion par date : la dernière valeur non nulle l'emporte. */
      Object.keys(j[k]).forEach(f=>{if(j[k][f]!==null||cur[f]===undefined)cur[f]=j[k][f];});
      d.jours[k]=cur;
    });
  }
  for(const e of wk)d.seances=d.seances.concat(parseWorkouts(await zipRead(buf,e)));
  /* Appariement des séries de FC aux séances de course. */
  const hrIdx=hr.map(e=>{
    const m=/(\d{8}_\d{4})/.exec(e.name);
    return{e:e,min:m?hrKeyMinutes(m[1]):null};
  }).filter(x=>x.min!==null);
  for(const s of d.seances){
    if(s.kind!=="course")continue;
    const t=hrKeyMinutes(s.heureCle);
    if(t===null)continue;
    let best=null,bd=3;
    hrIdx.forEach(x=>{const dd=Math.abs(x.min-t);if(dd<bd){bd=dd;best=x;}});
    if(!best)continue;
    const z=parseHR(await zipRead(buf,best.e),zones);
    if(z){s.pctHorsZoneHaut=z.haut;s.pctHorsZoneBas=z.bas;s.minutesFC=z.n;}
  }
  for(const e of sym){
    const t=(await zipRead(buf,e)).trim();
    const r=csvRows(t);
    if(r.length>1)d.symptomes.push({fichier:e.name,lignes:r.length-1});
  }
  const ks=Object.keys(d.jours).sort();
  d.du=ks[0]||null;d.au=ks[ks.length-1]||null;
  d.seances.sort((a,b)=>(a.date+a.debut).localeCompare(b.date+b.debut));
  d.semaineDu=ks.slice(-7)[0]||null;
  d.semaine=digestWeek(d);
  d.manquant=digestManquant(d);
  return d;
}
/* Le bloc « semaine » porte sur les SEPT DERNIERS jours du digest, même
   quand l'import en couvre quarante-quatre : un amorçage historique et
   une revue hebdomadaire passent par le même code, et une moyenne sur
   six semaines ne voudrait rien dire. */
function weekKeys(d){return Object.keys(d.jours).sort().slice(-7);}
/* Les séances de la fenêtre, et elles seules : un amorçage de six
   semaines compterait sinon cinquante-sept séances dans « la semaine ». */
function weekSeances(d){
  const ks=weekKeys(d);
  if(!ks.length)return [];
  const a=ks[0],b=ks[ks.length-1];
  return (d.seances||[]).filter(s=>s.date>=a&&s.date<=b);
}
function digestWeek(d){
  const ks=weekKeys(d),S=weekSeances(d);
  const col=f=>ks.map(k=>d.jours[k][f]).filter(v=>v!==null&&v!==undefined);
  const moy=a=>a.length?r1(a.reduce((x,y)=>x+y,0)/a.length):null;
  const kmBy=kind=>r2(S.filter(s=>s.kind===kind).reduce((x,s)=>x+(s.km||0),0));
  const sMoy=col("sommeilH");
  /* Minutes d'entraînement = durée des séances, pas le « temps
     d'exercice Apple », qui compte aussi la marche du quotidien et
     gonflerait la semaine de moitié. */
  const minSeances=S.reduce((x,s)=>x+(s.dureeMin||0),0);
  return{
    poidsMoy:moy(col("poids")),mgKgMoy:moy(col("mgKg")),mgPctMoy:moy(col("mgPct")),
    fcReposMoy:moy(col("fcRepos")),vfcMoy:moy(col("vfc")),
    sommeilMoyH:moy(sMoy),nuits7h:sMoy.filter(v=>v>=7).length,
    pasMoy:col("pas").length?Math.round(col("pas").reduce((x,y)=>x+y,0)/col("pas").length):null,
    minTotal:S.length?Math.round(minSeances):null,
    minExoApple:col("minExo").length?Math.round(col("minExo").reduce((x,y)=>x+y,0)):null,
    kmCourse:kmBy("course"),kmVelo:kmBy("vtt"),kmRando:kmBy("rando"),kmNat:kmBy("natation"),
    nbSeances:S.length,
    vo2Max:col("vo2").length?r1(Math.max.apply(null,col("vo2"))):null
  };
}
/* « Manquant » décrit la semaine revue : une tension relevée il y a
   trois semaines ne comble pas le trou de celle-ci. */
function digestManquant(d){
  const ks=weekKeys(d),m=[];
  const aucun=f=>!ks.some(k=>d.jours[k][f]!==null&&d.jours[k][f]!==undefined);
  if(aucun("sys")||aucun("dia"))m.push("tension");
  if(aucun("taille"))m.push("tourDeTaille");
  if(aucun("poids"))m.push("poids");
  return m;
}

/* --- Rangement : digests idempotents, puis fusion dans le journal --- */
function storeDigest(d){
  if(!Array.isArray(DB.imports))DB.imports=[];
  /* Un digest est identifié par sa période : réimporter le même zip
     remplace l'entrée, n'en empile pas une seconde. */
  const i=DB.imports.findIndex(x=>x.du===d.du&&x.au===d.au);
  if(i>=0)DB.imports[i]=d;else DB.imports.push(d);
  DB.imports.sort((a,b)=>String(a.du).localeCompare(String(b.du)));
  while(DB.imports.length>8)DB.imports.shift();
}
/* Champs mesurés du journal : ils viennent du zip et de lui seul. Aucun
   n'est proposé à la saisie, donc aucune saisie n'est écrasée. */
const MESURE=[["poids","weight"],["taille","waist"],["fcRepos","rhr"],["vfc","hrv"],
  ["vo2","vo2"],["sommeilH","sleep"],["mgPct","mgPct"],["maigre","maigre"],["mgKg","mgKg"],
  ["pas","pas"],["minExo","minExo"],["kcalActives","kcalActives"],["sys","sys"],["dia","dia"],
  ["recupCardio","recupCardio"]];
const KM_BY_KIND={course:"runKm",rando:"hikeKm",natation:"swimKm",vtt:"bikeKm"};
function mergeDigest(d){
  let jours=0;
  Object.keys(d.jours).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
    const src=d.jours[k],e=entry(k);
    let touche=false;
    MESURE.forEach(p=>{
      const v=src[p[0]];
      if(v===null||v===undefined)return;
      const val=String(v);
      if(e[p[1]]!==val){e[p[1]]=val;touche=true;}
    });
    if(touche)jours++;
  });
  /* Kilomètres par jour et par type, reconstruits depuis les séances. */
  const parJour={};
  d.seances.forEach(s=>{
    const f=KM_BY_KIND[s.kind];
    if(!f||!s.km)return;
    (parJour[s.date]||(parJour[s.date]={}))[f]=r2(((parJour[s.date]||{})[f]||0)+s.km);
  });
  Object.keys(parJour).forEach(k=>{
    const e=entry(k);
    Object.keys(parJour[k]).forEach(f=>{e[f]=String(parJour[k][f]);});
  });
  return jours;
}
async function importFiles(files){
  if(!zipSupported())throw new Error("Navigateur trop ancien pour lire le zip (DecompressionStream absent).");
  const zones=DB.settings.zones||{bas:128,haut:141};
  const res={fichiers:0,jours:0,seances:0,du:null,au:null,erreurs:[]};
  for(const f of files){
    try{
      const d=await parseExport(f,zones);
      if(!d.du){res.erreurs.push(f.name+" : aucune donnée quotidienne lisible.");continue;}
      storeDigest(d);
      res.jours+=mergeDigest(d);
      res.seances+=d.seances.length;
      res.fichiers++;
      if(!res.du||d.du<res.du)res.du=d.du;
      if(!res.au||d.au>res.au)res.au=d.au;
    }catch(e){res.erreurs.push(f.name+" : "+(e&&e.message||e));}
  }
  if(res.fichiers)save();
  return res;
}
/* Dernier digest couvrant une date, pour afficher la source d'une mesure. */
function digestAt(k){
  const L=DB.imports||[];
  for(let i=L.length-1;i>=0;i--)if(L[i].jours&&L[i].jours[k])return L[i];
  return null;
}
function seancesAt(k){
  const L=DB.imports||[],out=[],vus={};
  for(let i=L.length-1;i>=0;i--)(L[i].seances||[]).forEach(s=>{
    if(s.date!==k)return;
    const id=s.heureCle+"|"+s.kind;
    if(vus[id])return;vus[id]=1;out.push(s);
  });
  return out.sort((a,b)=>String(a.debut).localeCompare(String(b.debut)));
}

/* ================= Doctrine, bloc ÉTAT, clé API =================
   Trois choses qui ne vivent que sur cet appareil.

   La doctrine contient un dossier médical nominatif et des éléments
   professionnels. Le bloc ÉTAT porte les valeurs du moment. La clé API
   ouvre un compte facturable. Aucun des trois n'entre dans le dépôt, qui
   est public.

   La clé est rangée sous sa PROPRE clé de stockage, hors de DB. C'est
   volontaire : tout export sérialise DB, et une exclusion qu'il faut
   penser à écrire est une exclusion qu'on oublie un jour. Là, aucun
   export ne peut la porter, même par accident. */
const AKEY="pimperel-key";
function apiKey(){try{return localStorage.getItem(AKEY)||"";}catch(e){return "";}}
function setApiKey(v){
  try{ v?localStorage.setItem(AKEY,v):localStorage.removeItem(AKEY); }catch(e){}
}
/* Une clé ne s'affiche jamais en entier : on montre de quoi la
   reconnaître, pas de quoi la recopier. */
function keyMask(k){
  if(!k)return "";
  return k.length<=14?"clé enregistrée":k.slice(0,11)+"…"+k.slice(-4);
}
const MODELE_DEFAUT="claude-opus-5";
function modele(){return (DB.settings.api||{}).model||MODELE_DEFAUT;}
/* Le plan n'est pas l'analyse. Le raisonnement se fait dans l'appel A ;
   l'appel B met en forme quatorze jours, jusqu'à dix mille jetons de
   sortie. Sur le plus gros modèle, c'est plusieurs minutes de flux sur un
   téléphone qui doit rester allumé — et chaque reprise après coupure
   repart de zéro. Un modèle rapide y suffit et divise l'attente. */
const MODELE_PLAN_DEFAUT="claude-sonnet-5";
function modelePlan(){return (DB.settings.api||{}).modelPlan||MODELE_PLAN_DEFAUT;}

/* Empreinte courte, pour savoir d'un coup d'œil si le fichier importé est
   bien celui qu'on croit. SHA-256 tronqué — il s'agit d'identifier une
   révision, pas de résister à une attaque. */
async function sha12(txt){
  try{
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(b)).slice(0,6).map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){
    /* Pas de crypto.subtle hors HTTPS : une empreinte dégradée vaut mieux
       que pas d'empreinte, elle sert juste à comparer deux imports. */
    let h=2166136261;
    for(let i=0;i<txt.length;i++){h^=txt.charCodeAt(i);h=Math.imul(h,16777619);}
    return "x"+(h>>>0).toString(16).padStart(8,"0");
  }
}
/* « *Révision du 1er septembre 2026. Prochaine revue : …* » */
function doctrineRevision(txt){
  const m=/R[ée]vision\s+du\s+([^.*\n]{3,40})/i.exec(txt||"");
  return m?m[1].trim():null;
}
const DOCTRINE_MIN=2000;   /* en dessous, ce n'est pas la doctrine */
async function importDoctrine(file){
  const txt=await file.text();
  if(txt.length<DOCTRINE_MIN)
    throw new Error("Ce fichier fait "+txt.length+" caractères : ce n'est pas la doctrine.");
  if(!/^#\s/m.test(txt))
    throw new Error("Ce fichier n'a aucun titre markdown : vérifie que c'est bien le bon.");
  const d={texte:txt,revision:doctrineRevision(txt),hash:await sha12(txt),
           importe:TODAY,nom:file.name,taille:txt.length};
  /* L'ancienne version est gardée : une revue trimestrielle qui se
     trompe de fichier doit pouvoir revenir en arrière. Deux, pas plus. */
  if(DB.doctrine&&DB.doctrine.texte){
    if(!Array.isArray(DB.doctrineHistory))DB.doctrineHistory=[];
    DB.doctrineHistory.push(DB.doctrine);
    while(DB.doctrineHistory.length>2)DB.doctrineHistory.shift();
  }
  DB.doctrine=d;
  save();
  return d;
}
function aDoctrine(){return !!(DB.doctrine&&DB.doctrine.texte);}
/* Ce qui manque pour lancer une revue. Nommé, jamais deviné. */
function revuePrete(){
  const m=[];
  if(!aDoctrine())m.push("la doctrine");
  if(!apiKey())m.push("la clé API");
  if(!(DB.imports||[]).length)m.push("un import de données");
  return m;
}

/* ================= Appels à l'API (§5) =================
   Deux appels, jamais un. L'analyse est lisible tout de suite pendant que
   le plan se fabrique, et deux sorties moyennes sont plus fiables qu'une
   sortie unique de vingt mille jetons.

   Les deux forcent un outil : on ne parse jamais du markdown. Le résultat
   se lit dans le bloc de type "tool_use", trouvé PAR TYPE et jamais par
   index — l'ordre des blocs n'est pas garanti. */
const API_URL="https://api.anthropic.com/v1/messages";
const API_VER="2023-06-01";
/* Sans cet en-tête, le navigateur reçoit un 401 CORS et rien d'autre. */
const API_BROWSER="anthropic-dangerous-direct-browser-access";

/* Erreur d'appel portant de quoi décider : réessayer ou non. */
function ApiErr(msg,statut,rejouable){
  const e=new Error(msg);e.statut=statut;e.rejouable=!!rejouable;return e;
}
function messageStatut(st,corps){
  if(st===401)return "Clé API refusée (401). Vérifie-la dans Réglages, l'engrenage en haut à droite.";
  if(st===403)return "Clé sans droit d'accès (403).";
  if(st===429)return "Quota atteint (429). Réessaie dans quelques minutes.";
  if(st===400)return "Requête refusée (400) : "+(corps||"").slice(0,200);
  if(st>=500) return "Panne côté serveur ("+st+").";
  return "Réponse inattendue ("+st+").";
}
/* Deux tentatives, 2 s puis 8 s, et seulement sur ce qui peut passer :
   réseau et 5xx. Un 401 ne devient pas vrai en insistant. */
const RETRIES=[2000,8000];
/* « Load failed » est le message brut de Safari pour une requête coupée.
   Il ne dit rien d'actionnable ; celui-ci, si. */
const MSG_FLUX="La connexion s'est interrompue pendant la génération du plan. "+
  "Elle dure jusqu'à une minute et demie : garde l'écran allumé et l'app au premier plan.";
async function apiFetch(body,onStream,onEssai){
  const key=apiKey();
  if(!key)throw ApiErr("Aucune clé API enregistrée.",0,false);
  let derniere=null;
  for(let essai=0;essai<=RETRIES.length;essai++){
    if(essai){
      /* Une reprise repart de zéro : sans le dire, la barre reculait et
         l'attente semblait doubler sans raison. */
      if(onEssai)onEssai(essai+1,RETRIES.length+1,derniere);
      await new Promise(r=>setTimeout(r,RETRIES[essai-1]));
    }
    let rep;
    try{
      rep=await fetch(API_URL,{method:"POST",headers:{
        "content-type":"application/json","x-api-key":key,
        "anthropic-version":API_VER,[API_BROWSER]:"true"
      },body:JSON.stringify(body)});
    }catch(e){
      /* Panne réseau, ou Safari qui suspend la requête en arrière-plan. */
      derniere=ApiErr("Le réseau n'a pas répondu. Vérifie la connexion, puis relance.",0,true);
      continue;
    }
    if(rep.ok){
      if(!onStream)return await rep.json();
      /* La lecture du flux est dans la boucle de reprise : une coupure à
         mi-parcours se rejoue, elle ne remonte plus en exception nue. */
      try{ return await lireSSE(rep,onStream); }
      catch(e){
        if(!e.rejouable)throw e;
        derniere=e;continue;
      }
    }
    const corps=await rep.text().catch(()=>"");
    const err=ApiErr(messageStatut(rep.status,corps),rep.status,rep.status>=500);
    if(!err.rejouable)throw err;
    derniere=err;
  }
  throw derniere||ApiErr("Appel impossible.",0,false);
}
/* SSE : découper sur les lignes vides, ne lire que les lignes data:, et
   accumuler les fragments d'arguments d'outil. Le JSON n'est parsé qu'au
   content_block_stop — un input_json_delta seul n'est jamais du JSON
   valide, c'est un morceau de chaîne. */
async function lireSSE(rep,onStream){
  if(!rep.body)throw ApiErr("Ce navigateur ne sait pas lire une réponse en flux.",0,false);
  const lect=rep.body.getReader(),dec=new TextDecoder();
  let tampon="",json="",fini=null,texte="";
  for(;;){
    let pas;
    /* Une coupure EN COURS de flux n'était rattrapée par rien : elle
       remontait telle quelle, « Load failed », hors de la boucle de
       reprise. Sur iOS, passer en arrière-plan pendant la génération
       suffit à la provoquer. */
    try{ pas=await lect.read(); }
    catch(e){ throw ApiErr(MSG_FLUX,0,true); }
    const {done,value}=pas;
    if(done)break;
    tampon+=dec.decode(value,{stream:true});
    let i;
    while((i=tampon.indexOf("\n\n"))>=0){
      const bloc=tampon.slice(0,i);tampon=tampon.slice(i+2);
      bloc.split("\n").forEach(ligne=>{
        if(ligne.indexOf("data:")!==0)return;
        let ev;
        try{ev=JSON.parse(ligne.slice(5).trim());}catch(e){return;}
        if(ev.type==="content_block_delta"&&ev.delta){
          if(ev.delta.type==="input_json_delta"){json+=ev.delta.partial_json||"";}
          else if(ev.delta.type==="text_delta"){texte+=ev.delta.text||"";}
          if(onStream)onStream(json.length+texte.length);
        }else if(ev.type==="content_block_stop"&&json){
          try{fini=JSON.parse(json);}catch(e){fini=null;}
        }else if(ev.type==="error"){
          throw ApiErr("Erreur signalée par l'API : "+((ev.error||{}).message||"inconnue"),0,false);
        }
      });
    }
  }
  if(fini===null&&json){try{fini=JSON.parse(json);}catch(e){}}
  if(fini===null)throw ApiErr(MSG_FLUX,0,true);
  return{outil:fini,texte:texte};
}
/* Sortie d'outil d'une réponse non streamée : par type, jamais par index. */
function sortieOutil(data){
  const blocs=(data&&data.content)||[];
  for(let i=0;i<blocs.length;i++)if(blocs[i].type==="tool_use")return blocs[i].input;
  return null;
}

/* --- Les deux schémas (§7) --- */
const SCHEMA_REVUE={
  type:"object",
  properties:{
    registre:{type:"integer",enum:[1,2,3,4]},
    registreMotif:{type:"string"},
    registreExpire:{type:["string","null"],description:"date ISO, obligatoire si registre vaut 4"},
    analyse:{type:"string",description:"texte court, chiffré, sans préambule"},
    actionsFaites:{type:"array",items:{type:"string"}},
    actionsManquees:{type:"array",items:{type:"string"}},
    indicateurs:{type:"array",items:{type:"object",properties:{
      nom:{type:"string"},valeur:{type:["number","null"]},tendance:{type:["number","null"]},
      cible:{type:["number","null"]},statut:{type:"string",enum:["ok","derive","alerte"]}
    },required:["nom","statut"]}},
    alertes:{type:"array",items:{type:"object",properties:{
      code:{type:"string"},texte:{type:"string"}},required:["code","texte"]}},
    apport:{type:"object",properties:{
      joursRenseignes:{type:"integer"},kcalMoyEstime:{type:["number","null"]},
      protMoyEstime:{type:["number","null"]},ecartHypothese:{type:["number","null"]},
      incertitude:{type:"string"},lecture:{type:"string"}
    },required:["joursRenseignes","lecture"]},
    etat:{type:"string",description:"bloc ÉTAT régénéré, texte complet, prêt à être rechargé"}
  },
  required:["registre","registreMotif","analyse","actionsFaites","actionsManquees",
            "indicateurs","alertes","apport","etat"]
};
const SCHEMA_SEANCE={type:"object",properties:{
  rank:{type:"string",enum:["P1","P2","P3"]},
  kind:{type:"string",enum:["salle","course","vtt","rando","natation","mobilite","qualite","autre"]},
  label:{type:"string"},detail:{type:"string"},fallback:{type:"string"},
  bonus:{type:"boolean"}},required:["rank","kind","label"]};
const SCHEMA_PLAN={
  type:"object",
  properties:{
    genere:{type:"string"},
    semaines:{type:"array",items:{type:"object",properties:{
      start:{type:"string"},
      regime:{type:"string",enum:["calme","normale","chargee","vacances"]},
      runCapKm:{type:"number"},
      jours:{type:"array",items:{type:"object",properties:{
        d:{type:"string"},fascia:{type:"boolean"},
        seances:{type:"array",items:SCHEMA_SEANCE},
        nutrition:{type:"object",properties:{
          feculentDiner:{type:"boolean"},feculentG:{type:["number","null"]},
          creneaux:{type:"array",items:{type:"object",properties:{
            h:{type:"string"},contenu:{type:"string"},prot:{type:["number","null"]},
            subi:{type:"boolean"}},required:["h","contenu"]}},
          kcal:{type:"number"},prot:{type:"number"},alcool:{type:["number","null"]}
        },required:["feculentDiner","creneaux","kcal","prot"]},
        note:{type:"string"}
      },required:["d","fascia","seances","nutrition"]}}
    },required:["start","regime","runCapKm","jours"]}},
    courses:{type:"array",items:{type:"string"}},
    prepDimanche:{type:"array",items:{type:"string"}},
    backfill:{type:"object",additionalProperties:true}
  },
  required:["genere","semaines"]
};

/* --- Le contexte envoyé, dans l'ordre imposé par la doctrine §13 :
   agenda de la session > bloc ÉTAT > doctrine. La doctrine part en system
   prompt, telle quelle, sans reformulation. --- */
function blocAgenda(){
  const mon=mondayOf(TODAY),s1=addDays(mon,7),s2=addDays(mon,14);
  const a=DB.agenda||{};
  return{
    semaines:[s1,s2].map(m=>({start:m,regime:regimeOf(m),note:a[m]||null})),
    chargePro:DB.charge[(lastDigest()||{}).semaineDu]||null
  };
}
/* Deux tailles de contexte. L'appel A a besoin du détail : c'est lui qui
   analyse. L'appel B reçoit la revue qui vient d'en sortir — lui renvoyer
   quarante-quatre jours de lignes brutes rallonge la requête et le temps
   avant le premier jeton, sans rien apprendre de plus. */
function contexteRevue(compact){
  const d=lastDigest();
  const dig=!d?null:(compact
    ?{du:d.du,au:d.au,semaineDu:d.semaineDu,semaine:d.semaine,
      manquant:d.manquant,seances:weekSeances(d),methodeHorsZone:d.methodeHorsZone}
    :{du:d.du,au:d.au,semaineDu:d.semaineDu,semaine:d.semaine,
      manquant:d.manquant,jours:d.jours,seances:d.seances,
      methodeHorsZone:d.methodeHorsZone});
  return{
    aujourdhui:TODAY,
    agenda:blocAgenda(),
    etat:DB.etat||null,
    digest:dig,
    historique:(DB.imports||[]).map(x=>Object.assign({semaine:x.semaineDu},x.semaine)),
    journal:contextBlock().journal14,
    cibles:ciblesPourModele(),
    references:DB.settings.refs||{},
    /* Premier appel : l'ÉTAT n'existe pas, il faut le produire en entier. */
    etatAProduire:!DB.etat
  };
}
const CONSIGNE_A=
 "Tu reçois les données mesurées de la semaine écoulée et le journal déclaratif. "+
 "Produis la revue du dimanche en appelant l'outil rendre_revue, et rien d'autre. "+
 "Le champ analyse est court et chiffré, sans préambule ni formule d'ouverture. "+
 "Le champ etat contient le bloc ÉTAT régénéré en entier, prêt à être rechargé tel quel la semaine suivante. "+
 "Si aucun bloc ÉTAT ne t'est fourni, produis-le intégralement à partir des données reçues, "+
 "compteurs de registre initialisés à zéro — un compteur qu'on ne peut pas reconstituer se réamorce, il ne se devine pas. "+
 "Pour l'apport, estime sur les menus en clair du journal, en un seul lot sur la semaine, "+
 "et dis sur combien de jours renseignés tu as estimé. N'invente pas de journée manquante.";
function consigneB(){
  const F=planFenetre(),W=semainesFenetre();
  return "Tu reçois la revue que tu viens de produire. Établis maintenant le plan en appelant l'outil rendre_plan, et rien d'autre. "+
   "Il couvre EXACTEMENT du "+F.debut+" au "+F.fin+" inclus, jour par jour, sans trou. "+
   "Semaines calendaires, champ start = date du lundi : "+W.map(w=>w.start+" (jours "+w.jours[0]+" → "+w.jours[w.jours.length-1]+")").join(" ; ")+". "+
   "La première semaine peut être partielle : ne remplis que ses jours listés. "+
   "Respecte les régimes de l'agenda et le plafond de course. "+
   "Sois concis : chaque champ texte tient en une ligne, sans phrase d'explication — le détail d'une séance est une liste de mouvements et de charges, un créneau de repas est une liste d'aliments et de portions. "+
   "Le champ backfill reste vide : l'app le remplit elle-même depuis les mesures importées.";
}

function corpsA(){
  return{
    model:modele(),max_tokens:4000,
    system:[{type:"text",text:DB.doctrine.texte,cache_control:{type:"ephemeral"}}],
    tools:[{name:"rendre_revue",description:"Revue hebdomadaire structurée.",input_schema:SCHEMA_REVUE}],
    tool_choice:{type:"tool",name:"rendre_revue"},
    messages:[{role:"user",content:CONSIGNE_A+"\n\n"+JSON.stringify(contexteRevue())}]
  };
}
function corpsB(revue,violations){
  const msgs=[
    {role:"user",content:CONSIGNE_A+"\n\n"+JSON.stringify(contexteRevue(true))},
    {role:"assistant",content:[{type:"text",text:JSON.stringify(revue)}]},
    {role:"user",content:consigneB()}
  ];
  /* Relance : le plan refusé n'est pas renvoyé, seules les violations le
     sont. Rejouer une sortie fautive invite à la reproduire. */
  if(violations&&violations.length)
    msgs.push({role:"user",content:
      "Le plan précédent viole des règles non négociables. Reprends-le en les corrigeant, "+
      "sans rien changer d'autre :\n- "+violations.map(v=>v.code+" : "+v.texte).join("\n- ")});
  return{
    model:modelePlan(),max_tokens:16000,stream:true,
    system:[{type:"text",text:DB.doctrine.texte,cache_control:{type:"ephemeral"}}],
    tools:[{name:"rendre_plan",description:"Plan structuré de quatorze jours.",input_schema:SCHEMA_PLAN}],
    tool_choice:{type:"tool",name:"rendre_plan"},
    messages:msgs
  };
}

/* --- Appel A. Son résultat est écrit en base AVANT tout appel B :
   sur iOS, une requête en cours est suspendue dès que Safari passe en
   arrière-plan, et quatre-vingt-dix secondes suffisent à ce que ça
   arrive. Un plan qui échoue laisse alors une revue exploitable. --- */
/* Estimation quotidienne de l'apport, à la demande — sur Valider, jamais
   d'elle-même. C'est un choix de l'utilisateur, pris en connaissance de
   cause : la doctrine proscrit le compteur quotidien, il l'a demandé quand
   même. Ce qui reste de l'esprit de la règle : une fourchette, pas un
   solde ; un tap, pas une jauge ; et rien ne s'affiche en rouge ou en vert. */
let estBusy=null;
const SCHEMA_APPORT={type:"object",properties:{
  kcal:{type:"integer"},prot:{type:"integer"},
  incertitude:{type:"string",description:"ex. ±300 kcal"},
  lecture:{type:"string",description:"une phrase courte, ou vide"}},
  required:["kcal","prot","incertitude"]};
async function estimerJour(k){
  const e=entry(k),menu=String(e.menu||"").trim();
  if(!menu){e.apport={err:"Écris d'abord le menu."};save();render();return;}
  if(!apiKey()){e.apport={err:"Pas de clé API : aucune estimation."};save();render();return;}
  estBusy=k;render();
  try{
    const data=await apiFetch({
      model:modele(),max_tokens:200,
      system:"Tu estimes l'apport d'une journée à partir d'un menu écrit en clair, sans quantités précises. "+
        "Donne une fourchette honnête, en kilocalories et en grammes de protéines. Portions françaises usuelles. "+
        "Réponds uniquement par l'outil.",
      tools:[{name:"estimer_apport",description:"Estimation d'une journée.",input_schema:SCHEMA_APPORT}],
      tool_choice:{type:"tool",name:"estimer_apport"},
      messages:[{role:"user",content:"Menu du "+k+" : "+menu}]
    });
    const r=sortieOutil(data);
    if(!r||typeof r.kcal!=="number")throw new Error("Réponse inexploitable.");
    e.apport={kcal:Math.round(r.kcal),prot:Math.round(r.prot),inc:r.incertitude||"",quand:TODAY,menu:menu};
  }catch(x){e.apport={err:(x&&x.message)||String(x)};}
  estBusy=null;save();render();
}
async function appelA(onEssai){
  const manque=revuePrete();
  if(manque.length)throw ApiErr("Revue impossible : il manque "+manque.join(", ")+".",0,false);
  const data=await apiFetch(corpsA(),null,onEssai);
  const r=sortieOutil(data);
  if(!r||typeof r.analyse!=="string")throw ApiErr("Réponse sans revue exploitable.",0,true);
  rangerRevue(r);
  return r;
}
/* Une revue est identifiée par sa semaine : relancer sur la même semaine
   remplace l'entrée, n'en empile pas une seconde. */
function rangerRevue(r){
  const d=lastDigest(),sem=(d&&d.semaineDu)||mondayOf(TODAY);
  /* Les signaux du jour sont figés dans la revue : G11c compte deux revues
     consécutives, et il lui faut celle d'avant telle qu'elle était. */
  const sl=avg(vals(lastN(TODAY,7),"sleep"));
  const bs=lastN(addDays(TODAY,-1),7),ej=DB.days[TODAY]||{};
  const rj=num(ej.rhr),rb=avg(vals(bs,"rhr"));
  const sg=[];
  if(rj!==null&&rb!==null&&rj>rb+G_RHR_ECART)sg.push("FC de repos au-dessus de la moyenne 7 jours");
  if(sl!==null&&sl<G_SOMMEIL_SEUIL)sg.push("sommeil moyen sous "+fmtDur(G_SOMMEIL_SEUIL));
  if(lastN(TODAY,7).some(k=>{const x=rd(k);return x.seanceNote&&String(x.seanceNote).trim();}))
    sg.push("commentaire sur une séance de salle");
  const e={date:TODAY,semaine:sem,signaux:sg,registre:r.registre,registreMotif:r.registreMotif,
           registreExpire:r.registreExpire||null,analyse:r.analyse,
           actionsFaites:r.actionsFaites||[],actionsManquees:r.actionsManquees||[],
           indicateurs:r.indicateurs||[],alertes:r.alertes||[],apport:r.apport||null,
           modele:modele(),modelePlan:modelePlan(),digestRef:d?d.du+"→"+d.au:null};
  if(!Array.isArray(DB.reviews))DB.reviews=[];
  /* Jalons : la forme est ici, les valeurs viennent de l'appareil. */
  if(!DB.milestones)DB.milestones={};
  ["poids","taille","vol","sommeil","prot","vo2","fcRepos","alcool"].forEach(x=>{
    if(!DB.milestones[x])DB.milestones[x]={};
  });
  if(!Array.isArray(DB.milestones.tests))DB.milestones.tests=[];
  if(!Array.isArray(DB.milestones.allures))DB.milestones.allures=[];
  const i=DB.reviews.findIndex(x=>x.semaine===sem);
  if(i>=0)DB.reviews[i]=e;else DB.reviews.push(e);
  DB.reviews.sort((a,b)=>String(a.semaine).localeCompare(String(b.semaine)));
  while(DB.reviews.length>12)DB.reviews.shift();
  if(typeof r.etat==="string"&&r.etat.trim())DB.etat=r.etat;
  save();
}
async function appelB(revue,onStream,violations,onEssai){
  const res=await apiFetch(corpsB(revue,violations),onStream||function(){},onEssai);
  const p=res.outil;
  if(!p||!Array.isArray(p.semaines)||!p.semaines.length)
    throw ApiErr("Réponse sans plan exploitable.",0,true);
  return p;
}

/* ================= Garde-fous déterministes (§6) =================
   Le modèle propose, le code vérifie. Ces règles viennent de la doctrine
   et ne sont pas négociables par le modèle : elles sont écrites ici, pas
   dans un prompt, parce qu'un prompt se discute et pas un test.

   Trois conduites, jamais mélangées :
     rejet     — la sortie est refusée, l'appel est relancé une fois avec
                 la liste des violations ;
     correction— le plan est modifié sur place et le drapeau reste visible ;
     ajout     — ce qui manquait est ajouté sans rien refuser.

   Après une relance qui viole encore, le plan est appliqué avec un bandeau
   rouge listant les écarts. Jamais appliqué en silence. */

/* --- Vocabulaire des séances, tel qu'il circule dans le plan --- */
function sTexte(s){
  return [s.label,s.detail,s.fallback].filter(Boolean).join(" ").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"");
}
function toutesSeances(p){
  const out=[];
  (p.semaines||[]).forEach(w=>(w.jours||[]).forEach(d=>
    (d.seances||[]).forEach(s=>out.push({s:s,d:d,w:w}))));
  return out;
}
function tousJours(p){
  const out=[];
  (p.semaines||[]).forEach(w=>(w.jours||[]).forEach(d=>out.push({d:d,w:w})));
  return out;
}
/* Le lundi, au sens du calendrier : le plan dit des dates, pas des noms. */
function estLundi(k){return isDate(k)&&parseD(k).getDay()===1;}

/* --- Seuils portés par la doctrine, pas par le code d'affichage --- */
const G_PRESSE_MAX=90;        /* kg, presse à cuisses bilatérale */
const G_KCAL_NORMAL=2000, G_KCAL_MARGE=100, G_KCAL_VACANCES=2400;
const G_PROT_MIN=150, G_PROT_MAX=170;
const G_SOMMEIL_SEUIL=6.75;   /* 6 h 45 */
const G_RHR_ECART=5;          /* bpm au-dessus de la moyenne 7 jours */
const G_COMPLEMENTS=/whey|vitamine d|vitamin d/;

/* Une violation nomme la règle, ce qui l'a déclenchée, et ce qui a été
   fait. Le modèle la relit telle quelle à la relance. */
function viol(code,texte,conduite){return{code:code,texte:texte,conduite:conduite};}

function verifierPlan(p,ctx){
  const V=[],C=ctx||{};
  const S=toutesSeances(p),J=tousJours(p);

  /* G1 · squat barre — proscrit, sans exception. */
  S.forEach(x=>{
    if(/squat.{0,12}barre|barre.{0,12}squat|back squat/.test(sTexte(x.s)))
      V.push(viol("G1","Séance du "+x.d.d+" : squat barre proscrit — « "+x.s.label+" ».","rejet"));
  });

  /* G2 · presse à cuisses au-delà du plafond bilatéral. */
  S.forEach(x=>{
    const t=sTexte(x.s);
    if(!/presse/.test(t))return;
    const m=t.match(/(\d{2,3})\s*kg/g)||[];
    m.forEach(z=>{
      const kg=parseInt(z,10);
      if(kg>G_PRESSE_MAX)
        V.push(viol("G2","Séance du "+x.d.d+" : presse à "+kg+" kg, plafond "+G_PRESSE_MAX+" kg.","rejet"));
    });
  });

  /* G3 · air fryer, et recettes longues en semaine. */
  J.forEach(x=>{
    const n=x.d.nutrition||{},jour=parseD(x.d.d).getDay();
    (n.creneaux||[]).forEach(c=>{
      const t=String(c.contenu||"").toLowerCase();
      if(/air ?fryer|friteuse/.test(t))
        V.push(viol("G3","Repas du "+x.d.d+" : air fryer.","rejet"));
      const m=t.match(/(\d{2,3})\s*min/);
      if(m&&jour>=1&&jour<=5&&+m[1]>10)
        V.push(viol("G3","Repas du "+x.d.d+" : "+m[1]+" min de préparation un jour de semaine, plafond 10 min.","rejet"));
    });
  });

  /* G4 · volume de course. Le plafond de période s'applique toujours ; la
     règle des +10 % ne joue que si une semaine complète est close —
     sinon il n'y a rien dont on puisse prendre 10 %. La logique de
     plafond existante fait foi, elle n'est pas réécrite ici. */
  (p.semaines||[]).forEach(w=>{
    const km=(w.jours||[]).reduce((n,d)=>n+(d.seances||[])
      .filter(s=>s.kind==="course").reduce((m,s)=>m+(num(s.km)||0),0),0);
    const dur=runAbsMax();
    let plafond=Math.min(num(w.runCapKm)===null?dur:num(w.runCapKm),dur);
    if(C.semaineClose&&C.kmSemaineClose!==null&&C.kmSemaineClose!==undefined){
      const dix=r1(C.kmSemaineClose*1.1);
      if(dix<plafond)plafond=dix;
    }
    if(num(w.runCapKm)!==null&&num(w.runCapKm)>dur)
      V.push(viol("G4","Semaine du "+w.start+" : plafond annoncé "+w.runCapKm+" km, ramené au plafond dur de "+dur+" km.","correction"));
    if(km>plafond+0.05)
      V.push(viol("G4","Semaine du "+w.start+" : "+r1(km)+" km de course prévus pour un plafond de "+plafond+" km.","correction"));
  });

  /* G5 · nombre de sorties. Le volume ne doit jamais supposer plus de
     sorties que la structure hebdomadaire n'en garantit, plus une. */
  (p.semaines||[]).forEach(w=>{
    const n=(w.jours||[]).reduce((m,d)=>m+(d.seances||[]).filter(s=>s.kind==="course").length,0);
    const garanties=1,max=garanties+1;
    if(n>max)
      V.push(viol("G5","Semaine du "+w.start+" : "+n+" sorties de course pour un maximum de "+max+".","rejet"));
  });

  /* G6 · le lundi soir porte toujours une séance de salle P1. C'est le
     créneau non négociable de la structure hebdomadaire. */
  (p.semaines||[]).forEach(w=>{
    const lundi=(w.jours||[]).filter(d=>estLundi(d.d))[0];
    if(!lundi){
      /* Le lundi de cette semaine est déjà passé : la semaine est partielle
         par construction, il n'y a rien à exiger. */
      if(w.start<planFenetre().debut)return;
      V.push(viol("G6","Semaine du "+w.start+" : aucun lundi dans les jours fournis.","rejet"));
      return;
    }
    const ok=(lundi.seances||[]).some(s=>s.kind==="salle"&&s.rank==="P1");
    if(!ok)V.push(viol("G6","Lundi "+lundi.d+" : pas de séance de salle P1.","rejet"));
  });

  /* G7 · apport planifié. La fenêtre dépend du régime : un régime
     vacances à 2 000 kcal ferait un déficit au-delà du plafond. */
  J.forEach(x=>{
    const n=x.d.nutrition;
    if(!n)return;
    const vac=x.w.regime==="vacances";
    const cible=vac?G_KCAL_VACANCES:G_KCAL_NORMAL;
    const kcal=num(n.kcal),prot=num(n.prot);
    if(kcal!==null&&Math.abs(kcal-cible)>G_KCAL_MARGE)
      V.push(viol("G7","Repas du "+x.d.d+" : "+kcal+" kcal pour une cible de "+cible+" ± "+G_KCAL_MARGE+
        " en régime "+(x.w.regime||"normale")+".","rejet"));
    if(prot!==null&&(prot<G_PROT_MIN||prot>G_PROT_MAX))
      V.push(viol("G7","Repas du "+x.d.d+" : "+prot+" g de protéines, fenêtre "+G_PROT_MIN+"-"+G_PROT_MAX+" g.","rejet"));
  });

  /* G8 · féculent au dîner seulement les jours à séance, dimanche excepté. */
  J.forEach(x=>{
    const n=x.d.nutrition;
    if(!n||!n.feculentDiner)return;
    const aSeance=(x.d.seances||[]).length>0,dim=parseD(x.d.d).getDay()===0;
    if(!aSeance&&!dim)
      V.push(viol("G8","Repas du "+x.d.d+" : féculent au dîner sans séance ce jour-là.","rejet"));
  });

  /* G9 · protocole tendineux tous les jours. Un oubli s'ajoute, il ne se
     refuse pas : la prescription est quotidienne et sans discussion. */
  J.forEach(x=>{
    if(!x.d.fascia){
      x.d.fascia=true;
      V.push(viol("G9","Jour du "+x.d.d+" : protocole tendineux absent, ajouté.","ajout"));
    }
  });

  /* G10 · registre 4 sans date de péremption. */
  if(C.registre===4&&!isDate(C.registreExpire))
    V.push(viol("G10","Registre 4 invoqué sans date de péremption.","rejet"));

  /* G11a · FC de repos au-dessus de la moyenne, ou VFC en chute : la
     séance d'intensité devient facile. Elle n'est pas supprimée. */
  if(C.signalRhr||C.signalVfc){
    S.forEach(x=>{
      if(x.s.kind!=="qualite")return;
      x.s.kind="course";
      x.s.label=String(x.s.label||"Séance")+" — convertie en facile";
      x.s.detail="Allure basse, aucune intensité : "+(C.signalRhr?"FC de repos au-dessus de la moyenne 7 jours":"VFC en chute nette")+".";
      V.push(viol("G11a","Séance d'intensité du "+x.d.d+" convertie en facile.","correction"));
    });
  }
  /* G11b · sommeil moyen sous le seuil : la séance d'intensité SAUTE.
     Elle n'est pas dégradée, elle disparaît — la distinction avec G11a
     est explicite dans la doctrine. */
  if(C.sommeil7!==null&&C.sommeil7!==undefined&&C.sommeil7<G_SOMMEIL_SEUIL){
    (p.semaines||[]).forEach(w=>(w.jours||[]).forEach(d=>{
      const avant=(d.seances||[]).length;
      d.seances=(d.seances||[]).filter(s=>s.kind!=="qualite");
      if(d.seances.length<avant)
        V.push(viol("G11b","Séance d'intensité du "+d.d+" supprimée : sommeil moyen "+
          fmtDur(C.sommeil7)+" sous "+fmtDur(G_SOMMEIL_SEUIL)+".","correction"));
    }));
  }
  /* G11c · un signal d'arrêt présent deux revues consécutives : bascule
     du rythme de perte, sans demander l'avis de l'utilisateur, en
     nommant le signal. Le compteur vit dans DB, pas dans le plan. */
  if(C.arretSignal)
    V.push(viol("G11c","Signal d'arrêt du déficit sur deux revues consécutives — "+
      C.arretSignal+". Rythme ramené à −0,5 kg/semaine.","correction"));

  /* G12 · compléments hors whey et vitamine D. */
  J.forEach(x=>{
    const n=x.d.nutrition||{};
    (n.creneaux||[]).forEach(c=>{
      const t=String(c.contenu||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
      const m=t.match(/(creatine|bcaa|glutamine|beta.?alanine|omega ?3|magnesium|zinc|multivitamine|pre.?workout)/);
      if(m&&!G_COMPLEMENTS.test(t))
        V.push(viol("G12","Repas du "+x.d.d+" : complément hors whey et vitamine D — « "+m[1]+" ».","rejet"));
    });
  });

  /* G13 · aucun jour passé modifié. Ignoré silencieusement, sans rejet :
     un plan qui déborde sur hier n'est pas une faute, c'est un débord. */
  (p.semaines||[]).forEach(w=>{
    const avant=(w.jours||[]).length;
    w.jours=(w.jours||[]).filter(d=>isDate(d.d)&&d.d>=TODAY);
    if(w.jours.length<avant)
      V.push(viol("G13",(avant-w.jours.length)+" jour(s) passé(s) écarté(s) de la semaine du "+w.start+".","ajout"));
  });

  /* G14 · aucun chiffre de calories ni de protéines à l'échelle d'une
     journée. Les champs existent pour cette validation et restent
     internes : le contrôle d'interface se fait au rendu, pas ici. Ce qui
     se vérifie ici, c'est qu'aucun total ne s'est glissé dans un texte
     destiné à être affiché. */
  J.forEach(x=>{
    const t=[x.d.note].concat(((x.d.nutrition||{}).creneaux||[]).map(c=>c.contenu)).join(" ").toLowerCase();
    if(/\b\d{3,4}\s*(kcal|calories)\b/.test(t))
      V.push(viol("G14","Jour du "+x.d.d+" : un total de calories apparaît dans un texte affiché.","rejet"));
  });

  /* G15 · aucun champ de saisie ne redemande une donnée du zip. Règle
     d'interface, vérifiée par les tests sur le formulaire, pas sur le
     plan : rien à contrôler ici, et l'affirmer serait mentir. */

  /* G16 · aucune donnée personnelle dans les fichiers du dépôt. Même
     nature : c'est une règle sur le dépôt, tenue par les tests et par
     .gitignore, pas par une inspection de la sortie du modèle. */

  return V;
}
function rejets(V){return V.filter(x=>x.conduite==="rejet");}

/* --- Le contexte dont les garde-fous ont besoin, calculé une fois --- */
function contexteGardes(revue){
  const mon=mondayOf(TODAY);
  const base=lastN(addDays(TODAY,-1),7);
  const e=DB.days[TODAY]||{};
  const rhr=num(e.rhr),rB=avg(vals(base,"rhr"));
  const hrv=num(e.hrv),hB=avg(vals(base,"hrv"));
  const sl=avg(vals(lastN(TODAY,7),"sleep"));
  /* Une semaine est close si la précédente est entièrement derrière nous :
     sans cela, prendre 10 % d'un volume partiel donnerait un plafond faux. */
  const semPrec=addDays(mon,-7),close=addDays(semPrec,6)<TODAY;
  return{
    registre:revue?revue.registre:null,
    registreExpire:revue?revue.registreExpire:null,
    signalRhr:rhr!==null&&rB!==null&&rhr>rB+G_RHR_ECART,
    signalVfc:hrv!==null&&hB!==null&&hrv<hB*0.85,
    sommeil7:sl,
    semaineClose:close,
    kmSemaineClose:close?r1(total(vals(weekDays(semPrec),"runKm"))):null,
    arretSignal:signalArret()
  };
}
/* Compteur des signaux d'arrêt : deux revues consécutives portant le même
   signal déclenchent la bascule. Le compteur est persistant, il ne se
   recalcule pas à partir de rien à chaque revue. */
function signalArret(){
  const R=DB.reviews||[];
  if(R.length<1)return null;
  const sl=avg(vals(lastN(TODAY,7),"sleep"));
  const base=lastN(addDays(TODAY,-1),7);
  const e=DB.days[TODAY]||{};
  const rhr=num(e.rhr),rB=avg(vals(base,"rhr"));
  const notes=lastN(TODAY,7).some(k=>{const x=rd(k);return x.seanceNote&&String(x.seanceNote).trim();});
  const actuels=[];
  if(rhr!==null&&rB!==null&&rhr>rB+G_RHR_ECART)actuels.push("FC de repos au-dessus de la moyenne 7 jours");
  if(sl!==null&&sl<G_SOMMEIL_SEUIL)actuels.push("sommeil moyen sous "+fmtDur(G_SOMMEIL_SEUIL));
  if(notes)actuels.push("commentaire sur une séance de salle");
  if(!actuels.length)return null;
  const prec=(R[R.length-1]||{}).signaux||[];
  const commun=actuels.filter(x=>prec.indexOf(x)>=0);
  return commun.length?commun[0]:null;
}

/* --- Plan de repli (§8.4) ---
   La structure hebdomadaire garantie de la doctrine, en dur. Elle ne
   porte aucun chiffre personnel : ce sont des créneaux et des durées.
   Elle n'est jamais vide, c'est tout son intérêt. */
const REPLI=[
  {jour:1,rank:"P1",kind:"salle",label:"Salle 1 h — full body",
   detail:"Créneau non négociable. Les quatre mouvements de référence.",
   fallback:"30 min : les quatre mouvements, deux séries."},
  {jour:6,rank:"P1",kind:"salle",label:"Renforcement full body",
   detail:"Samedi matin.",fallback:"20 min de gainage et mobilité."},
  {jour:6,rank:"P1",kind:"course",label:"Course ≤ 40 min",
   detail:"Samedi fin d'après-midi. Allure d'endurance.",fallback:"20 min, allure libre."},
  {jour:0,rank:"P1",kind:"vtt",label:"VTT ~2 h",
   detail:"Dimanche.",fallback:"1 h, terrain roulant."}
];
/* La fenêtre d'un plan : de DEMAIN au dimanche qui suit le dimanche à
   venir. Un plan qui « commence lundi prochain » laissait toute la semaine
   en cours sans rien — c'est précisément la semaine qu'on vient de revoir.
   Le dimanche soir, ça fait quatorze jours ; un mardi, douze. La première
   semaine est alors partielle, et c'est normal. */
function planFenetre(){
  const debut=addDays(TODAY,1);
  let dim=TODAY;
  for(let i=0;i<7;i++){dim=addDays(dim,1);if(parseD(dim).getDay()===0)break;}
  return{debut:debut,fin:addDays(dim,7)};
}
/* Les jours de la fenêtre, regroupés par semaine calendaire (lundi). */
function semainesFenetre(){
  const F=planFenetre(),out=[];
  for(let k=F.debut;k<=F.fin;k=addDays(k,1)){
    const m=mondayOf(k);
    let w=out[out.length-1];
    if(!w||w.start!==m){w={start:m,jours:[]};out.push(w);}
    w.jours.push(k);
  }
  return out;
}
function planRepli(){
  const semaines=semainesFenetre().map(w=>({
    start:w.start,regime:"normale",runCapKm:lastCap(),
    jours:w.jours.map(k=>{
      const dow=parseD(k).getDay();
      return{d:k,fascia:true,
        seances:REPLI.filter(x=>x.jour===dow).map(x=>({rank:x.rank,kind:x.kind,
          label:x.label,detail:x.detail,fallback:x.fallback,bonus:false}))};
    })
  }));
  return{genere:TODAY,semaines:semaines,courses:[],prepDimanche:[],backfill:{},repli:true};
}

/* ================= Plan actif ================= */
function lastCap(){
  const ws=DB.plan&&DB.plan.weeks||[];
  for(let i=ws.length-1;i>=0;i--)if(num(ws[i].runCapKm)!==null)return num(ws[i].runCapKm);
  return 10;
}
function defaultWeek(mon){
  const cap=lastCap(),days=[];
  for(let i=0;i<7;i++){
    const ss=[];
    if(i===0)ss.push(SALLE);
    /* L'allure vient des jalons quand elle y est : une fourchette écrite
       dans le code serait une donnée de forme physique dans un dépôt
       public, et elle serait fausse dans six mois. */
    if(i===5){const al=paceAt(TODAY);
      ss.push({rank:"P1",kind:"course",label:"Sortie longue",detail:"Endurance"+(al?" "+al:"")+", "+cap+" km au plus — plafond de la dernière semaine connue.",fallback:"Moitié de la distance, allure libre."});}
    days.push({d:addDays(mon,i),fascia:i%2===0,sessions:ss});
  }
  return {start:mon,regime:"normale",runCapKm:cap,days:days,fallbackWeek:true};
}
/* Un plan qui n'a pas encore commencé n'est pas un plan expiré : on
   l'affiche tel quel. Seule une date postérieure au dernier jour couvert
   déclenche la semaine par défaut. */
function activePlan(){
  const ws=(DB.plan&&DB.plan.weeks)||[],all=[];
  ws.forEach(w=>(w.days||[]).forEach(d=>all.push(d.d)));
  if(!all.length)return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};
  if(all.indexOf(TODAY)>=0)return{weeks:ws,expired:false};
  const min=all.reduce((a,b)=>a<b?a:b);
  if(TODAY<min)return{weeks:ws,expired:false,pending:min};
  return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};
}
function weekOf(k){
  const ap=activePlan();
  for(const w of ap.weeks)if((w.days||[]).some(d=>d.d===k))return w;
  return null;
}
/* Semaine d'un lundi. On interroge d'abord w.start : une semaine dont les
   jours ne commencent pas au lundi — un plan qui démarre en milieu de
   semaine — n'était retrouvée par aucune sonde, si bien que son régime et
   son plafond retombaient sur les valeurs par défaut alors que l'en-tête
   de semaine, lui, affichait bien ceux du plan. La sonde sur les jours
   reste en repli, pour les semaines sans start exploitable. */
function weekAt(mon){
  const ap=activePlan();
  for(const w of ap.weeks)if(w.start===mon)return w;
  return weekOf(mon)||weekOf(addDays(mon,1));
}
function dayOf(k){
  const ap=activePlan();
  for(const w of ap.weeks)for(const d of (w.days||[]))if(d.d===k)return d;
  return null;
}

/* ================= Règles automatiques (§6) ================= */
/* Plafond dur en vigueur. Éditable dans Références : une révision de
   coaching ne doit pas dépendre d'un déploiement. */
function runAbsMax(){
  const v=num((DB.settings.refs||{}).runAbsMax);
  return v!==null&&v>0?v:RUN_ABS_MAX;
}
/* L'app ne calcule plus le plafond, elle affiche celui du plan et alerte
   au dépassement.
   Toute référence assise sur les seuls km courus se trompait : calée sur
   la semaine précédente elle effondrait le plafond après un déplacement
   (8 km courus → 8,8 autorisés) ; calée sur la meilleure des quatre, elle
   ne clippait plus rien pendant un mois (31,7 km début août → 34,9 de
   plafond, quand les deux semaines suivantes faisaient 11,3 et 6 km). Le
   volume de course est intermittent par construction : la randonnée s'y
   substitue — 62 km randonnés la semaine du 10/08, comptés zéro.
   Le seul garde-fou honnête est un plafond absolu, révisé à la main.
   implicit : semaine hors plan, qui ne s'est jamais vu opposer de
   plafond. La valeur sert l'alerte, pas la ligne de référence du graphe,
   qui inventerait un plafond rétroactif. */
function capFor(mon){
  const w=weekAt(mon),planned=w?num(w.runCapKm):null;
  const max=runAbsMax();
  return{
    cap:planned===null?max:Math.min(planned,max),
    clamped:planned!==null&&planned>max,
    planned:planned,implicit:planned===null,max:max
  };
}
/* Récupération : la valeur du jour est comparée à la moyenne des 7 jours
   qui la précèdent, pour que la mesure ne dilue pas sa propre référence.
   Le message dépend de ce qui est réellement au programme. Promettre
   qu'« une séance qualité passe en facile » un jour qui n'en porte pas —
   c'est-à-dire presque tous — annonçait une décision qui n'était prise
   nulle part. La séance est cherchée parmi celles RETENUES : sous régime
   chargé une P2 qualité est masquée, le bandeau ne doit pas promettre
   une conversion sur une séance invisible. */
function hasQualityToday(){
  const d=dayOf(TODAY);
  return !!(d&&kept(d).some(x=>x.s.kind==="qualite"));
}
function recovery(){
  const base=lastN(addDays(TODAY,-1),7);
  const e=DB.days[TODAY]; if(!e)return null;
  const rhr=num(e.rhr),hrv=num(e.hrv);
  const rB=avg(vals(base,"rhr")),hB=avg(vals(base,"hrv"));
  let metric=null,head="";
  if(rhr!==null&&rB!==null&&rhr>rB+5){
    metric="rhr";head="FC repos "+rhr+" bpm, soit +"+r1(rhr-rB)+" vs moyenne 7 j";
  }else if(hrv!==null&&hB!==null&&hrv<hB*0.85){
    metric="hrv";head="VFC "+hrv+" ms, soit "+r1((hrv/hB-1)*100)+" % vs moyenne 7 j";
  }else return null;
  return{metric:metric,text:head+(hasQualityToday()
    ?" — la séance qualité passe en facile."
    :" — pas d'intensité ajoutée aujourd'hui, allure basse sur ce qui est prévu.")};
}
function weightDrop(mon){
  const a=weekWeight(mon),b=weekWeight(addDays(mon,-7));
  if(a===null||b===null)return null;
  /* Une alerte de perte trop rapide assise sur deux pesées serait du
     bruit : les deux semaines comparées doivent être pleines. */
  if(weekWeightN(mon)<3||weekWeightN(addDays(mon,-7))<3)return null;
  /* Comparaison sur la valeur arrondie affichée : sans ça une baisse de
     0,7 kg pile déclenche l'alerte « au-delà de 0,7 kg » par flottant. */
  const d=r1(b-a);
  return d>0.7?d:null;
}
/* ================= Mois ================= */
const MOISKEY=k=>String(k).slice(0,7);
/* Horizon du dispositif. Août 2027 existe — c'est l'affûtage et le semi
   du 28 — mais il s'affiche à la demande : la trajectoire se pilote
   jusqu'en juillet. */
const HORIZON="2027-07";
function monthEnd(m){const a=m.split("-").map(Number);return iso(new Date(a[0],a[1],0));}
function monthStart(m){return m+"-01";}
function monthAt(m){for(const x of monthsTable())if(x.m===m)return x;return null;}
/* Cible en vigueur : le mois courant, ou le dernier connu une fois la
   période terminée. */
function currentMonth(){
  const m=MOISKEY(TODAY),f=monthAt(m);
  if(f)return f;
  const T=monthsTable();
  return TODAY<T[0].m?T[0]:T[T.length-1];
}
/* Allure d'endurance de référence. Indication, jamais évaluée — et vide
   tant qu'aucune n'est renseignée. */
function paceAt(k){
  const A=((DB.milestones||{}).allures||[]).slice().sort((x,y)=>String(x.until).localeCompare(String(y.until)));
  for(const p of A)if(k<=p.until)return p.txt;
  return A.length?A[A.length-1].txt:null;
}

/* --- Médiane de volume sur 4 semaines pleines ---
   Une cible de volume ne se juge pas sur un total hebdomadaire : une
   semaine à 40 km suivie de trois à 15 ne vaut pas 40. La médiane des
   quatre semaines pleines qui précèdent résiste à ce pic. Une semaine
   sans donnée compte zéro — c'est une semaine sans course, pas une
   semaine inconnue. */
function runMedian4(mon){
  const v=[];
  for(let i=1;i<=4;i++)v.push(r1(total(vals(weekDays(addDays(mon,-7*i)),"runKm"))));
  v.sort((a,b)=>a-b);
  return r1((v[1]+v[2])/2);
}

/* --- Valeurs telles qu'elles se lisaient à une date donnée ---
   Un mois écoulé se juge sur ce qu'il affichait à sa fin, pas sur ce
   qu'on sait aujourd'hui. */
/* Agrégats hebdomadaires BORNÉS à une date. La semaine d'un 30 septembre
   déborde sur octobre : sans cette borne, septembre se jugeait sur des
   pesées d'octobre — exactement ce que « un mois écoulé se juge sur la
   valeur atteinte à sa fin » interdit. */
function weekWeightAt(mon,k){
  const v=vals(weekDays(mon).filter(d=>d<=k),"weight");
  return v.length>=WEIGHT_MIN?avg(v):null;
}
function weekVo2MaxAt(mon,k){
  const v=vals(weekDays(mon).filter(d=>d<=k),"vo2");
  return v.length?Math.max.apply(null,v):null;
}
function lastWeeklyAt(fn,k){
  let m=mondayOf(k);
  for(let i=0;i<60;i++){const v=fn(m,k);if(v!==null)return v;m=addDays(m,-7);}
  return null;
}
function lastValAt(f,k){
  const ks=Object.keys(DB.days).filter(x=>x<=k).sort();
  for(let i=ks.length-1;i>=0;i--){const v=num(DB.days[ks[i]][f]);if(v!==null)return v;}
  return null;
}
function protDaysAt(k){
  /* La journée en cours est incomplète : la fenêtre s'arrête la veille. */
  const end=(k>=TODAY)?addDays(TODAY,-1):k;
  const ks=lastN(end,7);
  if(!protAny(ks))return null;
  let c=0;ks.forEach(x=>{if(protG(rd(x))>=PROTEIN)c++;});
  return c;
}
function snapAt(k){
  const mon=mondayOf(k);
  return{
    w:lastWeeklyAt(weekWeightAt,k),
    waist:lastValAt("waist",k),
    vol:runMedian4(mon),
    sleep:avg(vals(lastN(k,7),"sleep")),
    prot:protDaysAt(k),
    vo2:lastWeeklyAt(weekVo2MaxAt,k)
  };
}
/* Tour de taille : la cible mensuelle est un écart, la mesure est
   absolue. Sans mesure de référence, la ligne reste une estimation. */
/* Référence de tour de taille : saisie dans Réglages si elle l'a été,
   sinon la première mesure importée. Exiger une saisie manuelle d'une
   valeur que le zip fournit déjà, c'est la jauge vide pour rien. */
function waistBaseVal(){
  const b=num((DB.settings.refs||{}).waistBase);
  if(b!==null)return b;
  const d0=((DB.milestones||{}).poids||{}).date;
  const ks=Object.keys(DB.days).sort();
  for(const k of ks){if(isDate(d0)&&k<d0)continue;const v=num(DB.days[k].waist);if(v!==null)return v;}
  return null;
}
function waistTarget(f){
  const b=waistBaseVal();
  return b===null||f.waist===null?null:r1(b+f.waist);
}
/* Les sept cibles d'un mois, confrontées aux valeurs d'une date.
   dir : -1 si l'on vise en dessous, +1 si l'on vise au-dessus. */
const TGT=[
  {k:"w",   l:"Poids",          u:"kg",dir:-1,dec:1},
  {k:"waist",l:"Tour de taille",u:"cm",dir:-1,dec:1},
  {k:"vol", l:"Volume course",  u:"km",dir:1, dec:1},
  {k:"sleep",l:"Sommeil",       u:"",  dir:1, dec:2},
  {k:"prot",l:"Protéines",      u:"j/7",dir:1,dec:0},
  {k:"vo2", l:"VO2max",         u:"",  dir:1, dec:1}
];
function tgtValue(f,t){return t.k==="waist"?waistTarget(f):f[t.k];}
function fmtTgt(v,t){
  if(v===null)return"—";
  return t.k==="sleep"?fmtDur(v):(t.dec?v.toFixed(t.dec===2?1:t.dec):String(v))+(t.u?" "+t.u:"");
}
function fmtCur(v,t){
  if(v===null)return null;
  return t.k==="sleep"?fmtDur(v):(t.dec?r1(v).toFixed(t.dec===2?1:t.dec):String(v))+(t.u?" "+t.u:"");
}
function tgtOk(cur,tv,t){
  if(cur===null||tv===null)return null;
  return t.dir<0?cur<=tv:cur>=tv;
}
/* Ancienneté du dernier export. null = jamais exporté. Le journal ne
   vit que dans le stockage de ce navigateur : un effacement de données
   de site, un téléphone perdu, et il n'en reste rien. */
function exportAge(){
  const k=(DB.settings||{}).lastExport;
  if(!k||!/^\d{4}-\d{2}-\d{2}$/.test(k))return null;
  return Math.round((parseD(TODAY)-parseD(k))/86400000);
}
function exportTxt(){
  const a=exportAge();
  if(a===null)return"jamais exporté";
  return a<=0?"aujourd'hui":a===1?"hier":"il y a "+a+" jours";
}

/* ================= Régime de la semaine ================= */
/* Le plan importé propose un régime ; la bascule manuelle le remplace.
   Une semaine dérape un mardi, pas le dimanche de la revue — sans ce
   bouton le dispositif à trois régimes ne sert qu'une fois par semaine. */
function regimeOf(mon){
  const ov=(DB.settings.regime||{})[mon];
  if(ov)return ov;
  const w=weekAt(mon);
  return (w&&w.regime)||"normale";
}
function regimeSet(mon){return !!(DB.settings.regime||{})[mon];}
/* Séances retenues, avec leur indice d'origine : les cases cochées sont
   indexées par position dans le plan, masquer une séance ne doit pas
   décaler celles qui restent. */
function kept(d){
  const ss=(d.sessions||[]).map((s,i)=>({s:s,i:i}));
  return regimeOf(mondayOf(d.d))==="chargee"?ss.filter(x=>x.s.rank==="P1"):ss;
}
function cut(d){return (d.sessions||[]).length-kept(d).length;}

/* ================= Séances ================= */
function sessDone(k,i){const d=rd(k).done||{};return!!(d["s"+i]||d["s"+i+"f"]);}
function dayUnits(d){return kept(d).length+(d.fascia?1:0);}
function dayDone(k,d){
  let n=0;kept(d).forEach(x=>{if(sessDone(k,x.i))n++;});
  if(d.fascia&&(rd(k).done||{}).fascia)n++;
  return n;
}
function p1Week(mon){
  const w=weekAt(mon);let done=0,planned=0;
  if(w)(w.days||[]).forEach(d=>(d.sessions||[]).forEach((s,i)=>{
    if(s.rank!=="P1")return;planned++;if(sessDone(d.d,i))done++;}));
  return{done:done,planned:planned};
}
function nextDayHasKey(k){
  const d=dayOf(addDays(k,1));
  return!!(d&&(d.sessions||[]).some(s=>s.rank==="P1"||s.rank==="P2"));
}

/* ================= Rendu : fond et jauges ================= */
function bg(){
  let s="";for(let i=0;i<9;i++){const y=40+i*78;
    s+='<path d="M-20 '+y+' C 90 '+(y-34)+', 200 '+(y+40)+', 320 '+(y-12)+' S 540 '+(y+30)+', 700 '+(y-20)+'" fill="none" stroke="#DCE6EB" stroke-width="1"/>';}
  document.getElementById("bg").innerHTML=s;
}
function gauge(frac,val,sub,lab,col,title){
  const C=2*Math.PI*19,on=C*Math.max(0,Math.min(1,frac||0));
  return'<div class="gauge" title="'+esc(title)+'"><svg class="ring" viewBox="0 0 44 44" aria-hidden="true">'+
    '<circle cx="22" cy="22" r="19" fill="none" style="stroke:var(--edge)" stroke-width="4"/>'+
    (on>0?'<circle cx="22" cy="22" r="19" fill="none" style="stroke:'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+on.toFixed(2)+' '+(C-on).toFixed(2)+'"/>':'')+
    '</svg><div><div class="g-val">'+val+(sub?'<span class="g-sub">'+sub+'</span>':'')+'</div><div class="g-lab">'+lab+'</div></div></div>';
}
const dash='<span class="g-sub">—</span>';

/* Saisie d'un champ : seul l'en-tête est reconstruit. Reconstruire la
   liste détruirait l'input en cours et refermerait le clavier entre
   chaque valeur.
   Reste la pastille 4+, qui porte le nombre réel saisi à côté d'elle.
   Sans ce rafraîchissement ciblé elle restait figée jusqu'au prochain
   rendu complet — c'est-à-dire jamais, pendant une saisie. */
function refreshLive(){renderHeader();refreshBits();}
function refreshBits(){
  const els=document.querySelectorAll("[data-live]");
  for(let i=0;i<els.length;i++){
    const el=els[i],a=el.dataset.live.split("|"),e=rd(a[1]);
    if(a[0]==="al"){
      const v=e.alcohol,big=(typeof v==="number"&&v>=4);
      el.textContent=big?v:"4+";
      el.dataset.on=big?1:0;
    }
  }
}

function renderHeader(){
  const mon=mondayOf(TODAY),f=currentMonth();
  const wk=weekWeight(mon)!==null?weekWeight(mon):lastWeekly(weekWeight);
  const wa=weekWaist(mon)!==null?weekWaist(mon):lastWeekly(weekWaist);
  const vo=weekVo2Max(mon)!==null?weekVo2Max(mon):lastWeekly(weekVo2Max);
  const sl7=avg(vals(lastN(TODAY,7),"sleep"));
  const w0=firstWeekWeight(),wb=waistBaseVal(),v0=firstVo2();
  const wT=f.w,waT=waistTarget(f),slT=f.sleep,voT=f.vo2;

  document.getElementById("eyebrow").textContent="";

  /* Les quatre jauges visent la cible DU MOIS, pas une échéance
     trimestrielle : c'est l'écart du moment qui se pilote.
     Une cible non paramétrée n'est pas une cible à zéro : la jauge montre
     alors la mesure seule, sans anneau et sans écart. Écrire « /0 » ou
     diviser par une cible absente donnait un « NaN » ou une exception. */
  const frac=(v,o,c,sens)=>{
    if(v===null||o===null||c===null)return 0;
    if(sens<0)return o<=c?0:(o-v)/(o-c);
    return o>=c?0:(v-o)/(c-o);
  };
  const wFrac=frac(wk,w0,wT,-1);
  const wtFrac=frac(wa,wb,waT,-1);
  const bFrac=(sl7===null||slT===null||slT<=SLEEP_LOW)?0:(sl7-SLEEP_LOW)/(slT-SLEEP_LOW);
  const vFrac=frac(vo,v0,voT,1);

  const wkN=weekWeight(mon)!==null?weekWeightN(mon):lastWeeklyN();
  const MOISC=MOIS[+f.m.slice(5,7)-1];
  /* Suffixe « /cible » et mention de la cible : présents seulement si la
     cible existe. Sinon la jauge dit ce qui est mesuré, point. */
  const sufNum=(c,d)=>c===null?"":"/"+(d===undefined?String(c):c.toFixed(d));
  const cibleTxt=(c,d)=>c===null?", aucune cible paramétrée"
    :", cible "+MOISC+" "+(d===undefined?String(c):c.toFixed(d));

  document.getElementById("prog").innerHTML=
    gauge(wFrac,wk===null?dash:wk.toFixed(1),wk===null?"":sufNum(wT,1),
      wk===null?"1re pesée "+fmt(MEASURE_START).num+"/08":(wkN===2?"poids moy. partiel":"poids moy."),"var(--depth)",
      wk===null?"Première pesée prévue le "+MEASURE_START
        :"Moyenne hebdomadaire "+wk.toFixed(1)+" kg sur "+wkN+" pesées"+cibleTxt(wT,1))+
    gauge(wtFrac,wa===null?dash:wa.toFixed(1),wa===null?"":sufNum(waT,1),
      wa===null?"1re mesure "+fmt(MEASURE_START).num+"/08":"taille moy.","var(--k-swim)",
      wa===null?"Premier tour de taille prévu le "+MEASURE_START
        :(waT===null?"Mesure de référence ou cible manquante dans Références"
          :"Moyenne hebdomadaire "+wa.toFixed(1)+" cm"+cibleTxt(waT,1)))+
    gauge(bFrac,sl7===null?dash:fmtDur(sl7),(sl7===null||slT===null)?"":"/"+fmtDur(slT),"sommeil moy.","var(--brass)",
      sl7===null?"Aucune durée de sommeil saisie"
        :"Moyenne sur 7 jours "+fmtDur(sl7)+(slT===null?", aucune cible paramétrée":", cible "+MOISC+" "+fmtDur(slT)))+
    gauge(vFrac,vo===null?dash:vo.toFixed(1),vo===null?"":sufNum(voT),"vo2max hebdo","var(--k-run)",
      vo===null?"Aucun relevé VO2max":"Meilleur relevé de la semaine "+vo.toFixed(1)+cibleTxt(voT));

  const B=[];
  if(stale)B.push(["warn",stale]);
  const ap=activePlan(),cap=capFor(mon),runKm=weekRun(mon),over=cap.cap!==null&&runKm>cap.cap;
  /* Un bandeau qui demande une action porte le bouton de cette action :
     dire « faire la revue » sans y mener, c'est laisser chercher. */
  if(ap.expired)B.push(["warn","Plan expiré — semaine par défaut affichée.",{tab:"revue",lab:"Revoir le plan"}]);
  if(planPropose&&tab!=="revue")B.push(["info","Un plan est prêt, il n'est pas encore appliqué.",{tab:"revue",lab:"Voir le plan"}]);
  /* Un plan qui commence lundi n'est pas une alerte : l'information vit
     dans l'onglet Plan, elle n'a pas à occuper l'en-tête tous les jours. */
  /* Un relèvement du plafond dur ne doit jamais être silencieux : le
     bandeau nomme la valeur en vigueur, pas une constante supposée. */
  if(cap.clamped)B.push(["warn","Plan à "+cap.planned+" km — ramené au plafond dur de "+cap.max+" km."]);
  if(over)B.push(["warn","Cumul course "+runKm+" km — plafond de "+cap.cap+" km dépassé."]);
  const rec=recovery(); if(rec)B.push(["warn",rec.text]);
  const wd=weightDrop(mon); if(wd!==null)B.push(["warn","Moyenne hebdomadaire en baisse de "+wd+" kg sur une semaine — au-delà de 0,7 kg, la perte est trop rapide."]);
  const dw=drinksIn(weekDays(mon));
  const dcap=drinkCap();
  if(dcap!==null&&dw>dcap)B.push(["warn",dw+" verres cette semaine — plafond hebdomadaire de "+dcap+" dépassé."]);
  const ds=dryStreak(); if(ds>=2)B.push(["info",ds+" jours consécutifs sans alcool."]);
  const xa=exportAge();
  if(xa===null&&Object.keys(DB.days).length)B.push(["warn","Aucune sauvegarde : le journal n'existe que dans ce navigateur.",{id:"exp",lab:"Exporter"}]);
  else if(xa!==null&&xa>EXPORT_MAX)B.push(["warn","Dernière sauvegarde "+exportTxt()+" — au-delà de "+EXPORT_MAX+" jours, un effacement coûterait tout ce qui a suivi.",{id:"exp",lab:"Exporter"}]);
  document.getElementById("banners").innerHTML=B.map(b=>'<div class="banner '+b[0]+(b[2]?" act":"")+'"><span>'+esc(b[1])+'</span>'+
    (b[2]?'<button class="bact" '+(b[2].tab?'data-tab="'+b[2].tab+'"':'id="'+b[2].id+'"')+'>'+esc(b[2].lab)+'</button>':'')+'</div>').join("");
}

function reviewDue(){const d=parseD(TODAY).getDay();return d===6||d===0;}
function renderTabs(){
  const g=document.getElementById("gear");
  if(g)g.dataset.on=(tab==="reglages")?1:0;
  document.getElementById("tabs").innerHTML=TABS.map(t=>
    '<button class="tab '+(tab===t[0]?"on":"")+'" data-tab="'+t[0]+'">'+esc(t[1])+

function renderView(){
  const v=document.getElementById("view");
  if(tab==="today")v.innerHTML=viewToday();
  else if(tab==="plan")v.innerHTML=viewPlan();
  else if(tab==="log")v.innerHTML=viewLog();

  else v.innerHTML='<section class="panel" id="targets"></section>';
  if(tab==="goals")renderTargets();
  if(tab==="reglages"){renderRefs();renderEtat();renderTools();}
}

/* --- Onglet Aujourd'hui : la journée en cours, dépliée, puis la revue. --- */
function viewToday(){
  const d=dayOf(TODAY);
  const prev=open; open=TODAY;
  let h='<div class="route" style="margin-top:22px"><div class="line"></div>';
  h+= dayCard(d||{d:TODAY,fascia:false,sessions:[]},weekOf(TODAY));
  h+='</div>';
  open=prev;
  /* Observance P1 et volume course : les deux chiffres consultés tous les
     jours. p1Week() était calculé pour l'export sans jamais être montré. */
  const mon=mondayOf(TODAY),p1=p1Week(mon),c=capFor(mon);
  h+='<div class="meta obs">P1 de la semaine · '+p1.done+'/'+p1.planned+
     ' · course '+weekRun(mon)+'/'+c.cap+' km</div>';
  /* La revue dominicale a son onglet : elle commence par le dépôt du zip,
     et l'écran du jour tient en moins de trente secondes. */
  if(reviewDue())h+='<div class="banner info">Revue dominicale — onglet Revue.</div>';
  return h;
}

/* --- Onglet Revue : le dépôt du zip, et ce qu'il a produit. ---
   Un seul bouton. Le même sert au zip de la semaine et à l'amorçage de
   plusieurs zips d'un coup : deux boutons auraient créé deux modes, et
   l'un des deux aurait été le mauvais un dimanche sur deux. */
let impRes=null,impBusy=false;
/* État du rituel en cours. Volontairement hors de DB : une revue
   interrompue ne doit rien laisser derrière elle, hors ce que l'appel A a
   déjà écrit en base. */
let revBusy=false,revEtape="",revPct=0,revErr="",planPropose=null,planViol=[];
/* Un chrono pendant l'attente : une barre qui n'avance pas ne dit pas si
   ça travaille ou si c'est mort. Les secondes, si. */
let revT0=0,revTick=null,revEssai="";
function chronoDebut(){revT0=Date.now();revEssai="";if(revTick)clearInterval(revTick);
  revTick=setInterval(()=>{const e=document.getElementById("elapsed");
    if(e)e.textContent=Math.round((Date.now()-revT0)/1000)+" s"+(revEssai?" · "+revEssai:"");},1000);}
function chronoFin(){if(revTick)clearInterval(revTick);revTick=null;}
const surEssai=(n,total)=>{revEssai="tentative "+n+"/"+total;const e=document.getElementById("elapsed");
  if(e)e.textContent=Math.round((Date.now()-revT0)/1000)+" s · "+revEssai;};
/* Replis : la matière brute existe, elle ne s'impose pas. */
const plie={semaine:true,seances:true};
function fold(id,titre,sous,corps){
  const f=plie[id];
  return'<section class="panel fold"><button class="fold-h" data-fold="'+id+'">'+
    '<span class="fold-t">'+esc(titre)+'</span>'+
    '<span class="fold-s">'+esc(sous||"")+'</span>'+
    '<span class="fold-c">'+(f?"+":"−")+'</span></button>'+
    (f?"":'<div class="fold-b">'+corps+'</div>')+'</section>';
}
function lastDigest(){const L=DB.imports||[];return L.length?L[L.length-1]:null;}
function daysSince(k){return isDate(k)?Math.round((parseD(TODAY)-parseD(k))/86400000):null;}
/* Dernière date portant une mesure, tous imports confondus. Sert aux
   rappels : une tension d'il y a six semaines n'est pas une tension. */
function lastDateWith(f){
  const ks=Object.keys(DB.days).sort();
  for(let i=ks.length-1;i>=0;i--)if(num(DB.days[ks[i]][f])!==null)return ks[i];
  return null;
}
const CHARGE=["très calme","calme","normale","dense","très dense"];
function viewRevue(){
  const d=lastDigest();

}

function viewRevueCorps(d){
  let h='<section class="panel imp"><h2>Revue</h2>'+
    '<p class="panel-sub">Le zip Health Auto Export est la seule source des mesures. '+
    'Dépose celui de la semaine, ou plusieurs d\'un coup pour rattraper l\'historique.</p>';
  if(!zipSupported())
    h+='<div class="banner warn">Ce navigateur ne sait pas décompresser le zip (DecompressionStream absent). '+
       'Safari 16.4 ou plus récent, ou Chrome, sont nécessaires.</div>';
  h+='<button class="big" id="impBtn"'+(impBusy?' disabled':'')+'>'+
     (impBusy?"Lecture en cours…":"Import Health & Sport")+'</button>'+
     '<input type="file" id="impFile" multiple accept=".zip,application/zip,application/octet-stream" hidden>';

  if(impRes){
    const r=impRes;
    if(r.fichiers)h+='<div class="banner info">'+
      esc(r.fichiers+" fichier"+(r.fichiers>1?"s":"")+" lu"+(r.fichiers>1?"s":"")+" · "+
          dm(r.du)+" → "+dm(r.au)+" · "+r.jours+" jour"+(r.jours>1?"s":"")+
          " ajouté"+(r.jours>1?"s":"")+" ou mis à jour · "+r.seances+" séance"+(r.seances>1?"s":""))+'</div>';
    r.erreurs.forEach(x=>{h+='<div class="banner warn">'+esc(x)+'</div>';});
  }

  /* Dernier import ET dernière revue : ce sont deux gestes distincts, et
     c'est la revue qui peut manquer alors que les données sont fraîches.
     Alerte au-delà de dix jours sur l'une comme sur l'autre. */
  const age=d?daysSince(d.importe):null;
  const R=DB.reviews||[],rv=R.length?R[R.length-1]:null;
  const rAge=rv?daysSince(rv.date):null;
  const ilya=n=>n===0?"aujourd'hui":n===1?"hier":"il y a "+n+" jours";
  if(d)h+='<div class="dates"><div><b>Import</b> '+esc(dm(d.importe))+
     (age===null?"":" · "+ilya(age))+'</div><div><b>Revue</b> '+
     (rv?esc(dm(rv.date))+' · '+ilya(rAge):'aucune')+'</div></div>';
  if(age!==null&&age>REVUE_MAX)
    h+='<div class="banner warn">Dernier import il y a '+age+' jours — au-delà de '+REVUE_MAX+
       ', la revue porte sur des données périmées.</div>';
  if(rAge!==null&&rAge>REVUE_MAX)
    h+='<div class="banner warn">Dernière revue il y a '+rAge+' jours — le plan en cours a été écrit sur d\'autres chiffres que ceux d\'aujourd\'hui.</div>';
  if(!d)h+='<p class="empty">Aucun import. Les mesures affichées ailleurs dans l\'app resteront vides.</p>';
  if(!d)h+='</section>';

  if(d){
    const s=d.semaine||{},du=d.semaineDu;
    let corpsSem='';
    corpsSem+='<div class="mtgt">';
    const row=(lab,v,unit)=>'<div class="mrow"><span class="mlab">'+esc(lab)+'</span>'+
      '<span class="mline">'+(v===null||v===undefined?'<span class="dim">—</span>':'<b>'+esc(String(v))+'</b>'+(unit?' '+esc(unit):''))+'</span></div>';
    corpsSem+=row("Poids moyen",s.poidsMoy,"kg");
    corpsSem+=row("Masse grasse",s.mgKgMoy===null||s.mgKgMoy===undefined?null:s.mgKgMoy+" kg ("+s.mgPctMoy+" %)","");
    corpsSem+=row("FC repos",s.fcReposMoy,"bpm");
    corpsSem+=row("VFC",s.vfcMoy,"ms");
    corpsSem+=row("Sommeil",s.sommeilMoyH===null||s.sommeilMoyH===undefined?null:fmtDur(s.sommeilMoyH)+" · "+s.nuits7h+" nuit"+(s.nuits7h>1?"s":"")+" d'au moins 7 h","");
    corpsSem+=row("Pas",s.pasMoy===null||s.pasMoy===undefined?null:milliers(s.pasMoy),"par jour");
    corpsSem+=row("Séances",s.nbSeances===null?null:s.nbSeances+" · "+s.minTotal+" min","");
    corpsSem+=row("Course",s.kmCourse,"km");
    corpsSem+=row("Vélo",s.kmVelo,"km");
    corpsSem+=row("VO2max",s.vo2Max,"ml/kg/min");
    corpsSem+='</div>';
    /* Le manquant se dit en clair : une colonne vide est une mesure non
       prise, jamais une panne. */
    if((d.manquant||[]).length)
      corpsSem+='<div class="banner info">Non mesuré cette semaine : '+esc((d.manquant||[]).map(x=>MANQ[x]||x).join(", "))+'.</div>';
    const tS=lastDateWith("sys"),tW=lastDateWith("waist");
    const aS=tS?daysSince(tS):null,aW=tW?daysSince(tW):null;
    if(aS===null||aS>TENSION_MAX)
      corpsSem+='<div class="banner warn">Tension : '+(tS?"dernière mesure le "+dm(tS)+", il y a "+aS+" jours":"aucune mesure enregistrée")+
         '. Une prise au BPM Core la fera remonter dans le prochain zip.</div>';
    if(aW===null||aW>WAIST_MAX)
      corpsSem+='<div class="banner warn">Tour de taille : '+(tW?"dernière mesure le "+dm(tW)+", il y a "+aW+" jours":"aucune mesure enregistrée")+
         '. Il se saisit à la main dans l\'app Santé, hors de Pimperel.</div>';
    /* Charge professionnelle : un tap, non bloquant, et sur le chemin —
       repliée, elle ne serait jamais renseignée. */
    const cv=DB.charge[du];
    h+='<div class="log" style="gap:14px"><div class="log-row col"><span class="log-lab">Charge professionnelle de la semaine'+
       '<span class="hint">'+(cv?esc(CHARGE[cv-1]):"non renseignée — facultatif")+'</span></span><div class="pills">';
    for(let i=1;i<=5;i++)h+='<button class="pill" data-ch="'+esc(du)+'|'+i+'" data-on="'+(cv===i?1:0)+'">'+i+'</button>';
    h+='</div></div></div>';
    /* L'action et ce qu'elle produit passent AVANT la matière brute :
       on vient ici pour lancer la revue et lire le plan, pas pour relire
       des moyennes qu'on a déjà. Le tout dans une seule carte : déposer,
       noter la semaine et lancer sont un seul geste. */
    h+=blocRevue();

    /* Les mesures et les séances restent accessibles, repliées. */
    const S=weekSeances(d);
    h+=fold("semaine","Semaine mesurée",dm(du)+" → "+dm(d.au),corpsSem);
    /* L'échappatoire : si l'appel ne passe pas, la boucle par copier-coller
       dans une session de chat fonctionne toujours. Discrète, en bas. */
    if(S.length){
      let c='<div class="jbox">';
      S.forEach(x=>{c+='<div class="srow"><span class="jd">'+esc(fmt(x.date).dow+" ")+'<b>'+esc(fmt(x.date).num)+'</b></span>'+
        '<span class="js">'+esc(seanceTxt(x))+'</span></div>';});
      h+=fold("seances","Séances",S.length+" · "+(s.minTotal||0)+" min",c+'</div>');
    }
    h+='<div class="tools"><button class="tool" id="rev">Exporter la revue pour une session de chat</button></div>';
    return h;
  }
  h+=blocRevue();
  return h;
}
/* --- Le rituel : déposer le zip, puis appliquer. Deux taps, zéro collage.
   L'analyse s'affiche dès qu'elle arrive, pendant que le plan se
   fabrique — c'est tout l'intérêt des deux appels. --- */
function blocRevue(){
  const manque=revuePrete(),R=(DB.reviews||[]);
  const derniere=R.length?R[R.length-1]:null;
  let h='<div class="rite">';
  if(manque.length){
    h+='<div class="review-d">Il manque '+esc(manque.join(", "))+
       '. Sans doctrine, le modèle n\'a aucune règle : la revue ne se lance pas.</div>';
    h+='</div></section>';
    return h;
  }
  h+='<div class="review-d">'+(revBusy
      ? esc(revEtape)+' <span class="elapsed" id="elapsed">'+Math.round((Date.now()-revT0)/1000)+' s'+(revEssai?" · "+esc(revEssai):"")+'</span>'
      : "Un tap. L'analyse d'abord, une à deux minutes ; le plan ensuite, à peu près autant. Garde l'écran allumé.")+'</div>';
  if(revBusy){
    h+='<div class="bar"><div class="bar-in" style="width:'+Math.min(98,revPct)+'%"></div></div>';
  }else{
    h+='<button class="big" id="go"'+(revBusy?" disabled":"")+'>'+
       (derniere&&derniere.semaine===((lastDigest()||{}).semaineDu)?"Relancer la revue":"Lancer la revue")+'</button>';
  }
  if(revErr)h+='<div class="banner warn">'+esc(revErr)+'</div>';
  /* Une analyse sans plan : le plan se rejoue seul, sans repayer l'analyse. */
  if(!revBusy&&derniere&&!planPropose)
    h+='<div class="tools"><button class="tool" id="goPlan">Générer le plan seul</button>'+
       '<button class="tool" id="repli">Plan de repli</button></div>';
  h+='</div></section>';

  /* Le plan d'abord : c'est lui qui attend un geste. L'analyse se lit
     ensuite, elle n'attend rien. */
  if(planPropose)h+=blocPlan(planPropose);
  if(derniere)h+=blocAnalyse(derniere);
  /* L'échappatoire reste : si l'appel ne passe pas, la boucle par
     copier-coller dans une session de chat fonctionne toujours. */
  return h;
}

function blocPlan(p){
  /* Les écarts passent DEVANT le plan : un plan appliqué en silence
     malgré une règle violée est exactement ce que les garde-fous
     existent pour empêcher. */
  let ecarts="";
  const R=(planViol||[]).filter(v=>v.conduite==="rejet");
  const A=(planViol||[]).filter(v=>v.conduite!=="rejet");
  if(R.length)ecarts+='<div class="banner warn"><b>'+R.length+' règle'+(R.length>1?"s":"")+

    R.map(v=>esc(v.code+" — "+v.texte)).join("<br>")+'</div>';
  if(A.length)ecarts+='<div class="banner info">'+A.map(v=>esc(v.code+" — "+v.texte)).join("<br>")+'</div>';

  let h='<section class="panel plan-pret"><div class="meta">Plan proposé'+(p.repli?" — repli":"")+'</div>'+
    (tous.length?'<p class="plan-dates">Du <b>'+esc(fmt(tous[0]).dow+" "+fmt(tous[0]).num)+'</b> au <b>'+
      esc(fmt(tous[tous.length-1]).dow+" "+fmt(tous[tous.length-1]).num)+'</b> · '+j+' jours · '+s+' séances</p>':'')+
    /* Le bouton en tête : il était en bas, sous les courses, et il n'a
       pas été vu. Ce qui attend un geste se présente en premier. */
    '<button class="big" id="applyPlan">Appliquer le plan</button>'+
    '<p class="pace">'+(p.semaines||[]).map(w=>esc("Semaine du "+dm(w.start)+" · "+(REGIME[w.regime]||w.regime)+" · plafond "+w.runCapKm+" km")).join("<br>")+'</p>'+
    ecarts;
  if((p.courses||[]).length)h+='<div class="refs-h">Courses</div><ul class="lst">'+

}
