<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FFFFFF;--surface:#FFFFFF;--tint:#F7FAFB;--edge:#D6DFE4;
  --ink:#0A2233;--fog:#5E7180;
  --buoy:#C24A2C;--depth:#1E7F72;--brass:#8A6E1B;
  --wave:#DCE6EB;--chart-grid:#C7D4DA;--press:rgba(10,34,51,.05);--veil:rgba(255,255,255,.82);
  /* Posé sur --depth : blanc en clair, encre en sombre. Le blanc sur
     l'accent sombre ne donnait que 2,92:1, sous le seuil de 3:1. */
  --on-accent:#FFFFFF;
  /* Fond du monogramme. En sombre, le bleu nuit d'origine tombait à
     1,13:1 contre la page : le disque disparaissait et les quatre
     repères orange flottaient sans ancrage. */
  --mark-bg:#0A2233;
  --k-run:#C24A2C;--k-str:#1E7F72;--k-pos:#8A6E1B;--k-swim:#3E7FA3;--k-rest:#5E7180;
  --shadow:0 1px 2px rgba(10,34,51,.04),0 5px 16px rgba(10,34,51,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B151E;--surface:#121F2B;--tint:#1A2A39;--edge:#263B4D;
  --ink:#E9EFF4;--fog:#8FA5B5;
  --buoy:#E8764F;--depth:#3AA893;--brass:#CBA84C;
  --wave:#152230;--chart-grid:#2A4054;--press:rgba(255,255,255,.06);--veil:rgba(11,21,30,.82);
  --on-accent:#08121A;
  --mark-bg:#1B3149;
  --k-run:#E8764F;--k-str:#3AA893;--k-pos:#CBA84C;--k-swim:#6FB0D6;--k-rest:#8296A6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
html,body{margin:0;background:var(--paper)}
body{
  color:var(--ink);font-family:var(--sans);
  padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 70px) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.bg{position:fixed;inset:0;pointer-events:none;opacity:.9;z-index:0}
#bg path{stroke:var(--wave)}
.mark-bg{fill:var(--mark-bg)}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--depth);outline-offset:2px;border-radius:4px}
.box,.pill,.tool{transition:transform .08s ease,background-color .12s ease,border-color .12s ease}
.box:active,.pill:active,.tool:active{transform:scale(.93)}

header{
  position:sticky;top:0;z-index:5;
  margin:0 -18px;padding:calc(12px + env(safe-area-inset-top)) 18px 16px;
  border-bottom:1px solid var(--edge);
  background:var(--veil);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  transition:padding .18s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:var(--paper)}
}
header.compact{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
.mark,h1,.eyebrow,.prog,.ring,.g-val{transition:all .18s ease}
.compact .mark{flex-basis:40px;width:40px;height:40px}
.compact h1{font-size:22px}
.compact .eyebrow{max-height:0;opacity:0;margin-top:0}
.compact .prog{margin-top:10px;gap:9px 22px}
.compact .ring{width:31px;height:31px;flex-basis:31px}
.compact .g-val{font-size:14px}
.hdr-top{display:block;position:relative}
/* Engrenage : un réglage, pas une destination quotidienne — il vit dans
   l'en-tête et laisse les cinq onglets à la navigation. */
.gear{position:absolute;top:0;right:0;background:none;border:none;color:var(--fog);
  padding:10px;cursor:pointer;line-height:0;border-radius:10px}
.gear:active{background:var(--tint)}
.gear[data-on="1"]{color:var(--ink);background:var(--tint)}
/* Bandeau avec action : le texte à gauche, le geste à droite. */
.banner.act{display:flex;align-items:center;gap:10px}
.banner.act span{flex:1}
.bact{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--surface);border:1px solid currentColor;color:inherit;border-radius:8px;padding:8px 10px;cursor:pointer}
.plan-dates{font-size:14px;margin:0 0 4px;color:var(--ink)}
.plan-dates b{font-weight:600}
.valid-row{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.valid{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:none;
  border:1px solid var(--depth);color:var(--depth);border-radius:9px;padding:10px 14px;cursor:pointer}
.apport{font-size:13px;color:var(--fog)}
.apport b{color:var(--ink);font-weight:500}
.apport.warn{color:var(--buoy)}
.elapsed{font-family:var(--mono);font-size:12px;color:var(--ink);white-space:nowrap}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:58px;height:58px;flex:0 0 58px}
.brand-txt{min-width:0}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-top:5px;max-height:22px;overflow:hidden}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.02;margin:0;letter-spacing:-.01em}

.prog{display:grid;grid-template-columns:repeat(2,auto);gap:16px 26px;justify-content:center;margin-top:20px}
@media (min-width:600px){.prog{grid-template-columns:repeat(4,auto);gap:24px}}
.gauge{display:flex;align-items:center;gap:8px}
.ring{width:38px;height:38px;flex:0 0 38px;transform:rotate(-90deg)}
.g-val{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1;white-space:nowrap}
.g-sub{color:var(--fog);font-size:11px}
.g-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:5px;white-space:nowrap}
@media (max-width:430px){.prog{gap:14px 20px}}

/* Pas de position:sticky ici : sans « top » elle n'a jamais collé, et
   l'en-tête figé porte déjà le repère. Le fond voilé reste nécessaire,
   les vagues du fond défilent derrière. */
.tabs{margin:0 -18px;padding:0 18px;display:flex;gap:0;border-bottom:1px solid var(--edge);
  background:var(--veil);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--fog);cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;padding:13px 4px}
.tab.on{color:var(--ink);border-bottom-color:var(--buoy)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--buoy);margin-left:5px;vertical-align:middle}
.mo{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.mo-name{font-family:var(--serif);font-style:italic;font-size:18px;text-transform:capitalize}
.mo-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:inherit;
  font:inherit;cursor:pointer;padding:11px 13px;border-bottom:1px solid var(--edge)}
.jrow:last-child{border-bottom:none}
.jrow:active{background:var(--press)}
.jrow.today{background:var(--tint)}
/* today et « ouvert » partageaient le même fond : on ne savait plus
   laquelle des deux lignes était le jour courant. */
.jrow.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--depth)}
.jdet{border-bottom:1px solid var(--edge)}
.jbox>.jdet:last-child{border-bottom:none}
.jbox{border:1px solid var(--edge);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.jd{font-family:var(--mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;min-width:52px;color:var(--fog)}
.jd b{color:var(--ink);font-weight:600}
.js{font-size:13.5px;color:var(--fog);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm{font-family:var(--mono);font-size:10px;color:var(--fog)}
.jm.full{color:var(--depth)}
.banners{margin-top:12px;display:grid;gap:6px}
.banner{font-size:13px;line-height:1.45;padding:8px 10px;border-radius:7px;border-left:3px solid var(--fog);background:var(--tint);color:var(--ink)}
.banner.warn{border-left-color:var(--buoy)}
.banner.info{border-left-color:var(--depth)}

.review{margin-top:20px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:15px}
.review-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.review-d{font-size:13.5px;color:var(--fog);line-height:1.5;margin-top:6px}
.big{display:block;width:100%;margin-top:11px;padding:13px;border-radius:9px;border:none;background:var(--depth);color:var(--on-accent);font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}
.big.sec{background:none;border:1px solid var(--edge);color:var(--fog)}

/* Le nom, la bascule de régime et le trait tiennent la première ligne ;
   les volumes passent dessous plutôt que de casser le nom en deux. */
.week{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.week-name{font-family:var(--serif);font-style:italic;font-size:19px;flex:0 0 auto}
.week-sub{font-size:12.5px;color:var(--fog);flex:0 0 100%;order:9}
.reg{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fog);
  background:none;border:1px solid var(--edge);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.reg.hot{color:var(--buoy);border-color:var(--buoy)}
.reg.man{background:var(--tint)}
.reg:active{background:var(--press)}
.reg{position:relative}
.reg::after{width:100%;height:40px}
.rule{height:1px;background:var(--edge);flex:1;min-width:14px}

.route{position:relative;padding-left:34px}
.line{position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--edge)}
.day{position:relative;margin-bottom:9px}
.node{position:absolute;left:-31px;top:18px;width:11px;height:11px;border-radius:50%;border:1px solid var(--fog);background:var(--paper)}
.node.done{background:var(--depth);border-color:var(--depth)}
.node.now{background:var(--buoy);border-color:var(--buoy)}

.card{background:var(--surface);border:1px solid var(--edge);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.card.now{border-color:var(--buoy)}
.card-head{width:100%;text-align:left;background:none;border:none;color:inherit;font:inherit;padding:14px 15px;display:block;cursor:pointer;transition:background-color .15s ease}
.card-head:active{background:var(--press)}
.card-top{display:flex;align-items:center;gap:10px}
.date{font-family:var(--mono);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;min-width:60px}
.date b{font-weight:600}
.sum{font-size:14px;color:var(--fog);flex:1}
.count{font-family:var(--mono);font-size:10.5px;color:var(--fog);background:var(--tint);border:1px solid var(--edge);border-radius:99px;padding:3px 9px}
.count.full{color:var(--on-accent);background:var(--depth);border-color:var(--depth)}

.detail{border-top:1px solid var(--edge);padding:13px 15px 15px}
.sess{padding:10px 0;border-bottom:1px solid var(--edge)}
.sess:last-of-type{border-bottom:none}
.sess-head{display:flex;align-items:flex-start;gap:11px}
.box{flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--fog);border-radius:8px;background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
/* Zone de touche élargie sans toucher au dessin. La case fait 26 px à
   l'œil — c'est le geste le plus répété de l'app, et il tombait sous le
   minimum de 44 px recommandé sur iOS. Le halo reste sous les 44 px pour
   ne pas mordre sur la commande voisine, mesurée à 6 px d'écart. */
.box::after,.alt::after,.reg::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.box::after{width:40px;height:40px}
.box[data-on="1"]{background:var(--depth);border-color:var(--depth)}
.box svg path{stroke:var(--on-accent)}
.box.sm{flex:0 0 22px;width:22px;height:22px;border-radius:7px}
.tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.rank{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1px solid var(--edge);border-radius:99px;padding:2px 7px;color:var(--fog)}
.rank.p1{color:var(--buoy);border-color:var(--buoy)}
.sess-lab{font-size:15.5px;margin-top:4px;line-height:1.35;font-weight:500}
.sess-lab.off{color:var(--fog);text-decoration:line-through}
.cue{font-size:13px;color:var(--fog);line-height:1.5;margin-top:5px}
.alt{margin-top:8px;background:none;border:1px solid var(--edge);border-radius:7px;color:var(--fog);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer;position:relative}
.alt::after{width:100%;height:40px}
.fallback{margin-top:9px;padding:10px 11px;background:var(--tint);border-left:2px solid var(--brass);border-radius:0 8px 8px 0;display:flex;gap:10px;align-items:flex-start}
.fallback .fb-t{font-size:13.5px;line-height:1.45;flex:1}
.conv{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--buoy);margin-top:6px}
.ro{font-family:var(--mono);font-size:15px;color:var(--ink);text-align:right}
/* Bloc des mesures : lecture seule, et il le dit. Séparé du formulaire
   par sa teinte, pour qu'on ne cherche pas à y taper. */
.mes{margin-top:16px;padding:12px 13px 4px;background:var(--tint);border-radius:10px}
.mes-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog)}
.mes .log{margin-top:9px;padding-top:9px;border-top:1px solid var(--edge);gap:11px}
.mes .log-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);font-weight:400}
/* Champs de texte libre : le menu doit tenir vingt secondes, pas être
   un formulaire. Il s'étend, il ne défile pas. */
/* Le champ grandit avec le texte : à rows=2 fixes, la troisième ligne du
   menu était coupée en deux, ce qui donnait l'impression d'un bug. */
textarea.menu{width:100%;min-height:76px;background:none;border:1px solid var(--edge);border-radius:11px;
  color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding:11px 12px;resize:vertical;
  field-sizing:content}
textarea.menu:focus{outline:none;border-color:var(--brass)}
/* Lien d'exception : discret, mais de taille tapable. */
.lnk{background:none;border:none;color:var(--fog);font-family:var(--sans);font-size:14px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:9px 0;text-align:left}
/* Les séances s'enroulent : tronquer la ligne coupait le % hors zone,
   qui est précisément ce qu'on vient y lire. */
.srow{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--edge)}
.srow .js{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
.srow .jd{flex:none}
.log-row.seance{align-items:flex-start;gap:8px}
.log-row.seance .log-lab{flex:none;min-width:44px}
.log-row.seance .ro{flex:1;text-align:left;font-size:12.5px;line-height:1.5}
.srow:last-child{border-bottom:none}
.imp .big{margin-top:6px}
/* Bloc repliable : le titre porte son résumé, pour qu'on sache ce qu'on
   déplie sans avoir à le déplier. */
.panel.fold{padding:0;overflow:hidden}
.fold-h{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;
  border:none;color:inherit;padding:16px 18px;cursor:pointer;font:inherit}
.fold-t{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.fold-s{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--fog);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-c{font-family:var(--mono);font-size:15px;color:var(--fog);line-height:1}
.fold-b{padding:0 18px 18px}
/* Le rituel est une suite de gestes, pas trois cartes : un filet les relie. */
.rite{margin-top:18px;padding-top:16px;border-top:1px solid var(--edge)}
.dates{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--fog);margin-top:10px}
.dates b{font-weight:400;letter-spacing:.12em;text-transform:uppercase;font-size:9px;display:block;margin-bottom:2px}
/* Un champ de clé se saisit et disparaît : il n'est jamais relu. */
input.keyin{width:100%;background:none;border:1px solid var(--edge);border-radius:9px;color:var(--ink);
  font-family:var(--mono);font-size:16px;padding:10px;letter-spacing:.02em}
input.keyin:focus{outline:none;border-color:var(--brass)}
input.mdl{font-family:var(--mono);font-size:16px;width:150px;text-align:right;background:none;
  border:none;border-bottom:1px solid var(--edge);color:var(--ink);padding:4px}
textarea.etat{font-family:var(--mono);font-size:13px;min-height:150px}
/* La barre dit que ça avance, elle ne prétend pas savoir où ça en est. */
.bar{height:4px;background:var(--edge);border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar-in{height:100%;background:var(--brass);transition:width .35s ease}
.analyse{font-size:15.5px;line-height:1.6;color:var(--ink);margin:0 0 14px}
ul.lst{margin:0 0 12px;padding-left:18px}
ul.lst li{font-size:14px;line-height:1.55;color:var(--fog);margin-bottom:4px}
.repas{margin-top:12px;padding:11px 12px 6px;background:var(--tint);border-radius:10px}
.repas-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);margin-bottom:4px}
.repas-t b{color:var(--depth);font-weight:500}
.cre-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--fog)}
.subi{color:var(--buoy)}
.pivot{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--buoy);border-left:3px solid var(--buoy);background:var(--tint);border-radius:0 7px 7px 0;padding:8px 10px;margin-bottom:12px}
.todo{font-size:13px;line-height:1.5;color:var(--ink);border-left:3px solid var(--brass);background:var(--tint);border-radius:0 7px 7px 0;padding:9px 11px;margin:0 0 14px}

.log{margin-top:16px;padding-top:16px;border-top:1px solid var(--edge);display:grid;gap:20px}
.log-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.log-row.col{align-items:flex-start;flex-direction:column;gap:8px}
.log-row.col .pills{width:100%}
/* Les libellés de saisie étaient en capitales mono 9,5 px : illisibles de
   près, et criés. Ce sont des questions posées à quelqu'un, pas des
   en-têtes de tableau. */
.log-lab{font-family:var(--sans);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);flex:1;min-width:120px;font-weight:500}
.log-lab .hint{display:block;font-family:var(--sans);font-size:12.5px;color:var(--fog);margin-top:2px;line-height:1.45;font-weight:400}
.log-lab .hint.warn{color:var(--buoy)}
/* 16 px partout : en dessous, iOS zoome la page à la prise de focus et
   ne la dézoome jamais. Les champs date et heure en héritaient pas. */
input[type=number],input[type=text]{background:none;border:none;border-bottom:1px solid var(--edge);color:var(--ink);font-family:var(--mono);font-size:16px;width:76px;text-align:right;padding:4px;border-radius:0}
input[type=date],input[type=time]{font-family:var(--mono);font-size:16px;color:var(--ink);background:none;border:none;border-bottom:1px solid var(--edge);padding:4px;border-radius:0}
input[type=number]:focus,input[type=text]:focus{outline:none;border-bottom-color:var(--brass)}
.unit{font-family:var(--mono);font-size:9.5px;color:var(--fog);width:34px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-width:48px;height:46px;border:1px solid var(--edge);background:none;border-radius:10px;color:var(--fog);font-family:var(--mono);font-size:14px;cursor:pointer;padding:0 9px}
.pill[data-on="1"]{border-color:var(--depth);color:var(--depth)}
.pill[data-on="1"][data-over="1"]{border-color:var(--buoy);color:var(--buoy)}
/* Les deux créneaux qui font la journée sont marqués même décochés. */
.pill.key{border-style:solid;border-color:var(--fog)}
.pill.key[data-on="1"]{border-color:var(--depth);color:var(--depth);background:var(--tint)}
.pg{opacity:.55;font-size:10px}
.alx{width:74px}
/* Deux valeurs et leur unité sur une seule ligne : en flex, l'unité
   passait à la ligne et se retrouvait sous le libellé de la suivante. */
.log-row.pair{display:grid;grid-template-columns:1fr 68px 68px 30px;gap:8px;align-items:center}
.log-row.pair input{width:100%}
.pair-h span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);text-align:center}
.g-dot.hollow{fill:var(--surface);stroke:var(--brass);stroke-width:1.6}
input.bad{border-color:var(--buoy)}
.week-note{font-size:11.5px;line-height:1.5;color:var(--fog);margin:-6px 0 12px}
.obs{margin-top:20px}

.panel{margin-top:34px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:20px 18px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 4px;font-weight:600}
.panel-sub{font-size:13px;color:var(--fog);margin:0 0 16px;line-height:1.5}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tgt{border-collapse:collapse;width:100%;min-width:330px}
table.tgt th,table.tgt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);vertical-align:top}
/* Première colonne figée : sans elle, faire défiler vers la 3e échéance
   fait perdre de vue la ligne qu'on lit. */
table.tgt th:first-child,table.tgt td:first-child{position:sticky;left:0;background:var(--surface);width:104px;min-width:104px;padding-left:0}
table.tgt th{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);font-weight:400}
.t-lab{font-size:11.5px;line-height:1.35}
.t-cur{font-family:var(--mono);font-size:10px;color:var(--fog);display:block;margin-top:3px}
.t-cell{font-family:var(--mono);font-size:10.5px;line-height:1.35;white-space:nowrap}
.t-st{font-family:var(--mono);font-size:11px;margin-right:4px}
.ok{color:var(--depth)}.warn{color:var(--buoy)}.dim{color:var(--fog)}

.meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-bottom:9px}
.vtitle{font-family:var(--serif,Georgia,serif);font-size:22px;margin:22px 0 -2px;color:var(--ink)}
.graph{margin-top:26px}
.gtitle{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:2px}
.gsub{font-size:12.5px;color:var(--fog);line-height:1.45;margin-bottom:8px}
svg+.gsub{margin:2px 0 0}
.gl-ref{stroke:var(--depth)}.gt-ref{fill:var(--depth)}.gl-start{stroke:var(--chart-grid)}
.g-txt{fill:var(--fog)}.g-line{stroke:var(--brass)}.g-dot{fill:var(--brass)}
.g-trend{stroke:var(--depth);fill:none}
.g-bar{fill:var(--depth)}.g-bar.hot{fill:var(--buoy)}
.empty{font-size:14px;color:var(--fog);line-height:1.55;padding:10px 0;margin:0}
.foot{font-size:11.5px;color:var(--fog);line-height:1.6;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--edge)}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tool{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--edge);border-radius:8px;padding:10px 14px;cursor:pointer}
.save{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);margin-top:12px}
.backup{font-size:12.5px;color:var(--fog);margin-top:14px;padding-top:12px;border-top:1px solid var(--edge)}
.backup.warn{color:var(--buoy)}
.refs-grid{display:grid;gap:12px}
.refs-h{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:6px}
.mtgt{display:grid;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:9px;overflow:hidden;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;background:var(--surface);padding:9px 11px;align-items:baseline}
.mlab{font-size:14.5px}
.mline{grid-column:1/-1;font-family:var(--mono);font-size:12.5px;color:var(--fog);line-height:1.5}
.mline b{font-size:15px;color:var(--ink);font-weight:500}
.mgap{font-family:var(--mono)}
.mgap.ok{color:var(--depth)}.mgap.warn{color:var(--buoy)}
.pace{font-size:13px;color:var(--fog);margin:0 0 4px;line-height:1.5}
table.tgt th.now,table.tgt td.now{background:var(--tint)}
table.tgt th.base,table.tgt td.base{color:var(--fog)}
.g-goal{stroke:var(--depth);fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){h1{font-size:28px}}
</style>
</head>

/* ================= Cibles et constantes ================= */
/* ================= Cibles mensuelles ================= */
/* ================= Cibles : calculées, jamais stockées en dur =================
   Les treize cibles mensuelles portaient une trajectoire de poids, un tour
   de taille et des chronos datés — c'est-à-dire un dossier de santé
   nominatif dans un dépôt public. Elles n'existent plus dans le code.

   Ce qui reste ici : les dates du programme et la FORME de la courbe. Les
   valeurs, elles, vivent dans DB.milestones, sur l'appareil, et se
   paramètrent dans Références. Tant qu'elles manquent, l'app affiche
   « non paramétré » — elle n'invente aucun chiffre.

   Le poids ne s'interpole pas linéairement : il suit la règle de la
   doctrine — un premier rythme jusqu'à un seuil, un second ensuite, et un
   plancher au poids de forme, après lequel la trajectoire est plate.
   C'est une phase de stabilisation, pas un déficit qui continue. */
const BASE_MOIS="2026-08", DERNIER_MOIS="2027-08";
function moisSuivant(m){
  let y=+m.slice(0,4),i=+m.slice(5,7)+1;
  if(i>12){i=1;y++;}
  return y+"-"+pad(i);
}
function moisCles(){
  const a=[];let m=BASE_MOIS;
  for(let i=0;i<60;i++){a.push(m);if(m===DERNIER_MOIS)break;m=moisSuivant(m);}
  return a;
}
/* Poids cible à une date : rythme 1 jusqu'au seuil, rythme 2 ensuite,
   puis plat au poids de forme. */
function poidsCible(k){
  const P=(DB.milestones||{}).poids||{};
  const base=num(P.base),d0=P.date,r1v=num(P.r1);
  if(base===null||!isDate(d0)||!r1v)return null;
  const sem=(parseD(k)-parseD(d0))/(7*86400000);
  if(sem<=0)return r1(base);
  const seuil=num(P.seuil),r2v=num(P.r2),forme=num(P.forme);
  let v=base-r1v*sem;
  if(seuil!==null&&r2v&&v<seuil){
    const semSeuil=(base-seuil)/r1v;
    v=seuil-r2v*(sem-semSeuil);
  }
  if(forme!==null&&v<forme)v=forme;
  return r1(v);
}
/* Les autres métriques progressent linéairement de leur base à leur cible
   d'horizon. Le volume de course fait exception : le dernier mois porte
   l'affûtage, une baisse voulue avant la course. */
function linCible(o,i,n){
  if(!o)return null;
  const b=num(o.base),c=num(o.cible);
  if(b===null||c===null||!n)return null;
  return r1(b+(c-b)*i/n);
}
function monthsTable(){
  const M=DB.milestones||{},ks=moisCles(),n=ks.length-1;
  return ks.map((mk,i)=>{
    const o={m:mk,base:i===0,
      w:poidsCible(monthEnd(mk)),
      waist:linCible(M.taille,i,n),
      vol:linCible(M.vol,i,n),
      /* Une cible de sommeil sous le seuil qui fait sauter les séances
         d'intensité serait absurde : la jauge dirait « réussi » pendant
         que le garde-fou retire la course. Le seuil est le plancher. */
      sleep:(function(v){return v===null?null:Math.max(v,G_SOMMEIL_SEUIL);})(linCible(M.sommeil,i,n)),
      prot:linCible(M.prot,i,n),
      vo2:linCible(M.vo2,i,n)};
    const af=num((M.vol||{}).affutage);
    if(i===n&&af!==null)o.vol=af;
    return o;
  });
}
/* Chargement de jalons depuis un fichier ou un collage. Fusion stricte :
   seules les clés connues entrent, et rien d'autre que DB.milestones
   n'est touché — un import de cibles ne doit jamais pouvoir écraser un
   journal. */
const MS_GROUPES={poids:["base","date","r1","seuil","r2","forme"],
  taille:["base","cible"],vol:["base","cible","affutage"],
  sommeil:["base","cible"],prot:["base","cible"],vo2:["base","cible"],
  fcRepos:["cible"],alcool:["semaine"]};
function chargerCibles(txt){
  let o;
  try{o=JSON.parse(txt);}catch(e){throw new Error("Ce n'est pas du JSON valide.");}
  if(!o||typeof o!=="object"||Array.isArray(o))throw new Error("Format non reconnu.");
  /* Un fichier de sauvegarde complet déposé ici par erreur : on n'en prend
     que les jalons, on n'écrase pas la base avec. */
  const src=o.milestones&&typeof o.milestones==="object"?o.milestones:o;
  let n=0;
  Object.keys(MS_GROUPES).forEach(g=>{
    const from=src[g];
    if(!from||typeof from!=="object")return;
    if(!DB.milestones[g])DB.milestones[g]={};
    MS_GROUPES[g].forEach(k=>{
      const v=from[k];
      if(v===undefined||v===null||v==="")return;
      if(k==="date"){if(!isDate(v))return;DB.milestones[g][k]=v;n++;return;}
      const x=num(v);
      if(x===null)return;
      DB.milestones[g][k]=x;n++;
    });
  });
  if(Array.isArray(src.tests)){
    const t=src.tests.filter(x=>x&&isDate(x.d)&&x.dist)
      .map(x=>({d:x.d,dist:String(x.dist),cible:x.cible?String(x.cible):null}));
    if(t.length){DB.milestones.tests=t;n+=t.length;}
  }
  if(Array.isArray(src.allures)){
    const a=src.allures.filter(x=>x&&isDate(x.until)&&x.txt)
      .map(x=>({until:x.until,txt:String(x.txt)}));
    if(a.length){DB.milestones.allures=a;n+=a.length;}
  }
  if(!n)throw new Error("Aucune cible reconnue dans ce fichier.");
  save();
  return n;
}
/* Aucune cible paramétrée : le tableau le dit au lieu d'afficher des
   tirets qu'on prendrait pour des données manquantes. */

/* ================= Stockage ================= */
/* Les données jdb-v1 du carnet de voyage ne sont ni lues ni effacées. */
let DB={days:{},settings:{refs:{},bloodwork:{}},plan:null}, memOnly=false, stale="", lastCheck=0;
function load(){
  let fresh=false;
  try{
    const r=localStorage.getItem(KEY);
    if(r){const p=JSON.parse(r); if(p&&typeof p==="object")DB=p; else fresh=true;}
    else fresh=true;
    setSave("Synchronisé");
  }catch(e){memOnly=true;setSave("Stockage indisponible — données de cette session uniquement");}
  const seeded=normalize();
  /* Le premier lancement écrit l'état initial : sans ça la clé n'existe
     qu'après la première saisie, et un export lancé avant ne verrait rien. */
  if(fresh||seeded)save();
}
/* Complète une base venue du disque ou d'un import : les champs absents
   sont recréés. Ne relit jamais le disque — un import doit pouvoir
   s'appuyer dessus sans être écrasé. Aucune donnée n'est supprimée : les
   bases des versions antérieures gardent leurs journées telles quelles. */
function normalize(){
  if(!DB.days||typeof DB.days!=="object")DB.days={};

  if(!DB.settings.bloodwork)DB.settings.bloodwork={};

     le test de référence du 12/09. */

    if(isDate(R0.test5kDate))DB.settings.tests[R0.test5kDate]=R0.test5k;

    if(!DB.milestones[x])DB.milestones[x]={};
  });
  if(!Array.isArray(DB.milestones.tests))DB.milestones.tests=[];
  if(!Array.isArray(DB.milestones.allures))DB.milestones.allures=[];
  if(!DB.settings.api)DB.settings.api={model:MODELE_DEFAUT};
  if(!DB.settings.api.model)DB.settings.api.model=MODELE_DEFAUT;

function ses(op,v,k){const key=k||RKEY;try{return op==="get"?sessionStorage.getItem(key):op==="set"?sessionStorage.setItem(key,v):sessionStorage.removeItem(key);}catch(e){return null;}}

function checkVersion(){
  const now=Date.now(); if(now-lastCheck<60000)return; lastCheck=now;
  const rec=String(ses("get")||"").split("|"), triedV=rec[0], tries=+rec[1]||0;
  fetch("version.txt",{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    const v=t&&t.trim();
    if(!v||v===VERSION){ses("del"); if(stale){stale="";render();} return;}
    const n=(triedV===v)?tries:0;
    if(n>=MAX_TRIES){
      /* Trois URL neuves n'ont pas suffi : le cache ne cédera pas seul. */
      stale="Version "+v+" publiée, cette page reste sur "+VERSION+" — ferme puis rouvre le raccourci.";
      setSave(stale); render(); return;

       antérieur a été servi avant la propagation du CDN, l'URL
       ?v=<version> porte l'ancienne page en cache et la réutiliser la
       resservirait indéfiniment. Chaque tentative vise une URL inédite. */

  const now=iso(new Date());

/* ================= Import Health & Sport =================
   Lecture d'un export Health Auto Export, sans aucune dépendance.

   Cinq pièges, tous présents dans les exports réels :
   1. L'énergie est en KILOJOULES. 4 104 kJ = 981 kcal, pas 4 104.
   2. iOS écrit les noms de fichiers en UTF-8 NFD : « Extérieur » est un
      « e » suivi d'un accent combinant. Tout nom est normalisé en NFC
      avant le moindre test, et les tests sont des motifs, jamais des
      égalités.
   3. L'offset du central directory pointe l'EN-TÊTE LOCAL, pas les
      données. Les longueurs de nom et d'extra y diffèrent souvent de
      celles du central directory : il faut relire l'en-tête local.
   4. new Date("2026-09-07 00:00:00") vaut Invalid Date sur Safari —
      l'espace n'est pas ISO. Les dates restent des chaînes, découpées.
      Aucune conversion de fuseau : l'export est déjà en heure locale, et
      passer par UTC décalerait les nuits de sommeil d'un jour.
   5. Le fichier de fréquence cardiaque porte les secondes (170855) là où
      Workouts tronque à la minute (17:08). L'appariement se fait sur le
      préfixe à la minute, avec tolérance. */

const ZIP_MAX_ENTRY=8*1024*1024;   /* garde-fou mémoire par entrée lue */

/* --- Lecture du central directory, puis des seules entrées retenues --- */
function zipEntries(buf){
  const dv=new DataView(buf),n=buf.byteLength;
  /* Fin du central directory : signature 0x06054b50, cherchée depuis la
     fin car le commentaire final est de longueur variable. */
  let eocd=-1;
  for(let i=n-22;i>=Math.max(0,n-66000);i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0)throw new Error("Archive illisible : fin de répertoire introuvable.");
  const count=dv.getUint16(eocd+10,true);
  let p=dv.getUint32(eocd+16,true);
  const out=[],dec=new TextDecoder("utf-8");
  for(let i=0;i<count&&p+46<=n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true);
    const compSize=dv.getUint32(p+20,true);
    const size=dv.getUint32(p+24,true);
    const nameLen=dv.getUint16(p+28,true);
    const extraLen=dv.getUint16(p+30,true);
    const commLen=dv.getUint16(p+32,true);
    const localOff=dv.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(buf,p+46,nameLen)).normalize("NFC");
    out.push({name:name,method:method,compSize:compSize,size:size,localOff:localOff});
    p+=46+nameLen+extraLen+commLen;
  }
  return out;
}
/* Début réel des données : il faut relire l'en-tête local, dont les
   longueurs de nom et d'extra diffèrent de celles du répertoire. */
function zipDataStart(buf,e){
  const dv=new DataView(buf);
  if(dv.getUint32(e.localOff,true)!==0x04034b50)
    throw new Error("Entrée corrompue : en-tête local absent.");
  return e.localOff+30+dv.getUint16(e.localOff+26,true)+dv.getUint16(e.localOff+28,true);
}
async function zipRead(buf,e){
  if(e.size>ZIP_MAX_ENTRY)throw new Error("Fichier trop volumineux dans l'archive : "+e.name);
  const start=zipDataStart(buf,e);
  const raw=new Uint8Array(buf,start,e.compSize);
  if(e.method===0)return new TextDecoder("utf-8").decode(raw);
  if(e.method!==8)throw new Error("Compression non gérée ("+e.method+") : "+e.name);
  const ds=new DecompressionStream("deflate-raw");
  const out=new Response(new Blob([raw]).stream().pipeThrough(ds));
  return new TextDecoder("utf-8").decode(await out.arrayBuffer());
}
function zipSupported(){
  try{return typeof DecompressionStream==="function"&&!!new DecompressionStream("deflate-raw");}
  catch(e){return false;}
}

/* --- CSV : séparateur virgule, champs éventuellement guillemetés --- */
function csvRows(txt){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else if(c==='"')q=true;
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"){row.push(cur);cur="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else if(c!=="\r")cur+=c;
  }
  row.push(cur);
  if(row.length>1||row[0]!=="")rows.push(row);
  return rows;
}
function csvTable(txt){
  const r=csvRows(txt);
  if(!r.length)return{head:[],rows:[]};
  return{head:r[0].map(h=>h.trim().normalize("NFC")),rows:r.slice(1)};
}
/* Colonne repérée par motif : les libellés portent des unités et des
   accents qui varient d'une version d'export à l'autre. */
function colIdx(head,re){for(let i=0;i<head.length;i++)if(re.test(head[i]))return i;return -1;}
function cnum(v){
  if(v===undefined||v===null)return null;
  const t=String(v).trim().replace(",",".");

  const n=parseFloat(t);

/* Lecture d'une cellule numérique arrondie au dixième, null si vide :
   l'export écrit 140.13754008120202, personne ne lit une FC ainsi. */
function nr1(v){const n=cnum(v);return n===null?null:r1(n);}

/* --- Agrégation horaire -> quotidienne du CSV principal (§2.3) --- */
const MAIN_COLS=[
  ["poids",        /^Poids/i,                                   "moy"],
  ["mgPct",        /Graisse Corporelle/i,                       "moy"],
  ["maigre",       /Masse Corporelle Maigre/i,                  "moy"],
  ["taille",       /Tour de taille/i,                           "last"],
  ["fcRepos",      /Fr.quence cardiaque au repos/i,             "moy"],
  ["vfc",          /Variabilit. de la Fr.quence Cardiaque/i,    "moy"],
  ["sommeilH",     /Analyse du Sommeil \[Total\]/i,             "som"],
  ["sommeilProfondH",/Analyse du Sommeil \[Profond\]/i,         "som"],
  ["sommeilRemH",  /Analyse du Sommeil \[REM\]/i,               "som"],
  ["pas",          /Nombre de Pas/i,                            "somE"],
  ["kmMarcheCourse",/Distance Marche \+ Course/i,               "som"],
  ["kcalActives",  /.nergie Active/i,                           "somKJ"],
  ["kcalRepos",    /.nergie de repos/i,                         "somKJ"],
  ["minExo",       /Temps d.exercice Apple/i,                   "som"],
  ["vo2",          /VO2 ?Max/i,                                 "max"],
  ["recupCardio",  /R.cup.ration Cardio/i,                      "moy"],
  ["sys",          /Tension art.rielle \[Systolique\]/i,        "moy"],
  ["dia",          /Tension art.rielle \[Diastolique\]/i,       "moy"],
  ["alcoolMesure", /Consommation d.alcool/i,                    "som"]
];
function parseMain(txt){
  const T=csvTable(txt);
  const dateI=colIdx(T.head,/^Date\/?\s?(Heure|Time)/i);
  if(dateI<0)throw new Error("CSV principal : colonne de date introuvable.");
  const idx=MAIN_COLS.map(c=>[c[0],colIdx(T.head,c[1]),c[2]]);
  const acc={};
  T.rows.forEach(r=>{
    const d=String(r[dateI]||"").trim();
    /* Piège 4 : la date reste une chaîne, jamais new Date(). */
    if(!/^\d{4}-\d{2}-\d{2}/.test(d))return;
    const k=d.slice(0,10);
    const a=acc[k]||(acc[k]={});
    idx.forEach(c=>{
      if(c[1]<0)return;
      const v=cnum(r[c[1]]);
      if(v===null)return;
      const s=a[c[0]]||(a[c[0]]={n:0,som:0,max:-Infinity,last:null});
      s.n++;s.som+=v;if(v>s.max)s.max=v;s.last=v;
    });
  });
  const jours={};
  Object.keys(acc).sort().forEach(k=>{
    const a=acc[k],o={};
    idx.forEach(c=>{
      const s=a[c[0]];
      if(!s){o[c[0]]=null;return;}                     /* absent = null, jamais 0 */
      if(c[2]==="moy")o[c[0]]=r1(s.som/s.n);
      else if(c[2]==="som")o[c[0]]=r1(s.som);
      /* Les pas se tronquent, ils ne s'arrondissent pas : Apple affiche
         16 927 là où la somme horaire vaut 16 927,73. */
      else if(c[2]==="somE")o[c[0]]=Math.floor(s.som);
      else if(c[2]==="somKJ")o[c[0]]=Math.round(s.som/KJ);   /* piège 1 */
      else if(c[2]==="max")o[c[0]]=r1(s.max);
      else o[c[0]]=s.last;
    });
    if(o.poids!==null&&o.mgPct!==null)o.mgKg=r1(o.poids*o.mgPct/100);
    else o.mgKg=null;
    if(o.taille!==null)o.taille=r1(o.taille);
    jours[k]=o;
  });
  return jours;
}

function parseWorkouts(txt){
  const T=csvTable(txt);
