<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FFFFFF;--surface:#FFFFFF;--tint:#F7FAFB;--edge:#D6DFE4;
  --ink:#0A2233;--fog:#5E7180;
  --buoy:#C24A2C;--depth:#1E7F72;--brass:#8A6E1B;
  --wave:#DCE6EB;--chart-grid:#C7D4DA;--press:rgba(10,34,51,.05);--veil:rgba(255,255,255,.82);
  --k-run:#C24A2C;--k-str:#1E7F72;--k-pos:#8A6E1B;--k-swim:#3E7FA3;--k-rest:#5E7180;
  --shadow:0 1px 2px rgba(10,34,51,.04),0 5px 16px rgba(10,34,51,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B151E;--surface:#121F2B;--tint:#1A2A39;--edge:#263B4D;
  --ink:#E9EFF4;--fog:#8FA5B5;
  --buoy:#E8764F;--depth:#3AA893;--brass:#CBA84C;
  --wave:#152230;--chart-grid:#2A4054;--press:rgba(255,255,255,.06);--veil:rgba(11,21,30,.82);
  --k-run:#E8764F;--k-str:#3AA893;--k-pos:#CBA84C;--k-swim:#6FB0D6;--k-rest:#8296A6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
html,body{margin:0;background:var(--paper)}
body{
  color:var(--ink);font-family:var(--sans);
  padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 70px) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.bg{position:fixed;inset:0;pointer-events:none;opacity:.9;z-index:0}
#bg path{stroke:var(--wave)}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--depth);outline-offset:2px;border-radius:4px}
.box,.pill,.tool{transition:transform .08s ease,background-color .12s ease,border-color .12s ease}
.box:active,.pill:active,.tool:active{transform:scale(.93)}

header{
  position:sticky;top:0;z-index:5;
  margin:0 -18px;padding:calc(12px + env(safe-area-inset-top)) 18px 16px;
  border-bottom:1px solid var(--edge);
  background:var(--veil);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  transition:padding .18s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:var(--paper)}
}
header.compact{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
.mark,h1,.eyebrow,.prog,.ring,.g-val{transition:all .18s ease}
.compact .mark{flex-basis:40px;width:40px;height:40px}
.compact h1{font-size:22px}
.compact .eyebrow{max-height:0;opacity:0;margin-top:0}
.compact .prog{margin-top:10px;gap:9px 22px}
.compact .ring{width:31px;height:31px;flex-basis:31px}
.compact .g-val{font-size:14px}
.hdr-top{display:block}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:58px;height:58px;flex:0 0 58px}
.brand-txt{min-width:0}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-top:5px;max-height:22px;overflow:hidden}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.02;margin:0;letter-spacing:-.01em}

.prog{display:grid;grid-template-columns:repeat(2,auto);gap:16px 26px;justify-content:center;margin-top:20px}
@media (min-width:600px){.prog{grid-template-columns:repeat(4,auto);gap:24px}}
.gauge{display:flex;align-items:center;gap:8px}
.ring{width:38px;height:38px;flex:0 0 38px;transform:rotate(-90deg)}
.g-val{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1;white-space:nowrap}
.g-sub{color:var(--fog);font-size:11px}
.g-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:5px;white-space:nowrap}
@media (max-width:430px){.prog{gap:14px 20px}}

.banners{margin-top:12px;display:grid;gap:6px}
.banner{font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:7px;border-left:3px solid var(--fog);background:var(--tint);color:var(--ink)}
.banner.warn{border-left-color:var(--buoy)}
.banner.info{border-left-color:var(--depth)}

.review{margin-top:20px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:15px}
.review-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.review-d{font-size:12px;color:var(--fog);line-height:1.5;margin-top:6px}
.big{display:block;width:100%;margin-top:11px;padding:13px;border-radius:9px;border:none;background:var(--depth);color:#FFFFFF;font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}
.big.sec{background:none;border:1px solid var(--edge);color:var(--fog)}

.week{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px}
.week-name{font-family:var(--serif);font-style:italic;font-size:19px}
.week-sub{font-size:11.5px;color:var(--fog)}
.rule{height:1px;background:var(--edge);flex:1;min-width:14px}

.route{position:relative;padding-left:34px}
.line{position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--edge)}
.day{position:relative;margin-bottom:9px}
.node{position:absolute;left:-31px;top:18px;width:11px;height:11px;border-radius:50%;border:1px solid var(--fog);background:var(--paper)}
.node.done{background:var(--depth);border-color:var(--depth)}
.node.now{background:var(--buoy);border-color:var(--buoy)}

.card{background:var(--surface);border:1px solid var(--edge);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.card.now{border-color:var(--buoy)}
.card-head{width:100%;text-align:left;background:none;border:none;color:inherit;font:inherit;padding:14px 15px;display:block;cursor:pointer;transition:background-color .15s ease}
.card-head:active{background:var(--press)}
.card-top{display:flex;align-items:center;gap:10px}
.date{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;min-width:60px}
.date b{font-weight:600}
.sum{font-size:12.5px;color:var(--fog);flex:1}
.count{font-family:var(--mono);font-size:10.5px;color:var(--fog);background:var(--tint);border:1px solid var(--edge);border-radius:99px;padding:3px 9px}
.count.full{color:#FFFFFF;background:var(--depth);border-color:var(--depth)}

.detail{border-top:1px solid var(--edge);padding:13px 15px 15px}
.sess{padding:10px 0;border-bottom:1px solid var(--edge)}
.sess:last-of-type{border-bottom:none}
.sess-head{display:flex;align-items:flex-start;gap:11px}
.box{flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--fog);border-radius:8px;background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.box[data-on="1"]{background:var(--depth);border-color:var(--depth)}
.box.sm{flex:0 0 22px;width:22px;height:22px;border-radius:7px}
.tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.rank{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1px solid var(--edge);border-radius:99px;padding:2px 7px;color:var(--fog)}
.rank.p1{color:var(--buoy);border-color:var(--buoy)}
.sess-lab{font-size:14px;margin-top:4px;line-height:1.35;font-weight:500}
.sess-lab.off{color:var(--fog);text-decoration:line-through}
.cue{font-size:12px;color:var(--fog);line-height:1.5;margin-top:5px}
.alt{margin-top:8px;background:none;border:1px solid var(--edge);border-radius:7px;color:var(--fog);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer}
.fallback{margin-top:9px;padding:10px 11px;background:var(--tint);border-left:2px solid var(--brass);border-radius:0 8px 8px 0;display:flex;gap:10px;align-items:flex-start}
.fallback .fb-t{font-size:12.5px;line-height:1.45;flex:1}
.conv{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--buoy);margin-top:6px}

.log{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge);display:grid;gap:13px}
.log-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.log-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);flex:1;min-width:120px}
.log-lab .hint{text-transform:none;letter-spacing:0;display:block;font-family:var(--sans);font-size:11px;margin-top:3px;line-height:1.4}
.log-lab .hint.warn{color:var(--buoy)}
input[type=number],input[type=text]{background:none;border:none;border-bottom:1px solid var(--edge);color:var(--ink);font-family:var(--mono);font-size:16px;width:76px;text-align:right;padding:4px;border-radius:0}
input[type=number]:focus,input[type=text]:focus{outline:none;border-bottom-color:var(--brass)}
.unit{font-family:var(--mono);font-size:9.5px;color:var(--fog);width:34px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:40px;height:38px;border:1px solid var(--edge);background:none;border-radius:9px;color:var(--fog);font-family:var(--mono);font-size:12px;cursor:pointer;padding:0 9px}
.pill[data-on="1"]{border-color:var(--depth);color:var(--depth)}
.pill[data-on="1"][data-over="1"]{border-color:var(--buoy);color:var(--buoy)}

.panel{margin-top:34px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:20px 18px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 4px;font-weight:600}
.panel-sub{font-size:11.5px;color:var(--fog);margin:0 0 16px;line-height:1.5}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tgt{border-collapse:collapse;width:100%;min-width:330px}
table.tgt th,table.tgt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);vertical-align:top}
/* Première colonne figée : sans elle, faire défiler vers la 3e échéance
   fait perdre de vue la ligne qu'on lit. */
table.tgt th:first-child,table.tgt td:first-child{position:sticky;left:0;background:var(--surface);width:104px;min-width:104px;padding-left:0}
table.tgt th{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);font-weight:400}
.t-lab{font-size:11.5px;line-height:1.35}
.t-cur{font-family:var(--mono);font-size:10px;color:var(--fog);display:block;margin-top:3px}
.t-cell{font-family:var(--mono);font-size:10.5px;line-height:1.35;white-space:nowrap}
.t-st{font-family:var(--mono);font-size:11px;margin-right:4px}
.ok{color:var(--depth)}.warn{color:var(--buoy)}.dim{color:var(--fog)}

.meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-bottom:9px}
.graph{margin-top:22px}
.gl-ref{stroke:var(--depth)}.gt-ref{fill:var(--depth)}.gl-start{stroke:var(--chart-grid)}
.g-txt{fill:var(--fog)}.g-line{stroke:var(--brass)}.g-dot{fill:var(--brass)}
.empty{font-size:12.5px;color:var(--fog);line-height:1.55;padding:10px 0;margin:0}
.foot{font-size:11.5px;color:var(--fog);line-height:1.6;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--edge)}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tool{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--edge);border-radius:8px;padding:10px 14px;cursor:pointer}
.save{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);margin-top:12px}
.refs-grid{display:grid;gap:12px}
.refs-h{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){h1{font-size:28px}}
</style>

<svg class="bg" viewBox="0 0 660 760" preserveAspectRatio="xMidYMin slice" aria-hidden="true" id="bg"></svg>
<div class="wrap">
  <header><div class="hdr-top"><div class="brand"><svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" fill="#0A2233"/><circle cx="100" cy="100" r="81.5" fill="none" stroke="#1E3E54" stroke-width="1.1"/><g stroke="#E06A42" stroke-width="3.2" stroke-linecap="round"><path d="M100 4v9"/><path d="M100 187v9"/><path d="M4 100h9"/><path d="M187 100h9"/></g><g stroke="#2EA896" fill="none" stroke-linecap="round"><path d="M42 152 L152 114" stroke-width="8"/><path d="M150 115 L158 82" stroke-width="6"/><path d="M152 80 L168 80" stroke-width="4.5"/></g><g transform="rotate(-19 100 132)"><g fill="none" stroke="#FFFFFF" stroke-linecap="round"><path d="M76 108 L72 132" stroke-width="6.5"/><path d="M89 110 L87 132" stroke-width="6.5"/><path d="M107 110 L109 132" stroke-width="6.5"/><path d="M118 108 L122 132" stroke-width="6.5"/><path d="M68 90 L57 83" stroke-width="5"/><path d="M143 80 L140 91" stroke-width="4"/></g><path fill="#FFFFFF" d="M68 98 C68 88 78 84 94 84 C110 84 122 87 126 94 C128 99 126 105 118 108 C106 112 82 112 74 108 C69 106 68 102 68 98 Z"/><path fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" d="M122 90 L138 72"/><path fill="#FFFFFF" d="M128 70 C132 60 146 53 158 58 C164 61 162 69 154 73 L142 80 L131 78 Z"/><g fill="none" stroke="#FFFFFF" stroke-linecap="round"><path d="M150 56 C140 34 106 30 92 46 C88 51 87 57 89 63" stroke-width="8"/><path d="M144 61 C136 43 110 40 99 52" stroke-width="4.5"/></g></g></svg><div class="brand-txt"><h1 id="title">Pimperel</h1><div class="eyebrow" id="eyebrow"></div></div></div><div class="prog" id="prog"></div><div class="banners" id="banners"></div></div></header>
  <section class="review" id="review"></section>
  <div id="weeks"></div>
  <section class="panel" id="targets"></section>
  <section class="panel" id="refs"></section>
  <section class="panel" id="tools"></section>
</div>

<script>
"use strict";

/* ================= Identité ================= */
/* Un seul point de changement pour le nom : title, meta iOS et h1 en dérivent. */
const APP="Pimperel";
const KEY="pimperel-v1";
/* Contrôle de version : à changer À CHAQUE déploiement, en même temps que
   version.txt à la racine. Les deux doivent être identiques. */
const VERSION="2026-08-22.2", RKEY="pmp-reload", OKEY="pmp-open";

/* ================= Cibles et constantes ================= */
const MILES=[
  {d:"2026-11-30",lab:"Nov 2026",w:91,wTxt:"91"},
  {d:"2027-02-28",lab:"Fév 2027",w:89,wTxt:"89"},
  {d:"2027-08-31",lab:"Août 2027",w:87,wTxt:"86–87"}
];
const WEIGHT_START=95;      /* point de départ déclaré, sert d'origine aux jauges */
const RHR_TARGET=61, RHR_SPAN=10;   /* jauge vide à 71 bpm, pleine à 61 */
const PROTEIN=160, DRINK_WEEK=5, SLEEP_H=7, SLEEP_NIGHTS=5, BED_NIGHTS=4;

const KIND={
  salle:{t:"SALLE",c:"var(--k-str)"},course:{t:"COURSE",c:"var(--k-run)"},
  qualite:{t:"QUALITÉ",c:"var(--k-run)"},vtt:{t:"VTT",c:"var(--k-swim)"},
  natation:{t:"NATATION",c:"var(--k-swim)"},rando:{t:"RANDONNÉE",c:"var(--k-pos)"},
  marche:{t:"MARCHE",c:"var(--k-rest)"},repos:{t:"REPOS",c:"var(--k-rest)"}
};
const REGIME={normale:"semaine normale",chargee:"semaine chargée",vacances:"vacances"};
const DOW=["dim","lun","mar","mer","jeu","ven","sam"];

const SALLE={rank:"P1",kind:"salle",label:"Salle 60 min",
  detail:"Développé couché 4×5-6 · tractions 4×max · rowing barre 4×8 · presse ou squat 4×8 — charges de maintien · gainage 5 min · élévations mollets lentes 3×15.",
  fallback:"30 min : les 4 mouvements de référence, 2 séries chacun, rien d'autre."};
const FASCIA="Élévations talon lentes 3×12 (3 s de descente) + serviette sous les orteils 3×15.";

/* ================= Plan embarqué (§5.5) ================= */
/* Premier contenu uniquement : le premier import de plan le remplace. */
const SEED_PLAN={
generated:"2026-08-22",
weeks:[
{start:"2026-08-24",regime:"normale",runCapKm:6,days:[
 {d:"2026-08-24",fascia:true,sessions:[{rank:"P3",kind:"marche",label:"Marche 40 min",detail:"Allure libre, en extérieur.",fallback:"20 min autour du pâté de maisons."}]},
 {d:"2026-08-25",fascia:false,sessions:[]},
 {d:"2026-08-26",fascia:true,sessions:[{rank:"P3",kind:"marche",label:"Marche 40 min",detail:"Allure libre, en extérieur.",fallback:"20 min autour du pâté de maisons."}]},
 {d:"2026-08-27",fascia:false,sessions:[]},
 {d:"2026-08-28",fascia:true,sessions:[]},
 {d:"2026-08-29",fascia:false,sessions:[{rank:"P3",kind:"course",label:"Sortie facile 5–6 km",detail:"Endurance, 6:20–7:15/km. Plafond de la semaine de transition.",fallback:"3 km, ou marche rapide 30 min."}]},
 {d:"2026-08-30",fascia:true,sessions:[{rank:"P3",kind:"marche",label:"Marche 40 min",detail:"Allure libre, en extérieur.",fallback:"20 min autour du pâté de maisons."}]}
]},
{start:"2026-08-31",regime:"normale",runCapKm:18,days:[
 {d:"2026-08-31",fascia:true,sessions:[SALLE]},
 {d:"2026-09-01",fascia:false,sessions:[]},
 {d:"2026-09-02",fascia:true,sessions:[]},
 {d:"2026-09-03",fascia:false,sessions:[]},
 {d:"2026-09-04",fascia:true,sessions:[]},
 {d:"2026-09-05",fascia:false,sessions:[{rank:"P1",kind:"course",label:"Sortie longue 10 km",detail:"Endurance 6:20–7:15/km, sous le plafond de la semaine.",fallback:"6 km à la même allure."}]},
 {d:"2026-09-06",fascia:true,sessions:[{rank:"P3",kind:"course",label:"Sortie facile 5–6 km",detail:"Volume facile. Les sorties avec les enfants comptent ici.",fallback:"Marche 40 min."}]}
]}]};

/* ================= Stockage ================= */
/* Les données jdb-v1 du carnet de voyage ne sont ni lues ni effacées. */
let DB={days:{},settings:{refs:{},bloodwork:{}},plan:null}, memOnly=false, stale="", lastCheck=0;
function load(){
  let fresh=false;
  try{
    const r=localStorage.getItem(KEY);
    if(r){const p=JSON.parse(r); if(p&&typeof p==="object")DB=p; else fresh=true;}
    else fresh=true;
    setSave("Synchronisé");
  }catch(e){memOnly=true;setSave("Stockage indisponible — données de cette session uniquement");}
  if(!DB.days||typeof DB.days!=="object")DB.days={};
  if(!DB.settings)DB.settings={};
  if(!DB.settings.refs)DB.settings.refs={};
  if(!DB.settings.bloodwork)DB.settings.bloodwork={};
  if(!DB.plan||!Array.isArray(DB.plan.weeks))DB.plan=SEED_PLAN;
  /* Le premier lancement écrit l'état initial : sans ça la clé n'existe
     qu'après la première saisie, et un export lancé avant ne verrait rien. */
  if(fresh)save();
}
function save(){
  if(memOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(DB));setSave("Enregistré");}
  catch(e){memOnly=true;setSave("Enregistrement impossible");}
}
function setSave(t){const el=document.getElementById("save");if(el)el.textContent=t;}
function entry(k){
  if(!DB.days[k])DB.days[k]={done:{},weight:"",waist:"",rhr:"",hrv:"",vo2:"",sleep:"",bed:false,protein:false,alcohol:"",runKm:"",heel:0};
  const e=DB.days[k]; if(!e.done)e.done={}; return e;
}

/* ================= Mise à jour du raccourci ================= */
function ses(op,v,k){const key=k||RKEY;try{return op==="get"?sessionStorage.getItem(key):op==="set"?sessionStorage.setItem(key,v):sessionStorage.removeItem(key);}catch(e){return null;}}
function checkVersion(){
  const now=Date.now(); if(now-lastCheck<60000)return; lastCheck=now;
  const tried=ses("get");
  fetch("version.txt",{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    const v=t&&t.trim();
    if(!v||v===VERSION){ses("del");return;}
    if(tried===v){stale="Nouvelle version disponible — ferme puis rouvre le raccourci";setSave(stale);return;}
    ses("set",v); ses("set",open||"",OKEY);
    location.replace(location.pathname+"?v="+encodeURIComponent(v));
  }).catch(()=>{});
}
addEventListener("scroll",()=>{
  const h=document.querySelector("header"),on=h.classList.contains("compact");
  if(!on&&scrollY>56)h.classList.add("compact");
  else if(on&&scrollY<20)h.classList.remove("compact");
},{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkVersion();});
addEventListener("pageshow",e=>{if(e.persisted)checkVersion();});

/* ================= Dates ================= */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD=k=>{const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);};
function addDays(k,n){const d=parseD(k);d.setDate(d.getDate()+n);return iso(d);}
function mondayOf(k){const d=parseD(k),o=(d.getDay()+6)%7;d.setDate(d.getDate()-o);return iso(d);}
function fmt(k){const d=parseD(k);return{dow:DOW[d.getDay()],num:pad(d.getDate())};}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r1=n=>Math.round(n*10)/10;
const TODAY=iso(new Date());

/* ================= Agrégats ================= */
function num(v){if(v===""||v===null||v===undefined)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;}
function weekDays(mon){const a=[];for(let i=0;i<7;i++)a.push(addDays(mon,i));return a;}
function lastN(k,n){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(k,-i));return a;}
function vals(keys,f){const o=[];keys.forEach(k=>{const e=DB.days[k];if(!e)return;const v=num(e[f]);if(v!==null)o.push(v);});return o;}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function total(a){return a.reduce((x,y)=>x+y,0);}
function weekWeight(mon){const v=vals(weekDays(mon),"weight");return v.length>=3?avg(v):null;}
function weekRun(mon){return r1(total(vals(weekDays(mon),"runKm")));}
function heelMax(keys){let m=0;keys.forEach(k=>{const e=DB.days[k];if(e&&+e.heel>m)m=+e.heel;});return m;}
function drinksIn(keys){let n=0;keys.forEach(k=>{const e=DB.days[k];if(e&&typeof e.alcohol==="number")n+=e.alcohol;});return n;}
function sleepCounts(keys){let n7=0,bed=0;keys.forEach(k=>{const e=DB.days[k];if(!e)return;const s=num(e.sleep);if(s!==null&&s>=SLEEP_H)n7++;if(e.bed)bed++;});return{n7:n7,bed:bed};}
function dryStreak(){let n=0,k=TODAY;for(let i=0;i<60;i++){const e=DB.days[k];if(!e||typeof e.alcohol!=="number")break;if(e.alcohol>0)break;n++;k=addDays(k,-1);}return n;}

/* ================= Plan actif ================= */
function lastCap(){
  const ws=DB.plan&&DB.plan.weeks||[];
  for(let i=ws.length-1;i>=0;i--)if(num(ws[i].runCapKm)!==null)return num(ws[i].runCapKm);
  return 10;
}
function defaultWeek(mon){
  const cap=lastCap(),days=[];
  for(let i=0;i<7;i++){
    const ss=[];
    if(i===0)ss.push(SALLE);
    if(i===5)ss.push({rank:"P1",kind:"course",label:"Sortie longue",detail:"Endurance 6:20–7:15/km, "+cap+" km au plus — plafond de la dernière semaine connue.",fallback:"Moitié de la distance, allure libre."});
    days.push({d:addDays(mon,i),fascia:i%2===0,sessions:ss});
  }
  return {start:mon,regime:"normale",runCapKm:cap,days:days,fallbackWeek:true};
}
/* Un plan qui n'a pas encore commencé n'est pas un plan expiré : on
   l'affiche tel quel. Seule une date postérieure au dernier jour couvert
   déclenche la semaine par défaut. */
function activePlan(){
  const ws=(DB.plan&&DB.plan.weeks)||[],all=[];
  ws.forEach(w=>(w.days||[]).forEach(d=>all.push(d.d)));
  if(!all.length)return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};
  if(all.indexOf(TODAY)>=0)return{weeks:ws,expired:false};
  const min=all.reduce((a,b)=>a<b?a:b);
  if(TODAY<min)return{weeks:ws,expired:false,pending:min};
  return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};
}
function weekOf(k){
  const ap=activePlan();
  for(const w of ap.weeks)if((w.days||[]).some(d=>d.d===k))return w;
  return null;
}
function dayOf(k){
  const ap=activePlan();
  for(const w of ap.weeks)for(const d of (w.days||[]))if(d.d===k)return d;
  return null;
}

/* ================= Règles automatiques (§6) ================= */
/* Plafond effectif : le calcul +10 % prime sur le plan importé s'il est
   plus bas. Semaine précédente sans aucun km saisi : le calcul ne
   s'applique pas, sinon le plafond tomberait à zéro. */
function capFor(mon){
  const w=weekOf(mon)||weekOf(addDays(mon,1)),planned=w?num(w.runCapKm):null;
  const prev=total(vals(weekDays(addDays(mon,-7)),"runKm"));
  const growth=prev>0?prev*1.10:null;
  let cap=planned,capped=false;
  if(planned===null)cap=growth;
  else if(growth!==null&&growth<planned){cap=growth;capped=true;}
  return{cap:cap===null?null:r1(cap),capped:capped,planned:planned,prev:r1(prev)};
}
/* Récupération : la valeur du jour est comparée à la moyenne des 7 jours
   qui la précèdent, pour que la mesure ne dilue pas sa propre référence. */
function recovery(){
  const base=lastN(addDays(TODAY,-1),7);
  const e=DB.days[TODAY]; if(!e)return null;
  const rhr=num(e.rhr),hrv=num(e.hrv);
  const rB=avg(vals(base,"rhr")),hB=avg(vals(base,"hrv"));
  if(rhr!==null&&rB!==null&&rhr>rB+5)
    return"FC repos "+rhr+" bpm, soit +"+r1(rhr-rB)+" vs moyenne 7 j — la séance qualité passe en facile.";
  if(hrv!==null&&hB!==null&&hrv<hB*0.85)
    return"VFC "+hrv+" ms, soit "+r1((hrv/hB-1)*100)+" % vs moyenne 7 j — la séance qualité passe en facile.";
  return null;
}
function weightDrop(mon){
  const a=weekWeight(mon),b=weekWeight(addDays(mon,-7));
  return(a!==null&&b!==null&&b-a>0.7)?r1(b-a):null;
}
function currentMile(){
  for(const m of MILES)if(TODAY<=m.d)return m;
  return MILES[MILES.length-1];
}

/* ================= Séances ================= */
function sessDone(k,i){const e=entry(k);return!!(e.done["s"+i]||e.done["s"+i+"f"]);}
function dayUnits(d){const n=(d.sessions||[]).length;return n+(d.fascia?1:0);}
function dayDone(k,d){
  let n=0;(d.sessions||[]).forEach((s,i)=>{if(sessDone(k,i))n++;});
  if(d.fascia&&entry(k).done.fascia)n++;
  return n;
}
function p1Week(mon){
  const w=weekOf(mon)||weekOf(addDays(mon,1));let done=0,planned=0;
  if(w)(w.days||[]).forEach(d=>(d.sessions||[]).forEach((s,i)=>{
    if(s.rank!=="P1")return;planned++;if(sessDone(d.d,i))done++;}));
  return{done:done,planned:planned};
}
function nextDayHasKey(k){
  const d=dayOf(addDays(k,1));
  return!!(d&&(d.sessions||[]).some(s=>s.rank==="P1"||s.rank==="P2"));
}

  return Object.keys(DB.days).sort().map(k=>({lab:fmt(k).num,v:num(DB.days[k].vo2)})).filter(p=>p.v!==null).slice(-16);
}
function volumeChart(){
  const ms=weekList(10),pts=[],refs=[];
  ms.forEach(m=>{const c=capFor(m);if(c.cap!==null)refs.push(c.cap);pts.push({lab:fmt(m).num,v:weekRun(m)});});
  const capAvg=refs.length?r1(avg(refs)):null;
  return seriesChart("Volume course hebdomadaire (km)",pts.filter(p=>p.v>0),capAvg!==null?[{v:capAvg,txt:capAvg+" · plafond moyen"}]:[],1);
}
function seriesChart(title,pts,refs,dec){
  if(!pts.length)return'<div class="meta">'+esc(title)+'</div><p class="empty">Aucune donnée saisie.</p>';
  const W=600,H=150;
  let lo=Math.min.apply(null,pts.map(p=>p.v)),hi=Math.max.apply(null,pts.map(p=>p.v));
  refs.forEach(r=>{lo=Math.min(lo,r.v);hi=Math.max(hi,r.v);});
  if(hi-lo<1){hi+=1;lo-=1;}
  const padV=(hi-lo)*0.15;lo-=padV;hi+=padV;
  const y=v=>18+((hi-v)/(hi-lo))*(H-48);
  const X=i=>34+(i*(W-70))/Math.max(pts.length-1,1);
  let s='<div class="meta">'+esc(title)+'</div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  refs.forEach(r=>{
    s+='<line x1="26" y1="'+y(r.v)+'" x2="'+(W-20)+'" y2="'+y(r.v)+'" class="gl-ref" stroke-dasharray="4 5"/>';
    s+='<text x="'+(W-20)+'" y="'+(y(r.v)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">'+esc(r.txt)+'</text>';
  });
  s+='<polyline points="'+pts.map((p,i)=>X(i)+","+y(p.v)).join(" ")+'" fill="none" class="g-line" stroke-width="1.8"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+X(i)+'" cy="'+y(p.v)+'" r="3.4" class="g-dot"/><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+esc(p.lab)+'</text>';});
  s+='</svg><div class="meta" style="margin-top:2px">Dernier point '+pts[pts.length-1].v.toFixed(dec)+'</div>';
  return s;
}

/* ================= Export / import ================= */
function contextBlock(){
  const mon=mondayOf(TODAY),c=capFor(mon),sl=sleepCounts(lastN(TODAY,7));
  const r7=avg(vals(lastN(TODAY,7),"rhr")),h7=avg(vals(lastN(TODAY,7),"hrv"));
  const p1=p1Week(mon),wk=weekWeight(mon),wp=weekWeight(addDays(mon,-7));
  return{
    rhr7:r7===null?null:r1(r7),
    hrv7:h7===null?null:r1(h7),
    weightWeek:wk===null?null:r1(wk),
    weightPrevWeek:wp===null?null:r1(wp),
    runKmWeek:weekRun(mon),
    runCapWeek:c.cap,
    sleepNights7h:sl.n7,
    bedBefore2330:sl.bed,
    drinksWeek:drinksIn(weekDays(mon)),
    heelMax7:heelMax(lastN(TODAY,7)),
    p1Done:p1.done,p1Planned:p1.planned
  };
}
function reviewJSON(){
  const days={},start=addDays(TODAY,-13);
  for(let i=0;i<14;i++){const k=addDays(start,i);if(DB.days[k])days[k]=DB.days[k];}
  return JSON.stringify({app:APP,version:VERSION,exported:TODAY,from:start,to:TODAY,
    days:days,plan:DB.plan,settings:DB.settings,context:contextBlock()},null,1);
}
function copyOut(s,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(s).then(()=>alert(msg),()=>prompt("Copie ce texte :",s));
  else prompt("Copie ce texte :",s);
}
function importPlan(txt){
  let p;try{p=JSON.parse(txt);}catch(e){return"Plan non reconnu";}
  if(!p||typeof p!=="object"||!Array.isArray(p.weeks)||!p.weeks.length)return"Plan non reconnu";
  const dre=/^\d{4}-\d{2}-\d{2}$/;
  for(const w of p.weeks){
    if(!w||typeof w.start!=="string"||!dre.test(w.start)||!Array.isArray(w.days))return"Plan non reconnu";
    for(const d of w.days){
      if(!d||typeof d.d!=="string"||!dre.test(d.d))return"Plan non reconnu";
      if(d.sessions!==undefined&&!Array.isArray(d.sessions))return"Plan non reconnu";
      for(const s of (d.sessions||[]))if(!s||typeof s.label!=="string")return"Plan non reconnu";
    }
  }
  DB.plan=p;save();open=null;render();return null;
}
function renderTools(){
  document.getElementById("tools").innerHTML=
    '<h2>Données</h2><p class="panel-sub">Tout est stocké sur cet appareil. L\'import d\'un plan ne touche ni les cases cochées ni les saisies, indexées par date.</p>'+
    '<button class="big sec" id="impPlan">Importer un plan</button>'+
    '<div class="tools"><button class="tool" id="exp">Exporter les données</button><button class="tool" id="imp">Importer les données</button></div>'+
    '<div class="save" id="save"></div>';
}

/* ================= Interactions ================= */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-open],[data-t],[data-b],[data-p],[data-a],[data-h],[data-alt],#exp,#imp,#impPlan,#rev");
  if(!t)return;
  if(t.id==="rev"){copyOut(reviewJSON(),"Revue copiée. Colle-la dans la session coach.");return;}
  if(t.id==="exp"){copyOut(JSON.stringify(DB),"Données copiées.");return;}
  if(t.id==="imp"){
    const s=prompt("Colle ici les données exportées :");
    if(s){try{const p=JSON.parse(s);if(!p||typeof p!=="object")throw 0;DB=p;load();save();render();}catch(e){alert("Format non reconnu.");}}
    return;}
  if(t.id==="impPlan"){
    const s=prompt("Colle ici le plan de 2 semaines :");
    if(s){const err=importPlan(s);alert(err||"Plan importé.");}
    return;}
  if(t.dataset.open!==undefined){open=(open===t.dataset.open)?null:t.dataset.open;render();return;}
  if(t.dataset.alt!==undefined){const a=t.dataset.alt.split("|"),e=entry(a[0]);e.done["alt"+a[1]]=!e.done["alt"+a[1]];save();render();return;}
  if(t.dataset.t){const a=t.dataset.t.split("|"),e=entry(a[0]);e.done[a[1]]=!e.done[a[1]];save();render();return;}
  if(t.dataset.b){const e=entry(t.dataset.b);e.bed=!e.bed;save();render();return;}
  if(t.dataset.p){const e=entry(t.dataset.p);e.protein=!e.protein;save();render();return;}
  if(t.dataset.a){const a=t.dataset.a.split("|"),e=entry(a[0]),n=Number(a[1]);e.alcohol=(e.alcohol===n)?"":n;save();render();return;}
  if(t.dataset.h){const a=t.dataset.h.split("|"),e=entry(a[0]),n=Number(a[1]);e.heel=(+e.heel===n)?0:n;save();render();}
});
document.addEventListener("change",ev=>{
  const f=ev.target.dataset.f,s=ev.target.dataset.s;
  if(f){const a=f.split("|");entry(a[0])[a[1]]=ev.target.value;save();render();return;}
  if(s){const a=s.split("|");DB.settings[a[0]][a[1]]=ev.target.value;save();render();}
});

bg();render();checkVersion();
