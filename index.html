<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FFFFFF;--surface:#FFFFFF;--tint:#F7FAFB;--edge:#D6DFE4;
  --ink:#0A2233;--fog:#5E7180;
  --buoy:#C24A2C;--depth:#1E7F72;--brass:#8A6E1B;
  --wave:#DCE6EB;--chart-grid:#C7D4DA;--press:rgba(10,34,51,.05);
  --k-run:#C24A2C;--k-str:#1E7F72;--k-pos:#8A6E1B;--k-swim:#3E7FA3;--k-rest:#5E7180;
  --shadow:0 1px 2px rgba(10,34,51,.04),0 5px 16px rgba(10,34,51,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B151E;--surface:#121F2B;--tint:#1A2A39;--edge:#263B4D;
  --ink:#E9EFF4;--fog:#8FA5B5;
  --buoy:#E8764F;--depth:#3AA893;--brass:#CBA84C;
  --wave:#152230;--chart-grid:#2A4054;--press:rgba(255,255,255,.06);
  --k-run:#E8764F;--k-str:#3AA893;--k-pos:#CBA84C;--k-swim:#6FB0D6;--k-rest:#8296A6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
html,body{margin:0;background:var(--paper)}
body{
  color:var(--ink);font-family:var(--sans);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 70px) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.bg{position:fixed;inset:0;pointer-events:none;opacity:.9;z-index:0}
#bg path{stroke:var(--wave)}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--depth);outline-offset:2px;border-radius:4px}
.box,.pill,.tool{transition:transform .08s ease,background-color .12s ease,border-color .12s ease}
.box:active,.pill:active,.tool:active{transform:scale(.93)}

header{padding:26px 0 22px;border-bottom:1px solid var(--edge)}
.hdr-top{display:block}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:58px;height:58px;flex:0 0 58px}
.brand-txt{min-width:0}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-top:5px}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.02;margin:0;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:400;color:var(--depth)}
.readout{display:flex;gap:30px;margin-top:16px;flex-wrap:wrap;justify-content:center;text-align:center}
.ro-val{font-family:var(--mono);font-size:25px;font-weight:500;line-height:1}
.ro-sub{color:var(--fog);font-size:14px}
.ro-lab{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--fog);margin-top:6px}

.prog{display:flex;gap:24px;justify-content:center;margin-top:20px}
.gauge{display:flex;align-items:center;gap:8px}
.ring{width:38px;height:38px;flex:0 0 38px;transform:rotate(-90deg)}
.g-val{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1;white-space:nowrap}
.g-sub{color:var(--fog);font-size:11px}
.g-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:5px;white-space:nowrap}
@media (max-width:430px){.prog{gap:18px}.readout{gap:22px}}

.phase{display:flex;align-items:baseline;gap:12px;margin:32px 0 12px}
.phase-name{font-family:var(--serif);font-style:italic;font-size:19px}
.phase-sub{font-size:11.5px;color:var(--fog);flex:1}
.rule{height:1px;background:var(--edge);flex:1;min-width:14px}

.route{position:relative;padding-left:34px}
.line{position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--edge)}
.track{position:absolute;left:8px;top:6px;width:1px;background:var(--depth);opacity:.55}
.day{position:relative;margin-bottom:9px}
.node{position:absolute;left:-31px;top:16px;width:11px;height:11px;border-radius:50%;border:1px solid var(--fog);background:var(--paper)}
.node.done{background:var(--depth);border-color:var(--depth)}
.node.now{background:var(--buoy);border-color:var(--buoy)}
.node.now:after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--buoy);animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}

.card{background:var(--surface);border:1px solid var(--edge);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.card.now{border-color:var(--buoy)}
.card-head{width:100%;text-align:left;background:none;border:none;color:inherit;font:inherit;padding:14px 15px;display:block;cursor:pointer;transition:background-color .15s ease}
.card-head:active{background:var(--press)}
.card-top{display:flex;align-items:center;gap:10px}
.date{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;min-width:60px}
.date b{font-weight:600}
.sum{font-size:12.5px;color:var(--fog);flex:1}
.count{font-family:var(--mono);font-size:10.5px;color:var(--fog);background:var(--tint);border:1px solid var(--edge);border-radius:99px;padding:3px 9px}
.count.full{color:#FFFFFF;background:var(--depth);border-color:var(--depth)}

.detail{border-top:1px solid var(--edge);padding:13px 15px 15px}
.sess{padding:10px 0;border-bottom:1px solid var(--edge)}
.sess:last-child{border-bottom:none}
.sess-head{display:flex;align-items:flex-start;gap:11px}
.box{flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--fog);border-radius:8px;background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.box[data-on="1"]{background:var(--depth);border-color:var(--depth)}
.box.sm{flex:0 0 22px;width:22px;height:22px;border-radius:7px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.sess-lab{font-size:14px;margin-top:3px;line-height:1.35;font-weight:500}
.sess-lab.off{color:var(--fog);text-decoration:line-through}
.km{font-family:var(--mono);font-size:12px;color:var(--brass)}
.cue{font-size:12px;color:var(--fog);line-height:1.5;margin-top:5px}

.block{margin-top:10px;padding:11px 12px;background:var(--tint);border-left:2px solid var(--depth);border-radius:0 8px 8px 0}
.meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-bottom:9px}
.ex{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--edge)}
.ex:first-of-type{border-top:none;padding-top:0}
.ex-body{flex:1;min-width:0}
.ex-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-n{font-size:13px;font-weight:500}
.ex-n.off{color:var(--fog);text-decoration:line-through}
.ex-p{font-family:var(--mono);font-size:12px;color:var(--brass);white-space:nowrap}
.ex-c{font-size:11.5px;color:var(--fog);line-height:1.45;margin-top:4px}

.log{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge);display:grid;gap:14px}
.log-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.log-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);flex:1}
.log-lab .hint{text-transform:none;letter-spacing:0;display:block;font-family:var(--sans);font-size:11px;margin-top:3px}
input[type=number]{background:none;border:none;border-bottom:1px solid var(--edge);color:var(--ink);font-family:var(--mono);font-size:16px;width:70px;text-align:right;padding:4px;border-radius:0}
input[type=number]:focus{outline:none;border-bottom-color:var(--brass)}
.pills{display:flex;gap:6px}
.pill{min-width:40px;height:38px;border:1px solid var(--edge);background:none;border-radius:9px;color:var(--fog);font-family:var(--mono);font-size:13px;cursor:pointer;padding:0 6px}
.pill[data-on="1"]{border-color:var(--depth);color:var(--depth)}
.pill[data-on="1"][data-over="1"]{border-color:var(--buoy);color:var(--buoy)}

.panel{margin-top:36px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:20px 18px;box-shadow:var(--shadow)}

.panel-sub{font-size:11.5px;color:var(--fog);margin:0 0 16px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.cell{background:var(--surface);padding:13px 12px}
.cell-v{font-family:var(--mono);font-size:21px;font-weight:500}
.cell-l{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);margin-top:6px;line-height:1.5}
.warn{color:var(--buoy)}.ok{color:var(--depth)}
.graph{margin-top:22px}
.empty{font-size:12.5px;color:var(--fog);line-height:1.55;padding:10px 0;margin:0}
.foot{font-size:11.5px;color:var(--fog);line-height:1.6;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--edge)}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tool{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--edge);border-radius:8px;padding:10px 14px;cursor:pointer}
.gl-ref{stroke:var(--depth)}.gt-ref{fill:var(--depth)}.gl-start{stroke:var(--chart-grid)}.g-txt{fill:var(--fog)}.g-line{stroke:var(--brass)}.g-dot{fill:var(--brass)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){h1{font-size:30px}}

<svg class="bg" viewBox="0 0 660 760" preserveAspectRatio="xMidYMin slice" aria-hidden="true" id="bg"></svg>
<div class="wrap">
  <header><div class="hdr-top"><div class="brand"><svg class="mark" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="94" fill="#0A2233"/><circle cx="100" cy="100" r="81.5" fill="none" stroke="#1E3E54" stroke-width="1.1"/><g stroke="#244A62" stroke-width="0.9" fill="none"><path d="M22 78 A 150 60 0 0 0 178 78"/><path d="M22 100 A 150 60 0 0 0 178 100"/><path d="M22 122 A 150 60 0 0 0 178 122"/></g><g stroke="#E06A42" stroke-width="3.2" stroke-linecap="round"><path d="M100 4v9"/><path d="M100 187v9"/><path d="M4 100h9"/><path d="M187 100h9"/></g><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9.5"><path d="M22 148 Q 42 140 54 132 T 82 116 L 92 110" stroke="#FFFFFF"/><path d="M92 110 Q 108 112 112 100 T 100 88 Q 92 88 88 92" stroke="#2EA896"/><path d="M88 92 Q 104 84 112 70 T 132 44" stroke="#FFFFFF"/></g><circle cx="22" cy="148" r="6.5" fill="#FFFFFF"/><circle cx="136" cy="40" r="14" fill="#0A2233" stroke="#E06A42" stroke-width="4.5"/><circle cx="136" cy="40" r="6" fill="#E06A42"/></svg><div class="brand-txt"><h1>East Coast <em>Training</em></h1><div class="eyebrow">Shelter Island → Acadia → New York</div></div></div><div class="prog" id="prog"></div></div><div class="readout" id="readout"></div></header>
  <div class="route" id="route"><div class="line"></div><div class="track" id="track"></div></div>
  <section class="panel" id="panel"></section>
</div>

<script>
"use strict";

/* ---------------- Circuits ---------------- */
const CIRCUITS = {
A:{name:"Circuit A — Poussée",tours:["3 tours","4 tours","4 tours"],rest:"90 s de repos entre les tours",moves:[
 {n:"Pompes déclinées",cue:"Pieds sur un banc ou la marche du camping-car (30-40 cm). Mains un peu plus larges que les épaules, descente en 2 s, poitrine à 5 cm du sol.",p:["12 reps","14 reps","15 reps"]},
 {n:"Dips sur table de pique-nique",cue:"Mains sur le bord, jambes tendues devant, coudes à 90°. Torse penché vers l'avant pour charger le pectoral bas.",p:["10 reps","12 reps","14 reps"]},
 {n:"Pompes piquées",cue:"Bassin haut, tête vers le sol entre les mains, coudes près du corps. C'est l'exercice d'épaules.",p:["8 reps","10 reps","12 reps, pieds surélevés"]},
 {n:"Pompes diamant",cue:"Mains jointes sous le sternum, index et pouces en losange. Coudes rasant les côtes. C'est l'exercice de triceps.",p:["10 reps","12 reps","12 reps, descente en 3 s"]},
 {n:"Planche + planche latérale",cue:"Bassin verrouillé, fessiers serrés. Pas de creux lombaire.",p:["40 s + 25 s / côté","50 s + 30 s / côté","60 s + 40 s / côté"]}]},
B:{name:"Circuit B — Tirage",tours:["3 tours","4 tours","4 tours"],rest:"90 s de repos · élastiques requis",moves:[
 {n:"Tractions",cue:"Barre d'aire de jeux ou branche, prise pronation largeur épaules. Si moins de 5 reps : négatives, saut en position haute puis descente freinée en 5 s.",p:["max, ou 6 négatives","max + 1, ou 8 négatives","max + 2, ou 8 négatives"]},
 {n:"Rowing élastique",cue:"Élastique ancré à un arbre ou à la roue du camping-car, hauteur du nombril. Coudes serrés le long du corps, 1 s de contraction en fin de tirage.",p:["15 reps","18 reps","20 reps"]},
 {n:"Face pull élastique",cue:"Ancrage à hauteur du visage, coudes hauts, tirer jusqu'aux tempes en écartant. C'est ce qui compense les pompes et tient la posture.",p:["20 reps","20 reps","25 reps"]},
 {n:"Curl élastique",cue:"Debout, pieds au milieu de l'élastique, coudes collés au corps. Montée franche, descente en 3 s.",p:["15 reps","18 reps","20 reps"]},
 {n:"Superman + fentes marchées",cue:"À plat ventre, bras et jambes décollés 2 s. Puis fentes marchées, genou arrière frôlant le sol.",p:["15 reps + 20 pas","18 reps + 24 pas","20 reps + 30 pas"]},
 {n:"Squat au poids du corps",cue:"Pieds largeur épaules, descente jusqu'à la cuisse parallèle, poids sur le milieu du pied. Les jambes sont ta plus grosse masse musculaire : c'est ce qui fait tourner le métabolisme.",p:["20 reps","25 reps","30 reps"]}]},
P:{name:"Bloc posture — 6 min",tours:["1 tour","1 tour","1 tour"],rest:"tous les jours, repos compris",moves:[
 {n:"Rétractions cervicales",cue:"Debout dos au mur, menton rentré à l'horizontale, nuque plaquée. Tenir 5 s. Corrige la tête projetée en avant.",p:["10 × 5 s","10 × 5 s","12 × 5 s"]},
 {n:"Extension thoracique",cue:"Allongé sur une serviette roulée placée en travers, sous les omoplates. Bras au-dessus de la tête, respirer profondément pour ouvrir la cage.",p:["8 respirations","10 respirations","10 respirations"]},
 {n:"Étirement pectoral en encadrement",cue:"Avant-bras contre le montant de la porte, coude à hauteur d'épaule, avancer d'un pas. Sans forcer.",p:["2 × 30 s / côté","2 × 30 s / côté","2 × 30 s / côté"]},
 {n:"Pull-apart élastique",cue:"Élastique tendu devant soi bras tendus, écarter jusqu'à la poitrine en serrant les omoplates. Lent.",p:["20 reps","25 reps","25 reps"]}]}
};

/* ---------------- Plan ---------------- */
const ENDU="Allure conversationnelle : tu dois pouvoir dire une phrase entière sans couper. Si tu ne peux pas, ralentis.";
const FRAC="15 min d'échauffement, puis 8 × (1 min rapide / 1 min de marche), puis 10 min de retour au calme.";
const R=(l,km,c)=>({kind:"run",label:l,km:km,cue:c,vo2:1});
const I=(l,c)=>({kind:"interval",label:l,cue:c,vo2:1});
const S=c=>({kind:"strength",label:CIRCUITS[c].name,circuit:c});
const W=(l,c)=>({kind:"swim",label:l,cue:c});
const K=(l,km,c)=>({kind:"kayak",label:l,km:km,cue:c});
const Z=(l,c,v)=>({kind:"rest",label:l,cue:c,vo2:v?1:0});

const PLAN=[
{d:"2026-08-06",ph:0,bl:0,ss:[R("Course 80 min",null,"Faite ce matin. Coche-la et note la VO2max si la montre a produit un relevé."),W("Natation 60 min","En continu autant que possible. Si tu fatigues, alterne 200 m crawl / 100 m dos plutôt que de t'arrêter au mur.")]},
{d:"2026-08-07",ph:0,bl:0,ss:[K("Kayak, rythme soutenu",10,"Séance principale du jour. Cadence haute, buste engagé — le kayak est du tirage, c'est ta séance de dos."),S("A"),W("Natation 30-45 min","Crawl en continu, pas de pause au mur.")]},
{d:"2026-08-08",ph:0,bl:0,ss:[R("Course endurance",8,ENDU),S("B"),W("Natation 45-60 min","Alterne 200 m crawl / 100 m dos. Dernière grosse journée avant le rythme 1h30.")]},

{d:"2026-08-09",ph:1,bl:0,ss:[Z("Repos — journée de route","Transfert vers le camping-car. Rien à faire, sinon marcher 15 min à chaque arrêt pour décoincer les hanches.")]},
{d:"2026-08-10",ph:1,bl:0,ss:[R("Course endurance",9,ENDU),S("A")]},
{d:"2026-08-11",ph:1,bl:0,ss:[I("Fractionné 8 × 1 min",FRAC),S("B")]},
{d:"2026-08-12",ph:1,bl:0,ss:[R("Course courte",6,ENDU),S("B"),S("A")]},
{d:"2026-08-13",ph:1,bl:0,ss:[Z("Repos ou marche facile","Marche 45 min minimum en extérieur si tu veux une mesure VO2max propre.",1)]},

{d:"2026-08-14",ph:1,bl:1,ss:[R("Course endurance",9,ENDU),S("A")]},
{d:"2026-08-15",ph:1,bl:1,ss:[I("Fractionné 8 × 1 min",FRAC),S("B")]},
{d:"2026-08-16",ph:1,bl:1,ss:[Z("Repos — journée de route","Longue étape. Circuit reporté à lundi, ne rattrape rien.")]},
{d:"2026-08-17",ph:1,bl:1,ss:[R("Course courte",6,ENDU),S("B"),S("A")]},

{d:"2026-08-18",ph:1,bl:1,ss:[R("Course endurance",9,ENDU),S("A")]},
{d:"2026-08-19",ph:1,bl:1,ss:[I("Fractionné 8 × 1 min",FRAC),S("B")]},
{d:"2026-08-20",ph:1,bl:1,ss:[Z("Repos ou randonnée","Randonnée à Acadia : elle remplace la course, n'ajoute rien d'autre.",1)]},

{d:"2026-08-21",ph:2,bl:2,ss:[R("Hudson River Greenway",8,ENDU),S("A")]},
{d:"2026-08-22",ph:2,bl:2,ss:[Z("Repos actif — marche urbaine","Tu feras 15 000 pas sans y penser. Garde le GPS actif sur une marche de 30 min pour la mesure.",1),S("B")]},
{d:"2026-08-23",ph:2,bl:2,ss:[R("Boucle complète de Central Park",10,ENDU),S("A")]},
{d:"2026-08-24",ph:2,bl:2,ss:[I("Fractionné 25 min","10 min d'échauffement, 6 × (90 s rapide / 90 s marche), 5 min de retour au calme."),S("B")]},
{d:"2026-08-25",ph:2,bl:2,ss:[R("Course facile",6,"Dernière sortie. Allure libre, pas de chrono.")]},
{d:"2026-08-26",ph:3,bl:2,ss:[]}
];
PLAN.forEach(d=>{if(d.ss.length)d.ss.push({kind:"posture",label:"Bloc posture",circuit:"P"})});

const PHASES=[
{l:"Shelter Island",s:"eau libre, kayak et natation"},
{l:"Camping-car",s:"Cape Cod, Boston, Acadia — rythme 1h30"},
{l:"New York",s:"course en ville, marche permanente"},
{l:"Retour",s:""}];

const KIND={
run:{t:"COURSE",c:"var(--k-run)"},interval:{t:"FRACTIONNÉ",c:"var(--k-run)"},
strength:{t:"FORCE",c:"var(--k-str)"},posture:{t:"POSTURE",c:"var(--k-pos)"},
swim:{t:"NATATION",c:"var(--k-swim)"},kayak:{t:"KAYAK",c:"var(--k-swim)"},
rest:{t:"REPOS",c:"var(--k-rest)"}};

const DOW=["dim","lun","mar","mer","jeu","ven","sam"];
const PROTEIN=170, VO2_START=42, VO2_REF=48, DRINK_CAP=17, KEY="jdb-v1";

/* Contrôle de version : à changer À CHAQUE déploiement, en même temps que
   le fichier version.txt à la racine. Les deux doivent être identiques,
   sinon le raccourci iOS se rechargera en boucle à chaque ouverture. */
const VERSION="2026-08-06.5", RKEY="jdb-reload";

/* ---------------- Stockage ---------------- */
let log={}, memOnly=false;
function load(){
  try{const r=localStorage.getItem(KEY); if(r) log=JSON.parse(r); setSave("Synchronisé");}
  catch(e){memOnly=true; setSave("Stockage indisponible — données de cette session uniquement");}
}
function save(){
  if(memOnly)return;
  try{localStorage.setItem(KEY,JSON.stringify(log)); setSave("Enregistré");}
  catch(e){memOnly=true; setSave("Enregistrement impossible");}
}
function setSave(t){const el=document.getElementById("save"); if(el)el.textContent=t;}

/* ---------------- Mise à jour du raccourci ----------------
   Le raccourci iOS sert la page depuis son cache et GitHub Pages ne permet
   pas de fixer d'en-tête Cache-Control. On interroge donc version.txt hors
   cache : si le déploiement est plus récent que la page qui tourne, on
   recharge avec un paramètre que le cache ne connaît pas. */
let stale="";
function ses(op,v){try{return op==="get"?sessionStorage.getItem(RKEY):op==="set"?sessionStorage.setItem(RKEY,v):sessionStorage.removeItem(RKEY);}catch(e){return null;}}
function checkVersion(){
  const tried=ses("get");
  fetch("version.txt",{cache:"no-store"})
    .then(r=>r.ok?r.text():null)
    .then(t=>{
      const v=t&&t.trim();
      if(!v||v===VERSION){ses("del");return;}
      /* Rechargement déjà tenté pour cette version : le cache n'a pas cédé.
         On s'arrête là plutôt que de boucler, et on le signale. */
      if(tried===v){stale="Nouvelle version disponible — ferme puis rouvre le raccourci";setSave(stale);return;}
      ses("set",v);
      location.replace(location.pathname+"?v="+encodeURIComponent(v));
    })
    .catch(()=>{});
}

/* ---------------- Utilitaires ---------------- */
const pad=n=>String(n).padStart(2,"0");
function todayKey(){const n=new Date();return n.getFullYear()+"-"+pad(n.getMonth()+1)+"-"+pad(n.getDate());}
function parse(k){const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function fmt(k){const dt=parse(k);return{dow:DOW[dt.getDay()],num:pad(dt.getDate())};}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function entry(k){return log[k]||(log[k]={done:{},alcohol:"",protein:false,vo2:""});}
function units(day){const u=[];day.ss.forEach((s,i)=>{if(s.kind==="rest")return;
  if(s.circuit)CIRCUITS[s.circuit].moves.forEach((_,j)=>u.push("s"+i+"e"+j));else u.push("s"+i);});return u;}

const TODAY=todayKey();
let open=PLAN.some(d=>d.d===TODAY)?TODAY:PLAN[0].d;

/* ---------------- Rendu ---------------- */
function bg(){
  let s="";for(let i=0;i<9;i++){const y=40+i*78;
    s+='<path d="M-20 '+y+' C 90 '+(y-34)+', 200 '+(y+40)+', 320 '+(y-12)+' S 540 '+(y+30)+', 700 '+(y-20)+'" fill="none" stroke="#DCE6EB" stroke-width="1"/>';}
  document.getElementById("bg").innerHTML=s;
}

function stats(){
  let done=0,total=0,dayDone=0,dayTotal=0,strength=0,km=0,drinks=0,drinkDays=0,prot=0,logged=0;const vo2=[];
  PLAN.forEach(day=>{
    const e=log[day.d],u=units(day);
    total+=u.length;
    if(e)u.forEach(k=>{if(e.done[k])done++;});
    if(day.d===TODAY){dayTotal=u.length;if(e)u.forEach(k=>{if(e.done[k])dayDone++;});}
    if(e)day.ss.forEach((s,i)=>{
      if(s.circuit){if(s.circuit!=="P"&&CIRCUITS[s.circuit].moves.every((_,j)=>e.done["s"+i+"e"+j]))strength++;}
      else if(e.done["s"+i]&&s.km)km+=s.km;});
    if(e){
      if(typeof e.alcohol==="number"){drinks+=e.alcohol;if(e.alcohol>0)drinkDays++;}
      if(e.protein)prot++;
      if(e.protein||e.alcohol!==""||e.vo2)logged++;
      if(e.vo2)vo2.push({k:day.d,v:parseFloat(e.vo2)});}
  });
  const left=Math.max(0,Math.round((parse("2026-08-26")-parse(TODAY))/86400000));
  return{done:done,total:total,dayDone:dayDone,dayTotal:dayTotal,strength:strength,km:km,drinks:drinks,drinkDays:drinkDays,prot:prot,logged:logged,vo2:vo2,left:left};
}

function vo2svg(v){
  const Wd=600,H=150,mn=38,mx=50,y=x=>18+((mx-x)/(mx-mn))*(H-48);
  if(!v.length)return '<div class="meta">Relevés VO2max (ml/kg/min)</div><p class="empty">Aucun relevé. La montre a besoin d\'au moins 20 min de marche ou de course en extérieur, GPS actif, à allure soutenue et régulière.</p>';
  const X=i=>26+(i*(Wd-62))/Math.max(v.length-1,1);
  let s='<div class="meta">Relevés VO2max (ml/kg/min)</div><svg viewBox="0 0 '+Wd+' '+H+'" style="width:100%;height:auto">';
  s+='<line x1="20" y1="'+y(VO2_REF)+'" x2="'+(Wd-20)+'" y2="'+y(VO2_REF)+'" class="gl-ref" stroke-dasharray="4 5"/>';
  s+='<text x="'+(Wd-20)+'" y="'+(y(VO2_REF)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">48 · il y a 3 mois</text>';
  s+='<line x1="20" y1="'+y(VO2_START)+'" x2="'+(Wd-20)+'" y2="'+y(VO2_START)+'" class="gl-start" stroke-dasharray="2 4"/>';
  s+='<text x="'+(Wd-20)+'" y="'+(y(VO2_START)+13)+'" text-anchor="end" class="g-txt" font-size="10" font-family="monospace">42 · départ</text>';
  s+='<polyline points="'+v.map((e,i)=>X(i)+","+y(e.v)).join(" ")+'" fill="none" class="g-line" stroke-width="1.8"/>';
  v.forEach((e,i)=>{s+='<circle cx="'+X(i)+'" cy="'+y(e.v)+'" r="3.4" class="g-dot"/><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+fmt(e.k).num+'</text>';});
  s+='</svg>';
  const d=v[v.length-1].v-VO2_START;
  s+='<div class="meta" style="margin-top:2px">Dernier relevé '+v[v.length-1].v.toFixed(1)+' · <span style="color:'+(d>=0?"var(--depth)":"var(--buoy)")+'">'+(d>0?"+":"")+d.toFixed(1)+' depuis le départ</span></div>';
  return s;
}

function gauge(d,t,lab,col){
  const C=2*Math.PI*19, on=t?(C*d/t):0;
  return '<div class="gauge" title="'+d+' exercice'+(d>1?"s":"")+' tenu'+(d>1?"s":"")+' sur '+t+' — '+lab+'">'+
    '<svg class="ring" viewBox="0 0 44 44" aria-hidden="true">'+
      '<circle cx="22" cy="22" r="19" fill="none" style="stroke:var(--edge)" stroke-width="4"/>'+
      (on>0?'<circle cx="22" cy="22" r="19" fill="none" style="stroke:'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+on.toFixed(2)+' '+(C-on).toFixed(2)+'"/>':'')+
    '</svg>'+
    '<div><div class="g-val">'+(t?d+'<span class="g-sub">/'+t+'</span>':'<span class="g-sub">—</span>')+'</div>'+
    '<div class="g-lab">'+lab+'</div></div></div>';
}

function render(){
  const st=stats();
  document.getElementById("prog").innerHTML=
    gauge(st.dayDone,st.dayTotal,"du jour","var(--buoy)")+
    gauge(st.done,st.total,"tout le plan","var(--depth)");

  document.getElementById("readout").innerHTML=
    '<div><div class="ro-val">'+st.left+'</div><div class="ro-lab">jours avant le retour</div></div>'+
    '<div><div class="ro-val">'+(st.vo2.length?st.vo2[st.vo2.length-1].v.toFixed(0):VO2_START)+'<span class="ro-sub"> VO2max</span></div><div class="ro-lab">dernier relevé</div></div>';

  const idx=PLAN.findIndex(d=>d.d===TODAY);
  document.getElementById("track").style.height=(idx<0?0:((idx+.5)/PLAN.length)*100)+"%";

  let html='<div class="line"></div><div class="track" id="track" style="height:'+(idx<0?0:((idx+.5)/PLAN.length)*100)+'%"></div>',lastPh=-1;
  PLAN.forEach(day=>{
    const e=entry(day.d),f=fmt(day.d),u=units(day),
      dn=u.filter(k=>e.done[k]).length,full=u.length>0&&dn===u.length,
      isT=day.d===TODAY,isO=open===day.d;
    if(day.ph!==lastPh){lastPh=day.ph;
      html+='<div class="phase" style="margin-left:-34px"><span class="phase-name">'+PHASES[day.ph].l+'</span><span class="phase-sub">'+PHASES[day.ph].s+'</span><span class="rule"></span></div>';}
    const sum=day.ss.length?day.ss.filter(s=>s.circuit!=="P").map(s=>s.km?s.km+" km":(s.circuit?"circuit "+s.circuit:KIND[s.kind].t.toLowerCase())).join(" · ")+" · posture":"Vol retour";

    html+='<div class="day"><span class="node '+(isT?"now":full?"done":"")+'"></span><div class="card '+(isT?"now":"")+'">'+
      '<button class="card-head" data-open="'+day.d+'"><div class="card-top"><span class="date">'+f.dow+' <b>'+f.num+'</b></span><span class="sum">'+sum+'</span>'+
      (u.length?'<span class="count '+(full?"full":"")+'">'+dn+'/'+u.length+'</span>':'')+'</div></button>';

    if(isO){
      html+='<div class="detail">';
      day.ss.forEach((s,i)=>{
        const on=!!e.done["s"+i],c=s.circuit?CIRCUITS[s.circuit]:null;
        html+='<div class="sess"><div class="sess-head">';
        if(!c&&s.kind!=="rest")html+='<button class="box" data-t="'+day.d+'|s'+i+'" data-on="'+(on?1:0)+'">'+(on?chk(15):"")+'</button>';
        html+='<div style="flex:1;min-width:0"><span class="tag" style="color:'+KIND[s.kind].c+'">'+KIND[s.kind].t+'</span>'+
          '<div class="sess-lab '+(on&&!c?"off":"")+'">'+esc(s.label)+(s.km?' <span class="km">'+s.km+' km</span>':'')+'</div>'+
          (s.cue?'<div class="cue">'+esc(s.cue)+'</div>':'')+'</div></div>';
        if(c){
          html+='<div class="block"><div class="meta">'+c.tours[day.bl]+' · '+c.rest+'</div>';
          c.moves.forEach((m,j)=>{const id="s"+i+"e"+j,ok=!!e.done[id];
            html+='<div class="ex"><button class="box sm" data-t="'+day.d+'|'+id+'" data-on="'+(ok?1:0)+'">'+(ok?chk(13):"")+'</button>'+
              '<div class="ex-body"><div class="ex-line"><span class="ex-n '+(ok?"off":"")+'">'+esc(m.n)+'</span><span class="ex-p">'+esc(m.p[day.bl])+'</span></div>'+
              '<div class="ex-c">'+esc(m.cue)+'</div></div></div>';});
          html+='</div>';}
        html+='</div>';});

      html+='<div class="log">';
      if(day.ss.some(s=>s.vo2))
        html+='<div class="log-row"><span class="log-lab">VO2max relevée<span class="hint">Après la sortie, valeur de la montre</span></span>'+
          '<input type="number" step="0.1" inputmode="decimal" placeholder="—" value="'+(e.vo2||"")+'" data-f="'+day.d+'|vo2"><span class="log-lab" style="flex:0;width:22px">ml</span></div>';
      html+='<div class="log-row"><span class="log-lab">Protéines — '+PROTEIN+' g atteints</span>'+
        '<button class="box" data-p="'+day.d+'" data-on="'+(e.protein?1:0)+'">'+(e.protein?chk(15):"")+'</button></div>';
      html+='<div class="log-row"><span class="log-lab">Verres d\'alcool<span class="hint">Bière, verre de vin ou cocktail</span></span><div class="pills">';
      [0,1,2,3,4].forEach(n=>{html+='<button class="pill" data-a="'+day.d+'|'+n+'" data-on="'+(e.alcohol===n?1:0)+'" data-over="'+(n>=3?1:0)+'">'+(n===4?"4+":n)+'</button>';});
      html+='</div></div></div>';
      if(!day.ss.length)html+='<p class="empty">Vol retour. Rien de prévu — le bilan est en bas de page.</p>';
      html+='</div>';}
    html+='</div></div>';});
  document.getElementById("route").innerHTML=html;

  document.getElementById("panel").innerHTML=
    '<h2>Bilan</h2><p class="panel-sub">Pas de balance sur ce voyage : la VO2max est la seule mesure de référence. Elle intègre à la fois le poids et la fatigue.</p>'+
    '<div class="grid">'+
    '<div class="cell"><div class="cell-v '+(st.strength>=4?"ok":"")+'">'+st.strength+'</div><div class="cell-l">Circuits complets<br>cible 4 / semaine</div></div>'+
    '<div class="cell"><div class="cell-v">'+st.km+'</div><div class="cell-l">Kilomètres courus<br>plafond 12 km / sortie</div></div>'+
    '<div class="cell"><div class="cell-v '+(st.drinks>DRINK_CAP?"warn":"")+'">'+st.drinks+'<span class="ro-sub" style="font-size:13px"> / '+st.drinkDays+' soirs</span></div><div class="cell-l">Verres cumulés<br>plafond '+DRINK_CAP+' sur le séjour</div></div>'+
    '<div class="cell"><div class="cell-v '+(st.logged>0&&st.prot>=st.logged?"ok":"")+'">'+st.prot+'</div><div class="cell-l">Jours à '+PROTEIN+' g de protéines<br>sur '+st.logged+' jours notés</div></div>'+
    '</div><div class="graph">'+vo2svg(st.vo2)+'</div>'+
    '<p class="foot">Jour serré, 45 min seulement : circuit du jour + bloc posture, la course saute. Le circuit protège le muscle en déficit, la course est remplaçable. Douleur au tendon d\'Achille ou au tibia : la course s\'arrête, les circuits continuent.</p>'+
    '<div class="tools"><button class="tool" id="exp">Exporter</button><button class="tool" id="imp">Importer</button></div>'+
    '<div class="save" id="save"></div>';
  setSave(stale||(memOnly?"Stockage indisponible":"Enregistré"));
}

function chk(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.4 6.4 11.2 12.5 4.9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

/* ---------------- Interactions ---------------- */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-open],[data-t],[data-p],[data-a],#exp,#imp");
  if(!t)return;
  if(t.id==="exp"){
    const s=JSON.stringify(log);
    if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>alert("Données copiées dans le presse-papiers."),()=>prompt("Copie ce texte :",s));
    else prompt("Copie ce texte :",s);
    return;}
  if(t.id==="imp"){
    const s=prompt("Colle ici les données exportées :");
    if(s){try{log=JSON.parse(s);save();render();}catch(e){alert("Format non reconnu.");}}
    return;}
  if(t.dataset.open!==undefined){open=(open===t.dataset.open)?null:t.dataset.open;render();return;}
  if(t.dataset.t){const a=t.dataset.t.split("|"),e=entry(a[0]);e.done[a[1]]=!e.done[a[1]];save();render();return;}
  if(t.dataset.p){const e=entry(t.dataset.p);e.protein=!e.protein;save();render();return;}
  if(t.dataset.a){const a=t.dataset.a.split("|"),e=entry(a[0]),n=Number(a[1]);e.alcohol=(e.alcohol===n)?"":n;save();render();}
});
document.addEventListener("change",ev=>{
  const f=ev.target.dataset.f;if(!f)return;
  const a=f.split("|");entry(a[0])[a[1]]=ev.target.value;save();
});

bg();load();render();checkVersion();
</script>
</body>
</html>
