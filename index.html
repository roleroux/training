<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#FFFFFF;--surface:#FFFFFF;--tint:#F7FAFB;--edge:#D6DFE4;
  --ink:#0A2233;--fog:#5E7180;
  --buoy:#C24A2C;--depth:#1E7F72;--brass:#8A6E1B;
  --wave:#DCE6EB;--chart-grid:#C7D4DA;--press:rgba(10,34,51,.05);--veil:rgba(255,255,255,.82);
  /* Posé sur --depth : blanc en clair, encre en sombre. Le blanc sur
     l'accent sombre ne donnait que 2,92:1, sous le seuil de 3:1. */
  --on-accent:#FFFFFF;
  /* Fond du monogramme. En sombre, le bleu nuit d'origine tombait à
     1,13:1 contre la page : le disque disparaissait et les quatre
     repères orange flottaient sans ancrage. */
  --mark-bg:#0A2233;
  --k-run:#C24A2C;--k-str:#1E7F72;--k-pos:#8A6E1B;--k-swim:#3E7FA3;--k-rest:#5E7180;
  --shadow:0 1px 2px rgba(10,34,51,.04),0 5px 16px rgba(10,34,51,.05);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B151E;--surface:#121F2B;--tint:#1A2A39;--edge:#263B4D;
  --ink:#E9EFF4;--fog:#8FA5B5;
  --buoy:#E8764F;--depth:#3AA893;--brass:#CBA84C;
  --wave:#152230;--chart-grid:#2A4054;--press:rgba(255,255,255,.06);--veil:rgba(11,21,30,.82);
  --on-accent:#08121A;
  --mark-bg:#1B3149;
  --k-run:#E8764F;--k-str:#3AA893;--k-pos:#CBA84C;--k-swim:#6FB0D6;--k-rest:#8296A6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}}
html,body{margin:0;background:var(--paper)}
body{
  color:var(--ink);font-family:var(--sans);
  padding:0 env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 70px) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
.bg{position:fixed;inset:0;pointer-events:none;opacity:.9;z-index:0}
#bg path{stroke:var(--wave)}
.mark-bg{fill:var(--mark-bg)}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--depth);outline-offset:2px;border-radius:4px}
.box,.pill,.tool{transition:transform .08s ease,background-color .12s ease,border-color .12s ease}
.box:active,.pill:active,.tool:active{transform:scale(.93)}

header{
  position:sticky;top:0;z-index:5;
  margin:0 -18px;padding:calc(12px + env(safe-area-inset-top)) 18px 16px;
  border-bottom:1px solid var(--edge);
  background:var(--veil);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  transition:padding .18s ease;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:var(--paper)}
}
header.compact{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:10px}
.mark,h1,.eyebrow,.prog,.ring,.g-val{transition:all .18s ease}
.compact .mark{flex-basis:40px;width:40px;height:40px}
.compact h1{font-size:22px}
.compact .eyebrow{max-height:0;opacity:0;margin-top:0}
.compact .prog{margin-top:10px;gap:9px 22px}
.compact .ring{width:31px;height:31px;flex-basis:31px}
.compact .g-val{font-size:14px}
.hdr-top{display:block}
.brand{display:flex;align-items:center;gap:13px}
.mark{width:58px;height:58px;flex:0 0 58px}
.brand-txt{min-width:0}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fog);margin-top:5px;max-height:22px;overflow:hidden}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.02;margin:0;letter-spacing:-.01em}

.prog{display:grid;grid-template-columns:repeat(2,auto);gap:16px 26px;justify-content:center;margin-top:20px}
@media (min-width:600px){.prog{grid-template-columns:repeat(4,auto);gap:24px}}
.gauge{display:flex;align-items:center;gap:8px}
.ring{width:38px;height:38px;flex:0 0 38px;transform:rotate(-90deg)}
.g-val{font-family:var(--mono);font-size:16px;font-weight:500;line-height:1;white-space:nowrap}
.g-sub{color:var(--fog);font-size:11px}
.g-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:5px;white-space:nowrap}
@media (max-width:430px){.prog{gap:14px 20px}}

/* Pas de position:sticky ici : sans « top » elle n'a jamais collé, et
   l'en-tête figé porte déjà le repère. Le fond voilé reste nécessaire,
   les vagues du fond défilent derrière. */
.tabs{margin:0 -18px;padding:0 18px;display:flex;gap:0;border-bottom:1px solid var(--edge);
  background:var(--veil);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--fog);cursor:pointer;
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;padding:13px 4px}
.tab.on{color:var(--ink);border-bottom-color:var(--buoy)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--buoy);margin-left:5px;vertical-align:middle}
.mo{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.mo-name{font-family:var(--serif);font-style:italic;font-size:18px;text-transform:capitalize}
.mo-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog)}
.jrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:inherit;
  font:inherit;cursor:pointer;padding:11px 13px;border-bottom:1px solid var(--edge)}
.jrow:last-child{border-bottom:none}
.jrow:active{background:var(--press)}
.jrow.today{background:var(--tint)}
/* today et « ouvert » partageaient le même fond : on ne savait plus
   laquelle des deux lignes était le jour courant. */
.jrow.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--depth)}
.jdet{border-bottom:1px solid var(--edge)}
.jbox>.jdet:last-child{border-bottom:none}
.jbox{border:1px solid var(--edge);border-radius:9px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.jd{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;min-width:52px;color:var(--fog)}
.jd b{color:var(--ink);font-weight:600}
.js{font-size:12px;color:var(--fog);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jm{font-family:var(--mono);font-size:10px;color:var(--fog)}
.jm.full{color:var(--depth)}
.banners{margin-top:12px;display:grid;gap:6px}
.banner{font-size:11.5px;line-height:1.45;padding:8px 10px;border-radius:7px;border-left:3px solid var(--fog);background:var(--tint);color:var(--ink)}
.banner.warn{border-left-color:var(--buoy)}
.banner.info{border-left-color:var(--depth)}

.review{margin-top:20px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);padding:15px}
.review-t{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog)}
.review-d{font-size:12px;color:var(--fog);line-height:1.5;margin-top:6px}
.big{display:block;width:100%;margin-top:11px;padding:13px;border-radius:9px;border:none;background:var(--depth);color:var(--on-accent);font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}
.big.sec{background:none;border:1px solid var(--edge);color:var(--fog)}

/* Le nom, la bascule de régime et le trait tiennent la première ligne ;
   les volumes passent dessous plutôt que de casser le nom en deux. */
.week{display:flex;align-items:baseline;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.week-name{font-family:var(--serif);font-style:italic;font-size:19px;flex:0 0 auto}
.week-sub{font-size:11.5px;color:var(--fog);flex:0 0 100%;order:9}
.reg{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fog);
  background:none;border:1px solid var(--edge);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.reg.hot{color:var(--buoy);border-color:var(--buoy)}
.reg.man{background:var(--tint)}
.reg:active{background:var(--press)}
.reg{position:relative}
.reg::after{width:100%;height:40px}
.rule{height:1px;background:var(--edge);flex:1;min-width:14px}

.route{position:relative;padding-left:34px}
.line{position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:var(--edge)}
.day{position:relative;margin-bottom:9px}
.node{position:absolute;left:-31px;top:18px;width:11px;height:11px;border-radius:50%;border:1px solid var(--fog);background:var(--paper)}
.node.done{background:var(--depth);border-color:var(--depth)}
.node.now{background:var(--buoy);border-color:var(--buoy)}

.card{background:var(--surface);border:1px solid var(--edge);border-radius:9px;box-shadow:var(--shadow);overflow:hidden}
.card.now{border-color:var(--buoy)}
.card-head{width:100%;text-align:left;background:none;border:none;color:inherit;font:inherit;padding:14px 15px;display:block;cursor:pointer;transition:background-color .15s ease}
.card-head:active{background:var(--press)}
.card-top{display:flex;align-items:center;gap:10px}
.date{font-family:var(--mono);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;min-width:60px}
.date b{font-weight:600}
.sum{font-size:12.5px;color:var(--fog);flex:1}
.count{font-family:var(--mono);font-size:10.5px;color:var(--fog);background:var(--tint);border:1px solid var(--edge);border-radius:99px;padding:3px 9px}
.count.full{color:var(--on-accent);background:var(--depth);border-color:var(--depth)}

.detail{border-top:1px solid var(--edge);padding:13px 15px 15px}
.sess{padding:10px 0;border-bottom:1px solid var(--edge)}
.sess:last-of-type{border-bottom:none}
.sess-head{display:flex;align-items:flex-start;gap:11px}
.box{flex:0 0 26px;width:26px;height:26px;border:1.5px solid var(--fog);border-radius:8px;background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
/* Zone de touche élargie sans toucher au dessin. La case fait 26 px à
   l'œil — c'est le geste le plus répété de l'app, et il tombait sous le
   minimum de 44 px recommandé sur iOS. Le halo reste sous les 44 px pour
   ne pas mordre sur la commande voisine, mesurée à 6 px d'écart. */
.box::after,.alt::after,.reg::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.box::after{width:40px;height:40px}
.box[data-on="1"]{background:var(--depth);border-color:var(--depth)}
.box svg path{stroke:var(--on-accent)}
.box.sm{flex:0 0 22px;width:22px;height:22px;border-radius:7px}
.tags{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase}
.rank{font-family:var(--mono);font-size:9px;letter-spacing:.1em;border:1px solid var(--edge);border-radius:99px;padding:2px 7px;color:var(--fog)}
.rank.p1{color:var(--buoy);border-color:var(--buoy)}
.sess-lab{font-size:14px;margin-top:4px;line-height:1.35;font-weight:500}
.sess-lab.off{color:var(--fog);text-decoration:line-through}
.cue{font-size:12px;color:var(--fog);line-height:1.5;margin-top:5px}
.alt{margin-top:8px;background:none;border:1px solid var(--edge);border-radius:7px;color:var(--fog);font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;cursor:pointer;position:relative}
.alt::after{width:100%;height:40px}
.fallback{margin-top:9px;padding:10px 11px;background:var(--tint);border-left:2px solid var(--brass);border-radius:0 8px 8px 0;display:flex;gap:10px;align-items:flex-start}
.fallback .fb-t{font-size:12.5px;line-height:1.45;flex:1}
.conv{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--buoy);margin-top:6px}
.frozen-tag{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);border:1px solid var(--edge);border-radius:99px;padding:4px 10px;display:inline-block}
.ro{font-family:var(--mono);font-size:14px;color:var(--ink)}
.pivot{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--buoy);border-left:3px solid var(--buoy);background:var(--tint);border-radius:0 7px 7px 0;padding:8px 10px;margin-bottom:12px}
.todo{font-size:11.5px;line-height:1.5;color:var(--ink);border-left:3px solid var(--brass);background:var(--tint);border-radius:0 7px 7px 0;padding:9px 11px;margin:0 0 14px}

.log{margin-top:14px;padding-top:13px;border-top:1px solid var(--edge);display:grid;gap:13px}
.log-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.log-row.col{align-items:flex-start;flex-direction:column;gap:8px}
.log-row.col .pills{width:100%}
.log-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);flex:1;min-width:120px}
.log-lab .hint{text-transform:none;letter-spacing:0;display:block;font-family:var(--sans);font-size:11px;margin-top:3px;line-height:1.4}
.log-lab .hint.warn{color:var(--buoy)}
/* 16 px partout : en dessous, iOS zoome la page à la prise de focus et
   ne la dézoome jamais. Les champs date et heure en héritaient pas. */
input[type=number],input[type=text]{background:none;border:none;border-bottom:1px solid var(--edge);color:var(--ink);font-family:var(--mono);font-size:16px;width:76px;text-align:right;padding:4px;border-radius:0}
input[type=date],input[type=time]{font-family:var(--mono);font-size:16px;color:var(--ink);background:none;border:none;border-bottom:1px solid var(--edge);padding:4px;border-radius:0}
input[type=number]:focus,input[type=text]:focus{outline:none;border-bottom-color:var(--brass)}
.unit{font-family:var(--mono);font-size:9.5px;color:var(--fog);width:34px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-width:40px;height:38px;border:1px solid var(--edge);background:none;border-radius:9px;color:var(--fog);font-family:var(--mono);font-size:12px;cursor:pointer;padding:0 9px}
.pill[data-on="1"]{border-color:var(--depth);color:var(--depth)}
.pill[data-on="1"][data-over="1"]{border-color:var(--buoy);color:var(--buoy)}
/* Les deux créneaux qui font la journée sont marqués même décochés. */
.pill.key{border-style:solid;border-color:var(--fog)}
.pill.key[data-on="1"]{border-color:var(--depth);color:var(--depth);background:var(--tint)}
.pg{opacity:.55;font-size:10px}
.alx{width:74px}
/* Deux valeurs et leur unité sur une seule ligne : en flex, l'unité
   passait à la ligne et se retrouvait sous le libellé de la suivante. */
.log-row.pair{display:grid;grid-template-columns:1fr 68px 68px 30px;gap:8px;align-items:center}
.log-row.pair input{width:100%}
.pair-h span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);text-align:center}
.g-dot.hollow{fill:var(--surface);stroke:var(--brass);stroke-width:1.6}
input.bad{border-color:var(--buoy)}
.week-note{font-size:11.5px;line-height:1.5;color:var(--fog);margin:-6px 0 12px}
.obs{margin-top:20px}

.panel{margin-top:34px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:20px 18px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--serif);font-style:italic;font-size:19px;margin:0 0 4px;font-weight:600}
.panel-sub{font-size:11.5px;color:var(--fog);margin:0 0 16px;line-height:1.5}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tgt{border-collapse:collapse;width:100%;min-width:330px}
table.tgt th,table.tgt td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--edge);vertical-align:top}
/* Première colonne figée : sans elle, faire défiler vers la 3e échéance
   fait perdre de vue la ligne qu'on lit. */
table.tgt th:first-child,table.tgt td:first-child{position:sticky;left:0;background:var(--surface);width:104px;min-width:104px;padding-left:0}
table.tgt th{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);font-weight:400}
.t-lab{font-size:11.5px;line-height:1.35}
.t-cur{font-family:var(--mono);font-size:10px;color:var(--fog);display:block;margin-top:3px}
.t-cell{font-family:var(--mono);font-size:10.5px;line-height:1.35;white-space:nowrap}
.t-st{font-family:var(--mono);font-size:11px;margin-right:4px}
.ok{color:var(--depth)}.warn{color:var(--buoy)}.dim{color:var(--fog)}

.meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-bottom:9px}
.graph{margin-top:22px}
.gl-ref{stroke:var(--depth)}.gt-ref{fill:var(--depth)}.gl-start{stroke:var(--chart-grid)}
.g-txt{fill:var(--fog)}.g-line{stroke:var(--brass)}.g-dot{fill:var(--brass)}
.empty{font-size:12.5px;color:var(--fog);line-height:1.55;padding:10px 0;margin:0}
.foot{font-size:11.5px;color:var(--fog);line-height:1.6;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--edge)}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tool{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);background:none;border:1px solid var(--edge);border-radius:8px;padding:10px 14px;cursor:pointer}
.save{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fog);margin-top:12px}
.backup{font-size:11.5px;color:var(--fog);margin-top:14px;padding-top:12px;border-top:1px solid var(--edge)}
.backup.warn{color:var(--buoy)}
.refs-grid{display:grid;gap:12px}
.refs-h{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fog);margin-top:6px}
.mtgt{display:grid;gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:9px;overflow:hidden;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;background:var(--surface);padding:9px 11px;align-items:baseline}
.mlab{font-size:12.5px}
.mline{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--fog);line-height:1.5}
.mline b{font-size:13.5px;color:var(--ink);font-weight:500}
.mgap{font-family:var(--mono)}
.mgap.ok{color:var(--depth)}.mgap.warn{color:var(--buoy)}
.pace{font-size:11.5px;color:var(--fog);margin:0 0 4px;line-height:1.5}
table.tgt th.now,table.tgt td.now{background:var(--tint)}
table.tgt th.base,table.tgt td.base{color:var(--fog)}
.g-goal{stroke:var(--depth);fill:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){h1{font-size:28px}}
</style>
</head>

<script>
"use strict";

/* ================= Identité ================= */
/* Un seul point de changement pour le nom : title, meta iOS et h1 en dérivent. */
const APP="Pimperel";
const KEY="pimperel-v1";
/* Contrôle de version : à changer À CHAQUE déploiement, en même temps que
   version.txt à la racine. Les deux doivent être identiques. */
const VERSION="2026-08-23.9", RKEY="pmp-reload", OKEY="pmp-open", TKEY="pmp-tab";

/* ================= Cibles et constantes ================= */
/* ================= Cibles mensuelles ================= */
/* Treize mois, d'août 2026 à août 2027. Août est la LIGNE DE BASE : elle
   s'affiche et ne s'évalue jamais.
   ★ = valeur provisoire, à corriger le 30/08 après la première pesée.
   Elles sont toutes ici, c'est le seul endroit à toucher.
   waist = écart en cm sous la mesure de référence, pas une valeur absolue.
   sleep = heures décimales, comme le champ de saisie.
   prot  = nombre de jours sur 7 atteignant PROTEIN.
   La baisse de volume en août 2027 (48 → 40) est l'affûtage avant le
   semi du 28, pas une faute de frappe. */
const MONTHS=[
  {m:"2026-08",w:95.0,waist:0,   vol:22,sleep:5.83,prot:3,vo2:43,base:true},  /* ★ w, sleep */
  {m:"2026-09",w:93.5,waist:-1,  vol:26,sleep:6.17,prot:4,vo2:43},
  {m:"2026-10",w:92.2,waist:-2.5,vol:28,sleep:6.5, prot:4,vo2:44},
  {m:"2026-11",w:91.0,waist:-4,  vol:30,sleep:6.75,prot:5,vo2:44},
  {m:"2026-12",w:90.5,waist:-5,  vol:30,sleep:6.75,prot:5,vo2:45},
  {m:"2027-01",w:89.5,waist:-6,  vol:35,sleep:6.83,prot:5,vo2:45},
  {m:"2027-02",w:89.0,waist:-7,  vol:40,sleep:7.0, prot:5,vo2:46},
  {m:"2027-03",w:88.5,waist:-7.5,vol:40,sleep:7.0, prot:5,vo2:46},
  {m:"2027-04",w:88.0,waist:-8,  vol:42,sleep:7.0, prot:5,vo2:47},
  {m:"2027-05",w:87.5,waist:-8.5,vol:45,sleep:7.0, prot:5,vo2:47},
  {m:"2027-06",w:87.0,waist:-9,  vol:45,sleep:7.0, prot:5,vo2:48},
  {m:"2027-07",w:86.5,waist:-9.5,vol:48,sleep:7.0, prot:5,vo2:49},
  {m:"2027-08",w:86.0,waist:-10, vol:40,sleep:7.0, prot:5,vo2:49}   /* affûtage */
];
/* Les chronos ne sont pas mensuels : ce sont des tests datés. */
const TESTS=[
  {d:"2026-09-12",dist:"5 km",cible:null},   /* référence, sans cible */
  {d:"2026-11-28",dist:"5 km",cible:"26:30"},
  {d:"2027-01-30",dist:"10 km",cible:"57:00"},
  {d:"2027-02-27",dist:"10 km",cible:"55:00"},
  {d:"2027-04-24",dist:"10 km",cible:"53:00"},
  {d:"2027-06-26",dist:"10 km",cible:"51:00"},
  {d:"2027-07-24",dist:"semi",cible:"1:55:00"},
  {d:"2027-08-28",dist:"semi",cible:"1:52:00"}
];
/* Allure d'endurance de référence. Indication seulement, jamais évaluée. */
const PACES=[
  {until:"2026-11-30",txt:"6:10–6:30/km"},
  {until:"2027-02-28",txt:"5:55–6:20/km"},
  {until:"2027-08-31",txt:"5:40–6:00/km"}
];
/* Première pesée : la balance à impédance est en France. Avant cette date
   il n'existe aucune mesure de poids ni de tour de taille — les champs
   sont masqués et la jauge poids reste en veille. Aucune valeur de
   départ n'est supposée. */
const MEASURE_START="2026-08-30";
const RHR_TARGET=61, RHR_SPAN=10;   /* jauge vide à 71 bpm, pleine à 61 */
const PROTEIN=160, DRINK_WEEK=5, SLEEP_H=7, SLEEP_NIGHTS=5, BED_NIGHTS=4;
/* Bas de la jauge sommeil : en dessous, l'anneau reste vide. */
const SLEEP_LOW=5;
/* Protéines : quatre prises, chacune sa valeur. La whey fait 30 g, un
   déjeuner en brasserie 55. Total 165 g, soit la cible atteinte à 4/4
   seulement — trois prises plafonnent à 135 g, sous la fourchette. Les
   grammes ne sont pas une pesée : tout affichage est préfixé de « ≈ ».
   [clé, libellé, grammes, créneau clé] */
const PROT_SLOTS=[
  ["whey","Whey matin",30,1],
  ["midi","Déjeuner",55,0],
  ["diner","Dîner",50,1],
  ["coll","Collation",30,0]
];
const PROT_DAYS=5;   /* cible : 160 g atteints 5 jours sur 7 */
/* Plafond dur course, valeur par défaut. Aucun plan, même importé, ne
   peut autoriser davantage tant qu'elle n'est pas révisée en session
   coach — d'où le champ éditable settings.refs.runAbsMax plutôt qu'une
   constante figée : la décision ne doit pas attendre un déploiement. */
const RUN_ABS_MAX=40;
const TEST5K_TARGET=1590;   /* 26:30 en secondes, cible novembre */
/* Sauvegarde : au-delà, le journal ne tient plus qu'à un appareil. */
const EXPORT_MAX=10;

const KIND={
  salle:{t:"SALLE",c:"var(--k-str)"},course:{t:"COURSE",c:"var(--k-run)"},
  qualite:{t:"QUALITÉ",c:"var(--k-run)"},vtt:{t:"VTT",c:"var(--k-swim)"},
  natation:{t:"NATATION",c:"var(--k-swim)"},rando:{t:"RANDONNÉE",c:"var(--k-pos)"},mesures:{t:"MESURES",c:"var(--brass)"},
  marche:{t:"MARCHE",c:"var(--k-rest)"},repos:{t:"REPOS",c:"var(--k-rest)"}
};
const REGIME={normale:"semaine normale",chargee:"semaine chargée",vacances:"vacances"};
const DOW=["dim","lun","mar","mer","jeu","ven","sam"];

const SALLE={rank:"P1",kind:"salle",label:"Salle 60 min",
  detail:"Développé couché 4×5-6 · tractions 4×max · rowing barre 4×8 · presse ou squat 4×8 — charges de maintien · gainage 5 min · élévations mollets lentes 3×15.",
  fallback:"30 min : les 4 mouvements de référence, 2 séries chacun, rien d'autre."};
const FASCIA="Élévations talon lentes 3×12 (3 s de descente) + serviette sous les orteils 3×15.";

/* ================= Historique figé (relevé Apple Santé) =================
   Chargé une fois dans DB.days, uniquement sur les clés absentes : une
   saisie ultérieure n'est jamais écrasée. Ces jours portent frozen:true,

function ses(op,v,k){const key=k||RKEY;try{return op==="get"?sessionStorage.getItem(key):op==="set"?sessionStorage.setItem(key,v):sessionStorage.removeItem(key);}catch(e){return null;}}
const MAX_TRIES=3;
function checkVersion(){
  const now=Date.now(); if(now-lastCheck<60000)return; lastCheck=now;
  const rec=String(ses("get")||"").split("|"), triedV=rec[0], tries=+rec[1]||0;
  fetch("version.txt",{cache:"no-store"}).then(r=>r.ok?r.text():null).then(t=>{
    const v=t&&t.trim();
    if(!v||v===VERSION){ses("del"); if(stale){stale="";render();} return;}
    const n=(triedV===v)?tries:0;
    if(n>=MAX_TRIES){
      /* Trois URL neuves n'ont pas suffi : le cache ne cédera pas seul. */
      stale="Version "+v+" publiée, cette page reste sur "+VERSION+" — ferme puis rouvre le raccourci.";
      setSave(stale); render(); return;
    }
    ses("set",v+"|"+(n+1)); ses("set",open||"",OKEY); ses("set",tab,TKEY);
    /* Horodatage en plus du numéro de version : si un rechargement
       antérieur a été servi avant la propagation du CDN, l'URL
       ?v=<version> porte l'ancienne page en cache et la réutiliser la
       resservirait indéfiniment. Chaque tentative vise une URL inédite. */
    location.replace(location.pathname+"?v="+encodeURIComponent(v)+"."+Date.now());
  }).catch(()=>{});
}

const pad=n=>String(n).padStart(2,"0");

const parseD=k=>{const a=k.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);};

/* Volontairement une variable, pas une constante. iOS suspend l'app sans
   relancer le script : au retour le lendemain matin, un TODAY figé au
   chargement valait encore la veille — la carte « Aujourd'hui » montrait
   hier, et toute saisie s'écrivait sur la mauvaise journée. dayRoll() la
   remet à l'heure à chaque retour au premier plan. */
let TODAY=iso(new Date());
function dayRoll(){
  const now=iso(new Date());
  if(now===TODAY)return false;
  /* Si la journée en cours était dépliée, elle le reste — c'est la
     nouvelle qu'on veut sous les yeux, pas celle d'hier. */
  const wasToday=(open===TODAY);
  TODAY=now;
  if(wasToday)open=TODAY;
  return true;
}

/* ================= Agrégats ================= */
function num(v){if(v===""||v===null||v===undefined)return null;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null;}
function weekDays(mon){const a=[];for(let i=0;i<7;i++)a.push(addDays(mon,i));return a;}
function lastN(k,n){const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(k,-i));return a;}
function vals(keys,f){const o=[];keys.forEach(k=>{const e=DB.days[k];if(!e)return;const v=num(e[f]);if(v!==null)o.push(v);});return o;}
function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function total(a){return a.reduce((x,y)=>x+y,0);}
/* Seuil à 2 pesées : avec 3 à 5 nuits hors domicile par mois, l'exiger à
   3 éteignait la jauge, la ligne de cibles et l'alerte de perte sans
   rien dire. weekWeight() garde son type de retour — un nombre ou null,
   sept appelants en dépendent — et weekWeightN() dit sur combien de
   pesées la moyenne repose, pour afficher « partiel » à 2. */
const WEIGHT_MIN=2;

function weekWeight(mon){const v=vals(weekDays(mon),"weight");return v.length>=WEIGHT_MIN?avg(v):null;}

   à la nuit précédente, on le compte donc au-delà de 24 h pour que les
   moyennes et les comparaisons restent ordonnées. */
const BED_LIMIT=23*60+30;
function bedMin(e){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(e&&e.bedTime||""));
  if(!m)return null;
  const h=+m[1],mi=+m[2]; if(h>23||mi>59)return null;
  return h*60+mi+(h<12?24*60:0);

   l'heure exacte n'existe. */
function bedOk(e){const v=bedMin(e);return v!==null?v<BED_LIMIT:!!(e&&e.bed);}
function fmtMin(v){const t=Math.round(v)%(24*60);return pad(Math.floor(t/60))+":"+pad(t%60);}

function fmtDur(h){const t=Math.round(h*60);return Math.floor(t/60)+"h"+pad(t%60);}

   Trois décimales suffisent à retrouver la minute exacte. */

  if(!m)return"";

/* Un plan qui n'a pas encore commencé n'est pas un plan expiré : on
   l'affiche tel quel. Seule une date postérieure au dernier jour couvert
   déclenche la semaine par défaut. */
function activePlan(){
  const ws=(DB.plan&&DB.plan.weeks)||[],all=[];
  ws.forEach(w=>(w.days||[]).forEach(d=>all.push(d.d)));
  if(!all.length)return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};
  if(all.indexOf(TODAY)>=0)return{weeks:ws,expired:false};
  const min=all.reduce((a,b)=>a<b?a:b);
  if(TODAY<min)return{weeks:ws,expired:false,pending:min};
  return{weeks:[defaultWeek(mondayOf(TODAY))],expired:true};

   son plafond retombaient sur les valeurs par défaut alors que l'en-tête
   de semaine, lui, affichait bien ceux du plan. La sonde sur les jours
   reste en repli, pour les semaines sans start exploitable. */

  const ap=activePlan();

  return weekOf(mon)||weekOf(addDays(mon,1));

  const ap=activePlan();

   ne clippait plus rien pendant un mois (43,7 km début août → 48,1 de
   plafond, quand les deux semaines suivantes faisaient 11,3 et 6 km). Le
   volume de course est intermittent par construction : la randonnée s'y
   substitue — 62 km randonnés la semaine du 10/08, comptés zéro.
   Le seul garde-fou honnête est un plafond absolu, révisé à la main.
   implicit : semaine hors plan, qui ne s'est jamais vu opposer de
   plafond. La valeur sert l'alerte, pas la ligne de référence du graphe,
   qui inventerait un plafond rétroactif. */
function capFor(mon){
  const w=weekAt(mon),planned=w?num(w.runCapKm):null;
  const max=runAbsMax();
  return{
    cap:planned===null?max:Math.min(planned,max),
    clamped:planned!==null&&planned>max,
    planned:planned,implicit:planned===null,max:max
  };
}
/* Récupération : la valeur du jour est comparée à la moyenne des 7 jours
   qui la précèdent, pour que la mesure ne dilue pas sa propre référence.
   Le message dépend de ce qui est réellement au programme. Promettre
   qu'« une séance qualité passe en facile » un jour qui n'en porte pas —
   c'est-à-dire presque tous — annonçait une décision qui n'était prise
   nulle part. La séance est cherchée parmi celles RETENUES : sous régime
   chargé une P2 qualité est masquée, le bandeau ne doit pas promettre
   une conversion sur une séance invisible. */
function hasQualityToday(){
  const d=dayOf(TODAY);
  return !!(d&&kept(d).some(x=>x.s.kind==="qualite"));
}
function recovery(){
  const base=lastN(addDays(TODAY,-1),7);
  const e=DB.days[TODAY]; if(!e)return null;
  const rhr=num(e.rhr),hrv=num(e.hrv);
  const rB=avg(vals(base,"rhr")),hB=avg(vals(base,"hrv"));
  let metric=null,head="";
  if(rhr!==null&&rB!==null&&rhr>rB+5){
    metric="rhr";head="FC repos "+rhr+" bpm, soit +"+r1(rhr-rB)+" vs moyenne 7 j";
  }else if(hrv!==null&&hB!==null&&hrv<hB*0.85){
    metric="hrv";head="VFC "+hrv+" ms, soit "+r1((hrv/hB-1)*100)+" % vs moyenne 7 j";
  }else return null;
  return{metric:metric,text:head+(hasQualityToday()
    ?" — la séance qualité passe en facile."
    :" — pas d'intensité ajoutée aujourd'hui, allure basse sur ce qui est prévu.")};
}
function weightDrop(mon){
  const a=weekWeight(mon),b=weekWeight(addDays(mon,-7));
  if(a===null||b===null)return null;
  /* Une alerte de perte trop rapide assise sur deux pesées serait du
     bruit : les deux semaines comparées doivent être pleines. */
  if(weekWeightN(mon)<3||weekWeightN(addDays(mon,-7))<3)return null;
  /* Comparaison sur la valeur arrondie affichée : sans ça une baisse de
     0,7 kg pile déclenche l'alerte « au-delà de 0,7 kg » par flottant. */
  const d=r1(b-a);
  return d>0.7?d:null;
}
/* ================= Mois ================= */
const MOISKEY=k=>String(k).slice(0,7);
function monthEnd(m){const a=m.split("-").map(Number);return iso(new Date(a[0],a[1],0));}
function monthStart(m){return m+"-01";}
function monthAt(m){for(const x of MONTHS)if(x.m===m)return x;return null;}
/* Cible en vigueur : le mois courant, ou le dernier connu une fois la
   période terminée. */
function currentMonth(){
  const m=MOISKEY(TODAY),f=monthAt(m);
  if(f)return f;
  return TODAY<MONTHS[0].m?MONTHS[0]:MONTHS[MONTHS.length-1];
}
function paceAt(k){for(const p of PACES)if(k<=p.until)return p.txt;return PACES[PACES.length-1].txt;}

/* --- Médiane de volume sur 4 semaines pleines ---
   Une cible de volume ne se juge pas sur un total hebdomadaire : une
   semaine à 40 km suivie de trois à 15 ne vaut pas 40. La médiane des
   quatre semaines pleines qui précèdent résiste à ce pic. Une semaine
   sans donnée compte zéro — c'est une semaine sans course, pas une
   semaine inconnue. */
function runMedian4(mon){
  const v=[];
  for(let i=1;i<=4;i++)v.push(r1(total(vals(weekDays(addDays(mon,-7*i)),"runKm"))));
  v.sort((a,b)=>a-b);
  return r1((v[1]+v[2])/2);
}

/* --- Valeurs telles qu'elles se lisaient à une date donnée ---
   Un mois écoulé se juge sur ce qu'il affichait à sa fin, pas sur ce
   qu'on sait aujourd'hui. */
/* Agrégats hebdomadaires BORNÉS à une date. La semaine d'un 30 septembre
   déborde sur octobre : sans cette borne, septembre se jugeait sur des
   pesées d'octobre — exactement ce que « un mois écoulé se juge sur la
   valeur atteinte à sa fin » interdit. */
function weekWeightAt(mon,k){
  const v=vals(weekDays(mon).filter(d=>d<=k),"weight");
  return v.length>=WEIGHT_MIN?avg(v):null;
}
function weekVo2MaxAt(mon,k){
  const v=vals(weekDays(mon).filter(d=>d<=k),"vo2");
  return v.length?Math.max.apply(null,v):null;
}
function lastWeeklyAt(fn,k){
  let m=mondayOf(k);
  for(let i=0;i<60;i++){const v=fn(m,k);if(v!==null)return v;m=addDays(m,-7);}
  return null;
}
function lastValAt(f,k){
  const ks=Object.keys(DB.days).filter(x=>x<=k).sort();
  for(let i=ks.length-1;i>=0;i--){const v=num(DB.days[ks[i]][f]);if(v!==null)return v;}
  return null;
}
function protDaysAt(k){
  /* La journée en cours est incomplète : la fenêtre s'arrête la veille. */
  const end=(k>=TODAY)?addDays(TODAY,-1):k;
  let c=0;lastN(end,7).forEach(x=>{if(protG(rd(x))>=PROTEIN)c++;});
  return c;
}
function snapAt(k){
  const mon=mondayOf(k);
  return{
    w:lastWeeklyAt(weekWeightAt,k),
    waist:lastValAt("waist",k),
    vol:runMedian4(mon),
    sleep:avg(vals(lastN(k,7),"sleep")),
    prot:protDaysAt(k),
    vo2:lastWeeklyAt(weekVo2MaxAt,k)
  };
}
/* Tour de taille : la cible mensuelle est un écart, la mesure est
   absolue. Sans mesure de référence, la ligne reste une estimation. */
function waistTarget(f){
  const b=num((DB.settings.refs||{}).waistBase);
  return b===null?null:r1(b+f.waist);
}
/* Les sept cibles d'un mois, confrontées aux valeurs d'une date.
   dir : -1 si l'on vise en dessous, +1 si l'on vise au-dessus. */
const TGT=[
  {k:"w",   l:"Poids",          u:"kg",dir:-1,dec:1},
  {k:"waist",l:"Tour de taille",u:"cm",dir:-1,dec:1},
  {k:"vol", l:"Volume course",  u:"km",dir:1, dec:1},
  {k:"sleep",l:"Sommeil",       u:"",  dir:1, dec:2},
  {k:"prot",l:"Protéines",      u:"j/7",dir:1,dec:0},
  {k:"vo2", l:"VO2max",         u:"",  dir:1, dec:1}
];
function tgtValue(f,t){return t.k==="waist"?waistTarget(f):f[t.k];}
function fmtTgt(v,t){
  if(v===null)return"—";
  return t.k==="sleep"?fmtDur(v):(t.dec?v.toFixed(t.dec===2?1:t.dec):String(v))+(t.u?" "+t.u:"");
}
function fmtCur(v,t){
  if(v===null)return null;
  return t.k==="sleep"?fmtDur(v):(t.dec?r1(v).toFixed(t.dec===2?1:t.dec):String(v))+(t.u?" "+t.u:"");
}
function tgtOk(cur,tv,t){
  if(cur===null||tv===null)return null;
  return t.dir<0?cur<=tv:cur>=tv;
}
/* Ancienneté du dernier export. null = jamais exporté. Le journal ne
   vit que dans le stockage de ce navigateur : un effacement de données
   de site, un téléphone perdu, et il n'en reste rien. */
function exportAge(){
  const k=(DB.settings||{}).lastExport;
  if(!k||!/^\d{4}-\d{2}-\d{2}$/.test(k))return null;
  return Math.round((parseD(TODAY)-parseD(k))/86400000);
}
function exportTxt(){
  const a=exportAge();
  if(a===null)return"jamais exporté";
  return a<=0?"aujourd'hui":a===1?"hier":"il y a "+a+" jours";
}

/* ================= Régime de la semaine ================= */
/* Le plan importé propose un régime ; la bascule manuelle le remplace.
   Une semaine dérape un mardi, pas le dimanche de la revue — sans ce
   bouton le dispositif à trois régimes ne sert qu'une fois par semaine. */
function regimeOf(mon){
  const ov=(DB.settings.regime||{})[mon];
  if(ov)return ov;
  const w=weekAt(mon);
  return (w&&w.regime)||"normale";
}
function regimeSet(mon){return !!(DB.settings.regime||{})[mon];}
/* Séances retenues, avec leur indice d'origine : les cases cochées sont
   indexées par position dans le plan, masquer une séance ne doit pas
   décaler celles qui restent. */
function kept(d){
  const ss=(d.sessions||[]).map((s,i)=>({s:s,i:i}));
  return regimeOf(mondayOf(d.d))==="chargee"?ss.filter(x=>x.s.rank==="P1"):ss;
}
function cut(d){return (d.sessions||[]).length-kept(d).length;}

/* ================= Séances ================= */
function sessDone(k,i){const d=rd(k).done||{};return!!(d["s"+i]||d["s"+i+"f"]);}
function dayUnits(d){return kept(d).length+(d.fascia?1:0);}
function dayDone(k,d){
  let n=0;kept(d).forEach(x=>{if(sessDone(k,x.i))n++;});
  if(d.fascia&&(rd(k).done||{}).fascia)n++;
  return n;
}
function p1Week(mon){
  const w=weekAt(mon);let done=0,planned=0;
  if(w)(w.days||[]).forEach(d=>(d.sessions||[]).forEach((s,i)=>{
    if(s.rank!=="P1")return;planned++;if(sessDone(d.d,i))done++;}));
  return{done:done,planned:planned};
}
function nextDayHasKey(k){
  const d=dayOf(addDays(k,1));
  return!!(d&&(d.sessions||[]).some(s=>s.rank==="P1"||s.rank==="P2"));
}

/* ================= Rendu : fond et jauges ================= */
function bg(){
  let s="";for(let i=0;i<9;i++){const y=40+i*78;
    s+='<path d="M-20 '+y+' C 90 '+(y-34)+', 200 '+(y+40)+', 320 '+(y-12)+' S 540 '+(y+30)+', 700 '+(y-20)+'" fill="none" stroke="#DCE6EB" stroke-width="1"/>';}
  document.getElementById("bg").innerHTML=s;
}
function gauge(frac,val,sub,lab,col,title){
  const C=2*Math.PI*19,on=C*Math.max(0,Math.min(1,frac||0));
  return'<div class="gauge" title="'+esc(title)+'"><svg class="ring" viewBox="0 0 44 44" aria-hidden="true">'+
    '<circle cx="22" cy="22" r="19" fill="none" style="stroke:var(--edge)" stroke-width="4"/>'+
    (on>0?'<circle cx="22" cy="22" r="19" fill="none" style="stroke:'+col+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+on.toFixed(2)+' '+(C-on).toFixed(2)+'"/>':'')+
    '</svg><div><div class="g-val">'+val+(sub?'<span class="g-sub">'+sub+'</span>':'')+'</div><div class="g-lab">'+lab+'</div></div></div>';
}
const dash='<span class="g-sub">—</span>';

/* Saisie d'un champ : seul l'en-tête est reconstruit. Reconstruire la
   liste détruirait l'input en cours et refermerait le clavier entre
   chaque valeur.
   Reste la pastille 4+, qui porte le nombre réel saisi à côté d'elle.
   Sans ce rafraîchissement ciblé elle restait figée jusqu'au prochain
   rendu complet — c'est-à-dire jamais, pendant une saisie. */
function refreshLive(){renderHeader();refreshBits();}
function refreshBits(){
  const els=document.querySelectorAll("[data-live]");
  for(let i=0;i<els.length;i++){
    const el=els[i],a=el.dataset.live.split("|"),e=rd(a[1]);
    if(a[0]==="al"){
      const v=e.alcohol,big=(typeof v==="number"&&v>=4);
      el.textContent=big?v:"4+";
      el.dataset.on=big?1:0;
    }
  }
}

function renderHeader(){
  const mon=mondayOf(TODAY),f=currentMonth();
  const wk=weekWeight(mon)!==null?weekWeight(mon):lastWeekly(weekWeight);
  const wa=weekWaist(mon)!==null?weekWaist(mon):lastWeekly(weekWaist);
  const vo=weekVo2Max(mon)!==null?weekVo2Max(mon):lastWeekly(weekVo2Max);
  const sl7=avg(vals(lastN(TODAY,7),"sleep"));
  const w0=firstWeekWeight(),wb=num((DB.settings.refs||{}).waistBase),v0=firstVo2();
  const wT=f.w,waT=waistTarget(f),slT=f.sleep,voT=f.vo2;

  document.getElementById("eyebrow").textContent="";

  /* Les quatre jauges visent la cible DU MOIS, pas une échéance
     trimestrielle : c'est l'écart du moment qui se pilote. */
  /* 1 · poids moyen hebdo — origine : première moyenne connue. */
  const wFrac=(wk===null||w0===null||w0<=wT)?0:(w0-wk)/(w0-wT);
  /* 2 · tour de taille — origine : mesure de référence. */
  const wtFrac=(wa===null||wb===null||waT===null||wb<=waT)?0:(wb-wa)/(wb-waT);
  /* 3 · sommeil moyen 7 j — vide à 5 h, plein à la cible du mois. */
  const bFrac=(sl7===null||slT<=SLEEP_LOW)?0:(sl7-SLEEP_LOW)/(slT-SLEEP_LOW);
  /* 4 · VO2max maxi hebdo — origine : premier relevé enregistré. */
  const vFrac=(vo===null||v0===null||v0>=voT)?0:(vo-v0)/(voT-v0);

  const wkN=weekWeight(mon)!==null?weekWeightN(mon):lastWeeklyN();
  const MOISC=MOIS[+f.m.slice(5,7)-1];

  document.getElementById("prog").innerHTML=
    gauge(wFrac,wk===null?dash:wk.toFixed(1),wk===null?"":"/"+wT.toFixed(1),
      wk===null?"1re pesée "+fmt(MEASURE_START).num+"/08":(wkN===2?"poids moy. partiel":"poids moy."),"var(--depth)",
      wk===null?"Première pesée prévue le "+MEASURE_START:"Moyenne hebdomadaire "+wk.toFixed(1)+" kg sur "+wkN+" pesées, cible "+MOISC+" "+wT.toFixed(1))+
    gauge(wtFrac,wa===null?dash:wa.toFixed(1),(wa===null||waT===null)?"":"/"+waT.toFixed(1),
      wa===null?"1re mesure "+fmt(MEASURE_START).num+"/08":"taille moy.","var(--k-swim)",
      wa===null?"Premier tour de taille prévu le "+MEASURE_START
        :(waT===null?"Mesure de référence manquante dans Références"
          :"Moyenne hebdomadaire "+wa.toFixed(1)+" cm, cible "+MOISC+" "+waT.toFixed(1)))+
    gauge(bFrac,sl7===null?dash:fmtDur(sl7),sl7===null?"":"/"+fmtDur(slT),"sommeil moy.","var(--brass)",
      sl7===null?"Aucune durée de sommeil saisie":"Moyenne sur 7 jours "+fmtDur(sl7)+", cible "+MOISC+" "+fmtDur(slT))+
    gauge(vFrac,vo===null?dash:vo.toFixed(1),vo===null?"":"/"+voT,"vo2max hebdo","var(--k-run)",
      vo===null?"Aucun relevé VO2max":"Meilleur relevé de la semaine "+vo.toFixed(1)+", cible "+MOISC+" "+voT);

  const B=[];
  if(stale)B.push(["warn",stale]);
  const ap=activePlan(),cap=capFor(mon),runKm=weekRun(mon),over=cap.cap!==null&&runKm>cap.cap;
  if(ap.expired)B.push(["warn","Plan expiré — faire la revue du dimanche. Semaine par défaut affichée."]);
  if(ap.pending)B.push(["info","Le plan chargé commence le "+fmt(ap.pending).dow+" "+fmt(ap.pending).num+"."]);
  /* Un relèvement du plafond dur ne doit jamais être silencieux : le
     bandeau nomme la valeur en vigueur, pas une constante supposée. */
  if(cap.clamped)B.push(["warn","Plan à "+cap.planned+" km — ramené au plafond dur de "+cap.max+" km."]);
  if(over)B.push(["warn","Cumul course "+runKm+" km — plafond de "+cap.cap+" km dépassé."]);
  const rec=recovery(); if(rec)B.push(["warn",rec.text]);
  const wd=weightDrop(mon); if(wd!==null)B.push(["warn","Moyenne hebdomadaire en baisse de "+wd+" kg sur une semaine — au-delà de 0,7 kg, la perte est trop rapide."]);
  const dw=drinksIn(weekDays(mon));
  if(dw>DRINK_WEEK)B.push(["warn",dw+" verres cette semaine — plafond hebdomadaire de "+DRINK_WEEK+" dépassé."]);
  const ds=dryStreak(); if(ds>=2)B.push(["info",ds+" jours consécutifs sans alcool."]);
  const xa=exportAge();
  if(xa===null&&Object.keys(DB.days).length)B.push(["warn","Aucune sauvegarde : le journal n'existe que dans ce navigateur. Cibles › Exporter les données."]);
  else if(xa!==null&&xa>EXPORT_MAX)B.push(["warn","Dernière sauvegarde "+exportTxt()+" — au-delà de "+EXPORT_MAX+" jours, un effacement coûterait tout ce qui a suivi."]);
  document.getElementById("banners").innerHTML=B.map(b=>'<div class="banner '+b[0]+'">'+esc(b[1])+'</div>').join("");
}

/* --- Onglet Aujourd'hui : la journée en cours, dépliée, puis la revue. --- */

      (vol.length?(c.cap!==null?" · ":"")+vol.join(" · "):"")+'</span><span class="rule"></span></div>';
    /* Un régime sans effet visible n'est qu'un libellé : la bascule dit

    else if(rg==="chargee")html+='<div class="week-note">Seules les P1 tiennent. Une semaine allégée n\'est pas une semaine perdue.</div>';
    html+='<div class="route"><div class="line"></div>';

/* --- Onglet Journal : tous les jours connus, empilés par mois.
   L'horizon s'arrête au dernier jour du plan chargé : au-delà il n'y a
   ni séance ni saisie possible, des cartes vides jusqu'en 2027
   n'apporteraient rien. --- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function logRange(){
  const ks=Object.keys(DB.days).sort(),ap=activePlan(),pd=[];
  ap.weeks.forEach(w=>(w.days||[]).forEach(x=>pd.push(x.d)));
  const all=ks.concat(pd).concat([TODAY]).sort();
  return{from:all[0],to:all[all.length-1]};
}
function viewLog(){
  const R=logRange();
  if(!R.from)return'<p class="empty">Aucun jour enregistré.</p>';
  const months={},order=[];
  for(let k=R.from;k<=R.to;k=addDays(k,1)){
    const mk=k.slice(0,7);
    if(!months[mk]){months[mk]=[];order.push(mk);}
    months[mk].push(k);
  }
  let h="";
  order.forEach(mk=>{
    const ks=months[mk],y=mk.slice(0,4),mi=+mk.slice(5,7)-1;
    let km=0,done=0,tot=0;
    ks.forEach(k=>{const e=DB.days[k];if(e){const r=num(e.runKm);if(r!==null)km+=r;}
      const d=dayOf(k);if(d){tot+=dayUnits(d);done+=dayDone(k,d);}});
    h+='<div class="mo"><span class="mo-name">'+MOIS[mi]+' '+y+'</span>'+
       '<span class="mo-sub">'+(km>0?r1(km)+" km courus":"—")+(tot?" · "+done+"/"+tot:"")+'</span><span class="rule"></span></div>';
    h+='<div class="jbox">';
    ks.forEach(k=>{h+=logRow(k);});
    h+='</div>';
  });
  return h;
}
function logRow(k){
  const e=DB.days[k],d=dayOf(k),f=fmt(k);
  const bits=[];
  if(e){
    if(num(e.runKm)!==null)bits.push(e.runKm+" km");
    OTHER_KM.forEach(o=>{if(num(e[o[0]])!==null)bits.push(e[o[0]]+" "+o[1].toLowerCase().replace("km ",""));});
    if(num(e.weight)!==null)bits.push(e.weight+" kg");
    if(num(e.vo2)!==null)bits.push("vo2 "+e.vo2);
  }
  let lab=bits.join(" · ");
  if(!lab&&d&&(d.sessions||[]).length)lab=(d.sessions||[]).map(s=>s.label).join(" · ");
  if(!lab)lab=e&&e.frozen?"aucune activité":"—";
  let chip="";
  if(d&&dayUnits(d)){const u=dayUnits(d),n=dayDone(k,d);chip='<span class="jm '+(n===u?"full":"")+'">'+n+'/'+u+'</span>';}
  else if(e&&e.frozen)chip='<span class="jm">figé</span>';
  let h='<button class="jrow '+(k===TODAY?"today":"")+(open===k?" on":"")+'" data-open="'+k+'">'+
    '<span class="jd">'+f.dow+' <b>'+f.num+'</b></span><span class="js">'+esc(lab)+'</span>'+chip+'</button>';
  /* Le journal déplie sur place, y compris les jours hors plan : ils
     n'existent nulle part ailleurs, un tapotement sans effet était une
     impasse. */
  if(open===k)h+=(e&&e.frozen)?frozenDetail(k,"jdet"):dayDetail(d||{d:k,fascia:false,sessions:[]},"jdet");
  return h;
}

function dayCard(d,w){
  const k=d.d,u=dayUnits(d),dn=dayDone(k,d),f=fmt(k);
  const isT=k===TODAY,isO=open===k,full=u>0&&dn===u;
  const parts=kept(d).map(x=>x.s.label);
  if(d.fascia)parts.push("fascia");
  const sum=parts.length?parts.join(" · "):"repos";
  let h='<div class="day"><span class="node '+(isT?"now":full?"done":"")+'"></span><div class="card '+(isT?"now":"")+'">'+
    '<button class="card-head" data-open="'+k+'"><div class="card-top"><span class="date">'+f.dow+' <b>'+f.num+'</b></span>'+
    '<span class="sum">'+esc(sum)+'</span>'+(u?'<span class="count '+(full?"full":"")+'">'+dn+'/'+u+'</span>':'')+'</div></button>';
  if(!isO)return h+'</div></div>';
  return h+dayDetail(d)+'</div></div>';
}
/* Corps déplié d'une journée : séances puis saisie. Isolé du bandeau
   pour que le journal puisse déplier un jour sur place, sans la
   chronologie du plan autour. */
function dayDetail(d,extra){
  const k=d.d,e=rd(k);
  let h='<div class="detail '+(extra||"")+'">';
  /* Le 30/08 est la bascule : premières mesures et première revue. */
  if(k===MEASURE_START)h+='<div class="pivot">Mesures de référence + première revue dominicale</div>';
  /* La règle de récupération lit les valeurs du jour même : elle ne
     requalifie que la séance qualité d'aujourd'hui, pas celles à venir.
     C'est le type qui porte l'intensité, pas le rang : une P2 de salle
     n'est pas la séance dure, et la convertir laissait le fractionné
     intact — l'inverse exact de ce que le bandeau annonce. */
  const conv=(k===TODAY)&&recovery();
  kept(d).forEach(x=>{
    const s=x.s,i=x.i;
    const on=!!e.done["s"+i],onF=!!e.done["s"+i+"f"],altOpen=e.done["alt"+i];
    const kd=KIND[s.kind]||{t:String(s.kind||"SÉANCE").toUpperCase(),c:"var(--fog)"};
    const converted=conv&&s.kind==="qualite";
    h+='<div class="sess"><div class="sess-head">'+
      '<button class="box" data-t="'+k+'|s'+i+'" data-on="'+(on?1:0)+'">'+(on?chk(15):"")+'</button>'+
      '<div style="flex:1;min-width:0"><div class="tags"><span class="rank '+(s.rank==="P1"?"p1":"")+'">'+esc(s.rank||"P3")+'</span>'+
      '<span class="tag" style="color:'+kd.c+'">'+esc(kd.t)+'</span></div>'+
      '<div class="sess-lab '+((on||onF)?"off":"")+'">'+esc(s.label||"")+'</div>'+
      (s.detail?'<div class="cue">'+esc(s.detail)+'</div>':"")+
      (converted?'<div class="conv">convertie en facile — récupération</div>':"")+
      (s.fallback?'<button class="alt" data-alt="'+k+'|'+i+'">'+(altOpen?"Masquer":"Version dégradée")+'</button>':"")+
      (s.fallback&&altOpen?'<div class="fallback"><button class="box sm" data-t="'+k+'|s'+i+'f" data-on="'+(onF?1:0)+'">'+(onF?chk(13):"")+'</button><div class="fb-t">'+esc(s.fallback)+'</div></div>':"")+
      '</div></div></div>';
  });
  if(d.fascia){
    const fo=!!e.done.fascia;
    h+='<div class="sess"><div class="sess-head"><button class="box" data-t="'+k+'|fascia" data-on="'+(fo?1:0)+'">'+(fo?chk(15):"")+'</button>'+
      '<div style="flex:1;min-width:0"><div class="tags"><span class="rank">FASCIA</span></div>'+
      '<div class="sess-lab '+(fo?"off":"")+'">Bloc fascia</div><div class="cue">'+esc(FASCIA)+'</div></div></div></div>';
  }
  const nCut=cut(d);
  if(nCut)h+='<p class="empty">'+nCut+' séance'+(nCut>1?"s":"")+' écartée'+(nCut>1?"s":"")+' — semaine chargée, seules les P1 tiennent.</p>';
  if(!kept(d).length&&!d.fascia&&!nCut)h+='<p class="empty">Rien de prévu. Une séance manquée ne se rattrape pas.</p>';

  /* --- saisie quotidienne (§8) --- */
  const wkAvg=weekWeight(mondayOf(k)),dayW=num(e.weight);
  const gap=(wkAvg!==null&&dayW!==null&&Math.abs(dayW-wkAvg)>1);
  h+='<div class="log">';
  /* Sommeil en tête : c'est la première chose regardée le matin, et la
     seule qui se saisisse avant tout le reste. */
  h+='<div class="log-row"><span class="log-lab">Sommeil<span class="hint">Cible '+fmtDur(SLEEP_H)+', 5 nuits sur 7.</span></span>'+
     '<input type="time" value="'+esc(hmOf(e.sleep))+'" data-hm="'+k+'|sleep"><span class="unit"></span></div>';
  /* Poids et tour de taille n'apparaissent qu'à partir de la première
     pesée : un champ masqué n'est pas un champ vide à reprocher. */
  if(k>=MEASURE_START)h+=numRow(k,"weight","Poids",gap?"Variation quotidienne — la moyenne fait foi.":"","kg","0.1");
  h+=numRow(k,"runKm","Km courus","Seul volume soumis au plafond hebdomadaire.","km","0.1");
  OTHER_KM.forEach(o=>{if(o[0]!=="kayakKm")h+=numRow(k,o[0],o[1],"",o[2],"0.1");});
  h+=numRow(k,"vo2","VO2max relevée","","ml","0.1");
  h+='<div class="log-row"><span class="log-lab">Heure de coucher<span class="hint">Cible avant '+fmtMin(BED_LIMIT)+'.</span></span>'+
     '<input type="time" value="'+esc(e.bedTime||"")+'" data-f="'+k+'|bedTime"><span class="unit"></span></div>';
  /* Protéines : quatre prises, chacune ses grammes. Le manque devient
     lisible et localisé — il manque la collation, pas « la journée est
     ratée ». Les grammes sont des ordres de grandeur, d'où le ≈. */
  const ps=protSet(e),pg=protG(e);
  h+='<div class="log-row col"><span class="log-lab">Protéines<span class="hint'+(pg>=PROTEIN?"":" warn")+'">≈ '+pg+' g sur '+PROTEIN+'.</span></span><div class="pills">';
  PROT_SLOTS.forEach(s=>{h+='<button class="pill'+(s[3]?" key":"")+'" data-pr="'+k+'|'+s[0]+'" data-on="'+(ps[s[0]]?1:0)+'">'+esc(s[1])+' <span class="pg">'+s[2]+'</span></button>';});
  h+='</div></div>';
  /* Alcool : la pastille 4+ enregistrait 4. Sur deux à trois dîners
     d'affaires par semaine contre une cible à 5 verres, c'est le seul
     chiffre qui compte qu'on sous-estimait. Elle ouvre maintenant un
     champ libre, et affiche la valeur réelle dès qu'elle dépasse 4. */
  const al=e.alcohol,alBig=(typeof al==="number"&&al>=4);
  h+='<div class="log-row"><span class="log-lab">Verres d\'alcool'+(nextDayHasKey(k)&&typeof al==="number"&&al>0?'<span class="hint warn">Séance P1 ou P2 demain.</span>':'')+'</span><div class="pills">';
  [0,1,2,3].forEach(n=>{h+='<button class="pill" data-a="'+k+'|'+n+'" data-on="'+(al===n?1:0)+'" data-over="'+(n>=3?1:0)+'">'+n+'</button>';});
  h+='<button class="pill" data-a="'+k+'|4" data-live="al|'+k+'" data-on="'+(alBig?1:0)+'" data-over="1">'+(alBig?al:"4+")+'</button>';
  if(alBig)h+='<input class="alx" type="number" min="4" step="1" inputmode="numeric" value="'+al+'" data-n="'+k+'|alcohol">';
  h+='</div></div>';
  /* FC repos et VFC après l'alcool : ce sont des relevés de montre, pas
     des décisions de la journée. */
  h+=numRow(k,"rhr","FC repos","","bpm","1");
  h+=numRow(k,"hrv","VFC (SDNN)","","ms","1");
  if(k>=MEASURE_START)h+='<div class="log-row"><span class="log-lab">Tour de taille<span class="hint">Ruban à mi-distance côte basse / crête iliaque.</span></span>'+
     '<input type="number" step="0.5" inputmode="decimal" placeholder="—" value="'+esc(e.waist||"")+'" data-f="'+k+'|waist"><span class="unit">cm</span></div>';
  h+='</div></div>';   /* .log puis .detail */
  return h;
}

/* ================= Panneau Cibles (§7.2) ================= */
/* st(v,ok) : ✓ atteint · → échéance à venir · ✗ échéance passée et non
   atteinte · — donnée manquante (la ligne est alors une estimation). */
function st(ok,mileD){
  if(ok===null)return'<span class="t-st dim">—</span>';
  if(ok)return'<span class="t-st ok">✓</span>';
  return TODAY>mileD?'<span class="t-st warn">✗</span>':'<span class="t-st dim">→</span>';
}
/* Les valeurs sont recalculées ici : le panneau est rendu à la demande,
   quand on ouvre son onglet, et non plus dans la foulée de l'en-tête. */
/* Fenêtre du tableau mensuel : mois en cours −1 à +3. Treize colonnes ne
   tiennent pas sur un téléphone, et les mois lointains ne se pilotent
   pas. Le bouton « Tous les mois » lève la fenêtre. */
let allMonths=false;
function monthWindow(){
  if(allMonths)return MONTHS;
  const c=MOISKEY(TODAY);
  let i=MONTHS.findIndex(x=>x.m===c);
  if(i<0)i=TODAY<MONTHS[0].m?0:MONTHS.length-1;
  return MONTHS.slice(Math.max(0,i-1),i+4);
}
function moisLab(m){return MOIS[+m.slice(5,7)-1].slice(0,4)+" "+m.slice(2,4);}
/* Prochain test à venir, et dernier test passé avec son résultat. */
function testAt(){
  const done=DB.settings.tests||{};
  let next=null,last=null,late=null;
  TESTS.forEach(t=>{
    const r=done[t.d];
    if(t.d>=TODAY){if(!next)next=t;return;}
    if(parseMMSS(r)!==null)last={t:t,r:r};
    else if(!late)late=t;
  });
  return{next:next,last:last,late:late};
}

  h+='<div class="meta">Cible du mois — '+esc(MOIS[+f.m.slice(5,7)-1])+' '+f.m.slice(0,4)+'</div>';
  h+='<div class="mtgt">';
  TGT.forEach(t=>{

    let gap="";

         ' · cible '+esc(fmtTgt(tv,t))+
         (gap?' · <span class="mgap '+(ok===false?"warn":ok?"ok":"dim")+'">'+esc(gap)+'</span>':'')+
       '</span></div>';
  });
  /* Chrono : pas de valeur mensuelle, des tests datés. */
  const T=testAt();
  h+='<div class="mrow"><span class="mlab">Chrono</span>'+
     (T.late?'<span class="t-st warn">✗</span>':'<span class="t-st dim">→</span>')+
     '<span class="mline">'+
       (T.last?'<b>'+esc(T.last.t.dist+" "+T.last.r)+'</b> le '+esc(dm(T.last.t.d)):'<span class="dim">aucun test enregistré</span>')+
       (T.next?' · prochain '+esc(T.next.dist+" le "+dm(T.next.d)+(T.next.cible?", cible "+T.next.cible:"")):'')+
     '</span></div>';
  h+='</div>';
  if(T.late)h+='<p class="todo">Test du <b>'+esc(dm(T.late.d))+'</b> ('+esc(T.late.dist)+') passé sans résultat saisi. Panneau Références.</p>';
  h+='<p class="pace">Allure d\'endurance de référence : <b>'+esc(paceAt(TODAY))+'</b>. Indication, jamais évaluée.</p>';

  /* --- B · le tableau mensuel --- */
  const win=monthWindow(),cm=MOISKEY(TODAY);
  h+='<div class="meta" style="margin-top:26px">Trajectoire mensuelle</div>';
  h+='<div class="scroll"><table class="tgt"><tr><th></th>'+
     win.map(x=>'<th class="'+(x.m===cm?"now ":"")+(x.base?"base":"")+'">'+esc(moisLab(x.m))+'</th>').join("")+'</tr>';
  TGT.forEach(t=>{
    h+='<tr><td><div class="t-lab">'+esc(t.l)+'</div><span class="t-cur">'+
       (fmtCur(cur[t.k],t)===null?"estimation":esc(fmtCur(cur[t.k],t)))+'</span></td>';
    win.forEach(x=>{
      const tv=tgtValue(x,t),end=monthEnd(x.m);
      /* Un mois écoulé se juge sur ce qu'il affichait à sa fin ; le mois
         en cours sur aujourd'hui ; un mois à venir ne se juge pas. */
      let ok=null;
      if(!x.base&&monthStart(x.m)<=TODAY){
        const at=end<TODAY?end:TODAY;
        ok=tgtOk(snapAt(at)[t.k],tv,t);
      }
      h+='<td class="t-cell'+(x.m===cm?" now":"")+(x.base?" base":"")+'">'+
         (x.base?'<span class="dim">'+esc(fmtTgt(tv,t))+'</span>':st(ok,end)+esc(fmtTgt(tv,t)))+'</td>';

  h+='<button class="tool" id="allm">'+(allMonths?"Fenêtre courante":"Tous les mois")+'</button>';

  h+='<div class="graph">'+volumeChart()+'</div>';
  h+='<div class="graph">'+seriesChart("VO2max relevée (ml/kg/min)",vo2Series(),[{v:f.vo2,txt:f.vo2+" · cible du mois"}],1)+'</div>';
  h+='<p class="foot">Une semaine allégée n\'est pas une semaine perdue. Une séance manquée ne se rattrape pas.</p>';
  document.getElementById("targets").innerHTML=h;

function lastVal(f){
  const ks=Object.keys(DB.days).sort();
  for(let i=ks.length-1;i>=0;i--){const v=num(DB.days[ks[i]][f]);if(v!==null)return v;}
  return null;
}
/* Une date venue des réglages peut arriver de n'importe où — champ vide,
   base importée, saisie d'un autre navigateur. La formater sans vérifier
   donnait « NaN/ne ». */
function isDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(String(k||""));}
/* jj/mm — les dates d'un tableau tiennent en six caractères. */
function dm(k){return isDate(k)?fmt(k).num+"/"+k.slice(5,7):"—";}
/* Chrono mm:ss en secondes. null si le format n'est pas respecté : une
   valeur en texte libre n'était comparée à rien. */
function parseMMSS(s){
  const t=String(s||"").trim();
  /* Une seule heure : un chrono de course ne dépasse pas 9 h, et
     « 26:30:00 » est une faute de frappe sur un 5 km, pas 26 h 30. */
  let m=/^([0-9]):([0-5]\d):([0-5]\d)$/.exec(t);
  if(m)return (+m[1])*3600+(+m[2])*60+(+m[3]);
  m=/^(\d{1,3}):([0-5]\d)$/.exec(t);
  return m?(+m[1])*60+(+m[2]):null;
}
function weekList(n){
  const a=[],m=mondayOf(TODAY);
  for(let i=n-1;i>=0;i--)a.push(addDays(m,-7*i));
  return a;
}
/* Première moyenne hebdomadaire enregistrée, origine de la jauge poids. */
function firstWeekWeight(){
  const ms=Object.keys(DB.days).sort().map(mondayOf);
  const seen={};
  for(const m of ms){if(seen[m])continue;seen[m]=1;const v=weekWeight(m);if(v!==null)return v;}
  return null;
}
/* Tant qu'aucune moyenne n'existe, le graphe n'affiche que les jalons :
   aucune valeur de poids n'a été mesurée, il n'y a rien à tracer. */
function weightChart(){
  /* partiel : moyenne assise sur deux pesées, tracée en point creux. */
  const keep=weekList(12).filter(m=>weekWeight(m)!==null);
  const pts=keep.map(m=>({lab:fmt(m).num,v:weekWeight(m),hollow:weekWeightN(m)===2}));
  /* La cible du mois de chaque semaine, pour lire l'écart à la trajectoire. */
  const goal=keep.map(m=>{const x=monthAt(MOISKEY(m));return x?x.w:currentMonth().w;});
  if(!pts.length){
    const refs=MONTHS.filter((x,i)=>i%3===0).map(x=>({v:x.w,txt:x.w.toFixed(1)+" · "+moisLab(x.m)}));
    return'<div class="meta">Poids — moyenne hebdomadaire (kg)</div>'+refsOnly(refs)+
      '<p class="empty">Première pesée le '+MEASURE_START+'. La trajectoire mensuelle est tracée, rien d\'autre n\'est mesuré.</p>';
  }
  return seriesChart("Poids — réel (plein) et cible mensuelle (pointillé)",pts,[],1,goal);
}
function refsOnly(refs){
  const W=600,H=110;
  let lo=Math.min.apply(null,refs.map(r=>r.v)),hi=Math.max.apply(null,refs.map(r=>r.v));
  const pad=(hi-lo)*0.35||2; lo-=pad; hi+=pad;
  const y=v=>18+((hi-v)/(hi-lo))*(H-40);
  let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  refs.forEach(r=>{
    s+='<line x1="26" y1="'+y(r.v)+'" x2="'+(W-20)+'" y2="'+y(r.v)+'" class="gl-ref" stroke-dasharray="4 5"/>'+
       '<text x="'+(W-20)+'" y="'+(y(r.v)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">'+esc(r.txt)+'</text>';
  });
  return s+'</svg>';
}
/* Série FC repos : moyennes hebdomadaires figées, puis moyennes mobiles
   7 jours dès qu'il y a des saisies quotidiennes. */
function rhrSeries(){

function volumeChart(){
  const pts=weekList(10).map(m=>({lab:fmt(m).num,v:weekRun(m)}));
  const f=currentMonth();
  /* La référence est la cible de volume du mois, pas une moyenne de
     plafonds : c'est elle qu'on vise. La médiane et le plafond dur en
     vigueur restent dans le titre, où ils ne disputent pas la lecture. */
  return seriesChart("Volume hebdo (km) — médiane 4 sem. "+runMedian4(mondayOf(TODAY))+" · plafond dur "+runAbsMax(),
    pts.filter(p=>p.v>0),[{v:f.vol,txt:f.vol+" · cible "+moisLab(f.m)}],1);
}
function seriesChart(title,pts,refs,dec,goal){
  if(!pts.length)return'<div class="meta">'+esc(title)+'</div><p class="empty">Aucune donnée saisie.</p>';
  const W=600,H=150;
  let lo=Math.min.apply(null,pts.map(p=>p.v)),hi=Math.max.apply(null,pts.map(p=>p.v));
  refs.forEach(r=>{lo=Math.min(lo,r.v);hi=Math.max(hi,r.v);});
  /* Les deux courbes partagent l'échelle, sinon l'écart ne se voit pas. */
  if(goal)goal.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);});
  if(hi-lo<1){hi+=1;lo-=1;}
  const padV=(hi-lo)*0.15;lo-=padV;hi+=padV;
  const y=v=>18+((hi-v)/(hi-lo))*(H-48);
  const X=i=>34+(i*(W-70))/Math.max(pts.length-1,1);
  let s='<div class="meta">'+esc(title)+'</div><svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  refs.forEach(r=>{
    s+='<line x1="26" y1="'+y(r.v)+'" x2="'+(W-20)+'" y2="'+y(r.v)+'" class="gl-ref" stroke-dasharray="4 5"/>';
    s+='<text x="'+(W-20)+'" y="'+(y(r.v)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">'+esc(r.txt)+'</text>';
  });
  /* Courbe de cible en pointillé, sous la courbe réelle : c'est l'écart
     à la trajectoire qui se lit, pas la trajectoire seule. */
  if(goal&&goal.length===pts.length)
    s+='<polyline points="'+goal.map((v,i)=>X(i)+","+y(v)).join(" ")+'" fill="none" class="g-goal" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s+='<polyline points="'+pts.map((p,i)=>X(i)+","+y(p.v)).join(" ")+'" fill="none" class="g-line" stroke-width="1.8"/>';
  /* Point creux : moyenne partielle, tracée mais distinguée. */
  pts.forEach((p,i)=>{s+='<circle cx="'+X(i)+'" cy="'+y(p.v)+'" r="3.4" class="g-dot'+(p.hollow?" hollow":"")+'"/><text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+esc(p.lab)+'</text>';});
  s+='</svg><div class="meta" style="margin-top:2px">Dernier point '+pts[pts.length-1].v.toFixed(dec)+'</div>';
  return s;
}

/* ================= Export / import ================= */
function contextBlock(){
  const mon=mondayOf(TODAY),c=capFor(mon),sl=sleepCounts(lastN(TODAY,7));
  const r7=avg(vals(lastN(TODAY,7),"rhr")),h7=avg(vals(lastN(TODAY,7),"hrv"));
  const p1=p1Week(mon),wk=weekWeight(mon),wp=weekWeight(addDays(mon,-7));
  return{
    rhr7:r7===null?null:r1(r7),
    hrv7:h7===null?null:r1(h7),
    weightWeek:wk===null?null:r1(wk),
    weightPrevWeek:wp===null?null:r1(wp),
    runKmWeek:weekRun(mon),
    runCapWeek:c.cap,
    sleepNights7h:sl.n7,
    bedBefore2330:sl.bed,
    drinksWeek:drinksIn(weekDays(mon)),
    p1Done:p1.done,p1Planned:p1.planned,
    /* Matière brute de la progression, sans règle qui en soit tirée :
       l'app ne calcule plus le plafond, c'est la session coach qui
       décide. impactWeeks agrège course + randonnée, parce que la
       randonnée se substitue à la course et que la compter zéro fausse
       la lecture de la charge. */
    runWeeks4:lastFullWeeks(4).map(m=>({week:m,km:r1(total(vals(weekDays(m),"runKm")))})),
    impactWeeks4:lastFullWeeks(4).map(m=>({week:m,km:r1(total(vals(weekDays(m),"runKm"))+total(vals(weekDays(m),"hikeKm")))})),
    regimeWeek:regimeOf(mon),regimeManual:regimeSet(mon),
    proteinDays7:protDays(7),proteinAvgG7:protAvgG(7),
    lastExport:(DB.settings||{}).lastExport||null,exportAgeDays:exportAge(),
    /* Ce qui se lit en premier à la revue : où l'on en est du mois. */
    monthTarget:(()=>{
      const f=currentMonth(),cur=snapAt(TODAY),o={month:f.m,baseline:!!f.base,lines:{}};
      TGT.forEach(t=>{
        const tv=tgtValue(f,t),cv=cur[t.k];
        o.lines[t.k]={target:tv,current:cv===null?null:r1(cv),
          gap:(cv===null||tv===null)?null:r1(cv-tv),
          ok:f.base?null:tgtOk(cv,tv,t)};
      });
      const T=testAt();
      o.nextTest=T.next?{date:T.next.d,dist:T.next.dist,target:T.next.cible}:null;
      o.lastTest=T.last?{date:T.last.t.d,dist:T.last.t.dist,result:T.last.r}:null;
      o.testOverdue=T.late?T.late.d:null;
      o.pace=paceAt(TODAY);
      return o;
    })()
  };
}

function lastFullWeeks(n){
  const a=[],mon=mondayOf(TODAY);
  for(let i=n;i>=1;i--)a.push(addDays(mon,-7*i));
  return a;
}

  return JSON.stringify({app:APP,version:VERSION,exported:TODAY,from:start,to:TODAY,

/* onDone n'est appelé que si quelque chose est réellement sorti : le
   presse-papiers a accepté, ou la boîte de repli a été validée. Dater la
   sauvegarde avant de le savoir affichait « sauvegardé aujourd'hui »
   quand l'utilisateur venait d'annuler. */
function copyOut(s,msg,onDone){
  const fallback=()=>{if(prompt("Copie ce texte :",s)!==null&&onDone)onDone();};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(s).then(()=>{alert(msg);if(onDone)onDone();},fallback);
  else fallback();
}
/* Rattrapage : le plan importé peut porter un bloc `backfill`, des
   mesures par date relevées dans Santé au moment de la revue. Elles ne
   s'appliquent qu'aux jours passés et seulement là où le champ est vide,
   donc une saisie manuelle n'est jamais écrasée. Les champs déclaratifs
   — protéines, alcool, coucher, talon — en sont exclus : ils ne se
   lisent nulle part et personne d'autre que toi ne peut les affirmer. */
const BACKFILL_FIELDS=["runKm","hikeKm","swimKm","bikeKm","vo2","rhr","hrv","sleep","weight","waist","bedTime","sys","dia"];
function applyBackfill(bf){
  let n=0,days=0;
  Object.keys(bf||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>TODAY)return;
    const src=bf[k]; if(!src||typeof src!=="object")return;
    /* La journée n'est créée qu'au premier champ réellement rempli :
       un rattrapage sans rien à dire ne doit pas ajouter de jour vide. */
    let e=DB.days[k]||null,touched=0;
    BACKFILL_FIELDS.forEach(f=>{
      if(!(f in src))return;
      /* Poids et taille n'existent pas avant la première pesée : les
         remplir avant alimenterait une jauge avec une valeur que l'app
         n'affiche pas et qu'on ne pourrait pas corriger. */
      if((f==="weight"||f==="waist")&&k<MEASURE_START)return;
      const cur=e?e[f]:"";
      if(cur!==""&&cur!==null&&cur!==undefined)return;
      const v=src[f];
      if(v===null||v===undefined||v==="")return;
      if(!e)e=entry(k);
      e[f]=String(v);n++;touched=1;
    });
    if(touched)days++;
  });
  return{n:n,days:days};
}
function importPlan(txt){
  let p;try{p=JSON.parse(txt);}catch(e){return{err:"Plan non reconnu"};}
  if(!p||typeof p!=="object"||!Array.isArray(p.weeks)||!p.weeks.length)return{err:"Plan non reconnu"};
  const dre=/^\d{4}-\d{2}-\d{2}$/;
  for(const w of p.weeks){
    if(!w||typeof w.start!=="string"||!dre.test(w.start)||!Array.isArray(w.days))return{err:"Plan non reconnu"};
    for(const d of w.days){
      if(!d||typeof d.d!=="string"||!dre.test(d.d))return{err:"Plan non reconnu"};
      if(d.sessions!==undefined&&!Array.isArray(d.sessions))return{err:"Plan non reconnu"};
      for(const s of (d.sessions||[]))if(!s||typeof s.label!=="string")return{err:"Plan non reconnu"};
    }
  }
  if(p.backfill!==undefined){
    if(!p.backfill||typeof p.backfill!=="object"||Array.isArray(p.backfill))return{err:"Plan non reconnu"};
    for(const k in p.backfill){
      const o=p.backfill[k];
      if(!dre.test(k)||!o||typeof o!=="object"||Array.isArray(o))return{err:"Plan non reconnu"};
    }
  }
  DB.plan=p;
  /* Un plan neuf reprend la main sur les bascules manuelles : elles
     visaient les semaines qu'il remplace. */
  (p.weeks||[]).forEach(w=>{if(DB.settings.regime)delete DB.settings.regime[w.start];});
  const bf=applyBackfill(p.backfill);
  save();open=null;render();
  return{filled:bf.n,days:bf.days};
}

    '<button class="big sec" id="impPlan">Importer un plan</button>'+
    '<div class="tools"><button class="tool" id="exp">Exporter les données</button><button class="tool" id="imp">Importer les données</button></div>'+
    '<div class="backup'+((exportAge()===null||exportAge()>EXPORT_MAX)?" warn":"")+'">Dernière sauvegarde : '+exportTxt()+
      ' · '+Object.keys(DB.days).length+' journée'+(Object.keys(DB.days).length>1?"s":"")+' en base</div>'+

/* ================= Interactions ================= */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-tab],[data-open],[data-t],[data-b],[data-pr],[data-a],[data-alt],[data-reg],#exp,#imp,#impPlan,#rev,#allm");
  if(!t)return;
  if(t.id==="allm"){allMonths=!allMonths;renderTargets();return;}
  if(t.id==="rev"){copyOut(reviewJSON(),"Revue copiée. Colle-la dans la session coach.");return;}
  if(t.id==="exp"){
    /* L'export est la seule sauvegarde : on date celui-ci pour pouvoir
       dire depuis quand le journal ne tient plus qu'à cet appareil. */
    copyOut(JSON.stringify(DB),"Données copiées. Colle-les dans une note ou un mail — c'est ta seule sauvegarde.",
      ()=>{DB.settings.lastExport=TODAY;save();render();});
    return;}
  if(t.id==="imp"){
    const s=prompt("Colle ici les données exportées :");
    if(s){try{const p=JSON.parse(s);if(!p||typeof p!=="object"||Array.isArray(p))throw 0;
      /* normalize() complète la base importée sans relire le disque :
         repasser par load() rechargerait l'ancienne et perdrait l'import. */
      DB=p;normalize();save();render();}catch(e){alert("Format non reconnu.");}}
    return;}
  if(t.id==="impPlan"){
    const s=prompt("Colle ici le plan de 2 semaines :");
    if(s){const r=importPlan(s);
      alert(r.err||("Plan importé."+(r.filled?"\n"+r.filled+" valeur"+(r.filled>1?"s":"")+" complétée"+(r.filled>1?"s":"")+" sur "+r.days+" jour"+(r.days>1?"s":"")+".":"")));}
    return;}
  if(t.dataset.tab!==undefined){tab=t.dataset.tab;ses("set",tab,TKEY);render();scrollTo(0,0);return;}
  if(t.dataset.open!==undefined){
    const k=t.dataset.open,was=open===k;
    open=was?null:k;render();
    /* Le journal est long : rouvrir en gardant la ligne sous les yeux. */
    if(!was&&tab==="log"){const r=document.querySelector('.jrow[data-open="'+k+'"]');
      if(r)r.scrollIntoView({block:"nearest"});}
    return;}
  if(t.dataset.alt!==undefined){const a=t.dataset.alt.split("|"),e=entry(a[0]);e.done["alt"+a[1]]=!e.done["alt"+a[1]];save();render();return;}
  if(t.dataset.t){const a=t.dataset.t.split("|"),e=entry(a[0]);e.done[a[1]]=!e.done[a[1]];save();render();return;}
  if(t.dataset.b){const e=entry(t.dataset.b);e.bed=!e.bed;save();render();return;}
  if(t.dataset.pr){const a=t.dataset.pr.split("|"),e=entry(a[0]);
    /* Première coche sur une journée d'avant : la case unique est
       convertie en ses quatre prises, puis c'est prot qui fait foi. */
    if(!e.prot||typeof e.prot!=="object")e.prot=protSet(e);
    e.prot[a[1]]=!e.prot[a[1]];save();render();return;}
  if(t.dataset.reg!==undefined){
    const m=t.dataset.reg,ord=["normale","chargee","vacances"];
    const nx=ord[(ord.indexOf(regimeOf(m))+1)%3];
    if(!DB.settings.regime)DB.settings.regime={};
    DB.settings.regime[m]=nx;save();render();return;}
  if(t.dataset.a){const a=t.dataset.a.split("|"),e=entry(a[0]),n=Number(a[1]);
    /* La pastille 4+ n'enregistre plus 4 : elle ouvre le champ libre,
       qui reçoit le focus. Un second clic dessus efface la valeur. */
    const isBig=(n===4),cur=e.alcohol;
    if(isBig&&typeof cur==="number"&&cur>=4)e.alcohol="";
    else e.alcohol=(!isBig&&cur===n)?"":n;
    save();render();
    if(isBig&&typeof e.alcohol==="number"){
      const f=document.querySelector('.alx[data-n="'+a[0]+'|alcohol"]');
      if(f){f.focus();f.select();}
    }
    return;}
});
document.addEventListener("change",ev=>{
  const f=ev.target.dataset.f,s=ev.target.dataset.s,n=ev.target.dataset.n,hm=ev.target.dataset.hm;
  if(f){const a=f.split("|");entry(a[0])[a[1]]=ev.target.value;save();refreshLive();return;}
  /* Champ numérique dont le type compte : drinksIn() n'additionne que les
     nombres, une chaîne sortirait la journée du comptage. */
  if(n){const a=n.split("|"),v=num(ev.target.value);
    entry(a[0])[a[1]]=(v===null||v<0)?"":v;save();refreshLive();return;}
  /* Durée saisie en h:mm, rangée en heures décimales. */
  if(hm){const a=hm.split("|");entry(a[0])[a[1]]=hmTo(ev.target.value);save();refreshLive();return;}
  if(s){const a=s.split("|");DB.settings[a[0]][a[1]]=ev.target.value;save();refreshLive();return;}
  /* Résultat d'un test chronométré, rangé par date de test. */
  if(ev.target.dataset.tst){
    if(!DB.settings.tests)DB.settings.tests={};
    DB.settings.tests[ev.target.dataset.tst]=ev.target.value;
    save();renderTargets();renderRefs();}
});
