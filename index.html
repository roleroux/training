/* Une séance en une ligne : ce que la montre a vu, sans interprétation. */
function seanceTxt(x){
  const b=[];
  if(x.km)b.push(x.km+" km");
  if(x.dureeSec)b.push(fmtHMS(x.dureeSec));
  if(x.allure)b.push(x.allure+"/km");
  if(x.denivele)b.push(x.denivele+" m D+");
  if(x.fcMoy)b.push("FC "+x.fcMoy);
  if(x.kcal)b.push(x.kcal+" kcal");
  if(x.pctHorsZoneHaut!==null&&x.pctHorsZoneHaut!==undefined)b.push(x.pctHorsZoneHaut+" % hors zone");
  return (KINDLAB[x.kind]||x.kind)+" · "+(b.length?b.join(" · "):"durée inconnue");
}
const KINDLAB={course:"Course",vtt:"Vélo",salle:"Salle",rando:"Randonnée",marche:"Marche",natation:"Natation",autre:"Autre"};
/* 1 h 09:44 plutôt que 69,73 min : une durée de séance se lit ainsi. */
function fmtHMS(sec){
  const H=Math.floor(sec/3600),M=Math.floor(sec%3600/60),S=Math.round(sec%60);
  return (H?H+" h "+pad(M):M+" min ")+(H?":"+pad(S):pad(S)+" s");
}

/* Enchaînement des deux appels. L'appel A est persisté avant que l'appel
   B parte : sur iOS, passer en arrière-plan suspend la requête en cours,
   et un plan perdu ne doit pas emporter l'analyse avec lui. */
async function lancerRevue(){
  if(revBusy)return;
  revBusy=true;revErr="";revPct=0;planPropose=null;
  revEtape="Analyse de la semaine…";chronoDebut();render();
  let revue;
  try{
    revue=await appelA(surEssai);
  }catch(e){
    chronoFin();revBusy=false;revErr=(e&&e.message)||String(e);render();return;
  }
  revEssai="";
  /* L'analyse est en base et à l'écran ; le plan peut échouer sans elle. */
  revEtape="Analyse prête. Plan des 14 jours…";revPct=8;render();
  const suivre=n=>{
    /* Aucune longueur totale connue : la barre dit que ça avance, pas où
       ça en est. Prétendre un pourcentage exact serait faux. */
    revPct=Math.min(95,8+Math.round(n/220));
    const b=document.querySelector(".bar-in");
    if(b)b.style.width=revPct+"%";
  };
  const ctx=contexteGardes(revue);
  let plan=null;
  try{
    plan=await appelB(revue,suivre,null,surEssai);
  }catch(e){
    chronoFin();revBusy=false;revErr="Analyse enregistrée, plan non produit : "+((e&&e.message)||e)+
      " — « Générer le plan seul » le rejoue sans refaire l'analyse.";render();return;
  }
  /* Le modèle propose, le code vérifie. Une seule relance : au-delà, on
     s'acharne sur un modèle qui n'a pas compris, et le plan de repli est
     meilleur qu'un troisième essai. */
  let V=verifierPlan(plan,ctx);
  if(rejets(V).length){
    revEtape="Plan refusé sur "+rejets(V).length+" règle(s). Relance…";revPct=8;render();
    try{
      revEssai="";
      const plan2=await appelB(revue,suivre,rejets(V),surEssai);
      const V2=verifierPlan(plan2,ctx);
      /* La seconde sortie est retenue même si elle viole encore : elle est
         au pire aussi mauvaise, et le bandeau nommera les écarts. */
      plan=plan2;V=V2;
    }catch(e){
      /* Relance impossible : on garde la première sortie corrigée, avec
         ses écarts affichés. Elle vaut mieux que rien. */
      V.push(viol("relance","Relance impossible : "+((e&&e.message)||e),"correction"));
    }
  }
  planPropose=plan;planViol=V;
  chronoFin();revBusy=false;render();
  const el=document.querySelector(".plan-pret");
  if(el)el.scrollIntoView({block:"start",behavior:"smooth"});
}
/* Relancer le PLAN seul, en repartant de l'analyse déjà enregistrée.
   Le message d'erreur le promettait ; il n'existait pas. Un second appel A
   serait payé pour rien et réécrirait un ÉTAT déjà bon. */
async function relancerPlan(){
  if(revBusy)return;
  const R=DB.reviews||[],revue=R.length?R[R.length-1]:null;
  if(!revue){revErr="Aucune analyse enregistrée : lance la revue complète.";render();return;}
  revBusy=true;revErr="";revPct=8;planPropose=null;planViol=[];
  revEtape="Plan, depuis l'analyse du "+fmt(revue.date).num+"…";chronoDebut();render();
  const suivre=n=>{
    revPct=Math.min(95,8+Math.round(n/220));
    const b=document.querySelector(".bar-in");if(b)b.style.width=revPct+"%";
  };
  const ctx=contexteGardes(revue);
  try{
    const plan=await appelB(revue,suivre,null,surEssai);
    let V=verifierPlan(plan,ctx);
    if(rejets(V).length){
      revEtape="Plan refusé sur "+rejets(V).length+" règle(s). Relance…";revEssai="";render();
      try{const p2=await appelB(revue,suivre,rejets(V),surEssai);V=verifierPlan(p2,ctx);planPropose=p2;}
      catch(e){planPropose=plan;V.push(viol("relance","Relance impossible : "+((e&&e.message)||e),"correction"));}
    }else planPropose=plan;
    planViol=V;
  }catch(e){
    revErr=((e&&e.message)||String(e))+" — l'analyse reste enregistrée.";
  }
  chronoFin();revBusy=false;render();
}
/* Repli (§8.4) : quand aucun plan valide n'est disponible, la structure
   hebdomadaire garantie s'affiche. Elle n'est jamais vide. */
function proposerRepli(){
  planPropose=planRepli();
  planViol=[viol("repli","Plan de repli : la structure garantie, sans personnalisation.","ajout")];
  revErr="";render();
}
/* Application : le plan remplace DB.plan, le rattrapage passe par les
   règles existantes. Jamais automatique — c'est le second tap. */
function appliquerPlan(p){
  const w=(p.semaines||[]).map(x=>({
    start:x.start,regime:x.regime,runCapKm:x.runCapKm,
    days:(x.jours||[]).map(d=>({
      d:d.d,fascia:!!d.fascia,
      sessions:(d.seances||[]).map(z=>({rank:z.rank,kind:z.kind,label:z.label,
        detail:z.detail||"",fallback:z.fallback||"",bonus:!!z.bonus})),
      nutrition:d.nutrition||null,note:d.note||""
    }))
  }));
  if(!w.length)return{err:"Plan vide."};
  DB.plan={weeks:w,genere:p.genere||TODAY};
  /* Un plan importé annule les bascules de régime manuelles des semaines
     qu'il couvre : comportement d'origine, conservé. */
  w.forEach(x=>{if(DB.settings.regime)delete DB.settings.regime[x.start];});
  const bf=appliquerBackfill(p.backfill||{});
  save();
  return{ok:true,jours:w.reduce((n,x)=>n+x.days.length,0),backfill:bf};
}
/* Rattrapage : jours passés uniquement, champs restés vides uniquement,
   champs déclaratifs exclus — ils ne se devinent pas. */
const BACKFILL_INTERDIT={menu:1,talon:1,seanceNote:1,bedTime:1,alcohol:1,fasciaFait:1,done:1,d:1};
function appliquerBackfill(bf){
  let n=0;
  Object.keys(bf||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>=TODAY)return;
    const src=bf[k],e=entry(k);
    Object.keys(src||{}).forEach(f=>{
      if(BACKFILL_INTERDIT[f])return;
      if(e[f]!==undefined&&e[f]!=="")return;
      e[f]=String(src[f]);n++;
    });
  });
  return n;
}

/* --- Onglet Journal : tous les jours connus, empilés par mois.
   L'horizon s'arrête au dernier jour du plan chargé : au-delà il n'y a
   ni séance ni saisie possible, des cartes vides jusqu'en 2027
   n'apporteraient rien. --- */
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
/* Abréviations sans ambiguïté : tronquer à trois lettres donnait « jui »
   pour juin comme pour juillet, sur le même axe. */
const MOIS3=["janv","févr","mars","avr","mai","juin","juil","août","sept","oct","nov","déc"];
const mois3=m=>MOIS3[+String(m).slice(5,7)-1];
function logRange(){
  const ks=Object.keys(DB.days).sort(),ap=activePlan(),pd=[];
  ap.weeks.forEach(w=>(w.days||[]).forEach(x=>pd.push(x.d)));
  const all=ks.concat(pd).concat([TODAY]).sort();
  return{from:all[0],to:all[all.length-1]};
}
function viewLog(){
  const R=logRange();
  if(!R.from)return'<p class="empty">Aucun jour enregistré.</p>';
  const months={},order=[];
  for(let k=R.from;k<=R.to;k=addDays(k,1)){
    const mk=k.slice(0,7);
    if(!months[mk]){months[mk]=[];order.push(mk);}
    months[mk].push(k);
  }
  let h="";
  order.forEach(mk=>{
    const ks=months[mk],y=mk.slice(0,4),mi=+mk.slice(5,7)-1;
    let km=0,done=0,tot=0;
    ks.forEach(k=>{const e=DB.days[k];if(e){const r=num(e.runKm);if(r!==null)km+=r;}
      const d=dayOf(k);if(d){tot+=dayUnits(d);done+=dayDone(k,d);}});
    h+='<div class="mo"><span class="mo-name">'+MOIS[mi]+' '+y+'</span>'+
       '<span class="mo-sub">'+(km>0?r1(km)+" km courus":"—")+(tot?" · "+done+"/"+tot:"")+'</span><span class="rule"></span></div>';
    h+='<div class="jbox">';
    ks.forEach(k=>{h+=logRow(k);});
    h+='</div>';
  });
  return h;
}
function logRow(k){
  const e=DB.days[k],d=dayOf(k),f=fmt(k);
  const bits=[];
  if(e){
    if(num(e.runKm)!==null)bits.push(e.runKm+" km");
    OTHER_KM.forEach(o=>{if(num(e[o[0]])!==null)bits.push(e[o[0]]+" "+o[1].toLowerCase().replace("km ",""));});
    if(num(e.weight)!==null)bits.push(e.weight+" kg");
    if(num(e.vo2)!==null)bits.push("vo2 "+e.vo2);
  }
  let lab=bits.join(" · ");
  if(!lab&&d&&(d.sessions||[]).length)lab=(d.sessions||[]).map(s=>s.label).join(" · ");
  if(!lab)lab="—";
  let chip="";
  if(d&&dayUnits(d)){const u=dayUnits(d),n=dayDone(k,d);chip='<span class="jm '+(n===u?"full":"")+'">'+n+'/'+u+'</span>';}
  let h='<button class="jrow '+(k===TODAY?"today":"")+(open===k?" on":"")+'" data-open="'+k+'">'+
    '<span class="jd">'+f.dow+' <b>'+f.num+'</b></span><span class="js">'+esc(lab)+'</span>'+chip+'</button>';
  /* Le journal déplie sur place, y compris les jours hors plan : ils
     n'existent nulle part ailleurs, un tapotement sans effet était une
     impasse. */
  if(open===k)h+=dayDetail(d||{d:k,fascia:false,sessions:[]},"jdet");
  return h;
}

function dayCard(d,w){
  const k=d.d,u=dayUnits(d),dn=dayDone(k,d),f=fmt(k);
  const isT=k===TODAY,isO=open===k,full=u>0&&dn===u;
  const parts=kept(d).map(x=>x.s.label);
  if(d.fascia)parts.push("fascia");
  const sum=parts.length?parts.join(" · "):"repos";
  let h='<div class="day"><span class="node '+(isT?"now":full?"done":"")+'"></span><div class="card '+(isT?"now":"")+'">'+
    '<button class="card-head" data-open="'+k+'"><div class="card-top"><span class="date">'+f.dow+' <b>'+f.num+'</b></span>'+
    '<span class="sum">'+esc(sum)+'</span>'+(u?'<span class="count '+(full?"full":"")+'">'+dn+'/'+u+'</span>':'')+'</div></button>';
  if(!isO)return h+'</div></div>';
  return h+dayDetail(d)+'</div></div>';
}
/* Corps déplié d'une journée : séances puis saisie. Isolé du bandeau
   pour que le journal puisse déplier un jour sur place, sans la
   chronologie du plan autour. */
function dayDetail(d,extra){
  const k=d.d,e=rd(k);
  let h='<div class="detail '+(extra||"")+'">';
  /* Le 30/08 est la bascule : premières mesures et première revue. */
  if(k===MEASURE_START)h+='<div class="pivot">Mesures de référence + première revue dominicale</div>';
  /* La règle de récupération lit les valeurs du jour même : elle ne
     requalifie que la séance qualité d'aujourd'hui, pas celles à venir.
     C'est le type qui porte l'intensité, pas le rang : une P2 de salle
     n'est pas la séance dure, et la convertir laissait le fractionné
     intact — l'inverse exact de ce que le bandeau annonce. */
  const conv=(k===TODAY)&&recovery();
  kept(d).forEach(x=>{
    const s=x.s,i=x.i;
    const on=!!e.done["s"+i],onF=!!e.done["s"+i+"f"],altOpen=e.done["alt"+i];
    const kd=KIND[s.kind]||{t:String(s.kind||"SÉANCE").toUpperCase(),c:"var(--fog)"};
    const converted=conv&&s.kind==="qualite";
    h+='<div class="sess"><div class="sess-head">'+
      '<button class="box" data-t="'+k+'|s'+i+'" data-on="'+(on?1:0)+'">'+(on?chk(15):"")+'</button>'+
      '<div style="flex:1;min-width:0"><div class="tags"><span class="rank '+(s.rank==="P1"?"p1":"")+'">'+esc(s.rank||"P3")+'</span>'+
      '<span class="tag" style="color:'+kd.c+'">'+esc(kd.t)+'</span></div>'+
      '<div class="sess-lab '+((on||onF)?"off":"")+'">'+esc(s.label||"")+'</div>'+
      (s.detail?'<div class="cue">'+esc(s.detail)+'</div>':"")+
      (converted?'<div class="conv">convertie en facile — récupération</div>':"")+
      (s.fallback?'<button class="alt" data-alt="'+k+'|'+i+'">'+(altOpen?"Masquer":"Version dégradée")+'</button>':"")+
      (s.fallback&&altOpen?'<div class="fallback"><button class="box sm" data-t="'+k+'|s'+i+'f" data-on="'+(onF?1:0)+'">'+(onF?chk(13):"")+'</button><div class="fb-t">'+esc(s.fallback)+'</div></div>':"")+
      '</div></div></div>';
  });
  if(d.fascia){
    const fo=!!e.done.fascia;
    h+='<div class="sess"><div class="sess-head"><button class="box" data-t="'+k+'|fascia" data-on="'+(fo?1:0)+'">'+(fo?chk(15):"")+'</button>'+
      '<div style="flex:1;min-width:0"><div class="tags"><span class="rank">FASCIA</span></div>'+
      '<div class="sess-lab '+(fo?"off":"")+'">Bloc fascia</div><div class="cue">'+esc(FASCIA)+'</div></div></div></div>';
  }
  h+=blocRepas(d);
  const nCut=cut(d);
  if(nCut)h+='<p class="empty">'+nCut+' séance'+(nCut>1?"s":"")+' écartée'+(nCut>1?"s":"")+' — semaine chargée, seules les P1 tiennent.</p>';
  /* « Rien de prévu » ne se dit que si rien n'a été fait non plus : le
     jour où la montre a vu deux séances, la phrase était un contresens. */
  if(!kept(d).length&&!d.fascia&&!nCut&&!seancesAt(k).length){
    /* Avant le début du plan, « rien de prévu » n'est pas un reproche :
       il n'y a simplement pas encore de plan pour ce jour-là. */
    const ap=activePlan();
    h+='<p class="empty">'+(ap.pending&&k<ap.pending
      ?"Le plan commence le "+esc(fmt(ap.pending).dow+" "+fmt(ap.pending).num)+"."
      :"Rien de prévu. Une séance manquée ne se rattrape pas.")+'</p>';
  }

  /* --- saisie quotidienne (§9.3) ---
     Cinq éléments, et rien d'autre : tout ce que le zip mesure a été
     retiré du formulaire. Budget de trente secondes par jour, dont vingt
     pour le menu ; chaque champ ajouté ici se paie sur ce budget. */
  h+='<div class="log">';
  /* 1 · alcool. Un tap, défaut zéro. La pastille 4+ ouvre un champ libre :
     sur deux à trois dîners d'affaires par semaine, c'est le seul chiffre
     qui compte qu'on sous-estimait. */
  const al=e.alcohol,alBig=(typeof al==="number"&&al>=4);
  h+='<div class="log-row"><span class="log-lab">Verres d\'alcool'+(nextDayHasKey(k)&&typeof al==="number"&&al>0?'<span class="hint warn">Séance P1 ou P2 demain.</span>':'')+'</span><div class="pills">';
  [0,1,2,3].forEach(n=>{h+='<button class="pill" data-a="'+k+'|'+n+'" data-on="'+(al===n?1:0)+'" data-over="'+(n>=3?1:0)+'">'+n+'</button>';});
  h+='<button class="pill" data-a="'+k+'|4" data-live="al|'+k+'" data-on="'+(alBig?1:0)+'" data-over="1">'+(alBig?al:"4+")+'</button>';
  if(alBig)h+='<input class="alx" type="number" min="4" step="1" inputmode="numeric" value="'+al+'" data-n="'+k+'|alcohol">';
  h+='</div></div>';
  /* 2 · menu, en clair. Aucun gramme imposé, aucun compteur affiché :
     ce champ répond à une seule question, posée une fois par semaine —
     l'apport est-il à 2 000 kcal ou au-dessus. */
  h+='<div class="log-row col"><span class="log-lab">Menu du jour<span class="hint">En clair, sans peser. Valider donne une estimation du jour, en fourchette.</span></span>'+
     '<textarea class="menu" rows="3" placeholder="skyr + whey, salade de bœuf, amandes, poulet + légumes…" data-f="'+k+'|menu">'+esc(e.menu||"")+'</textarea>'+
     /* Valider : le champ se sauve déjà en quittant, mais sans bouton on ne
        sait pas que c'est fait. Et c'est lui qui déclenche l'estimation. */
     '<div class="valid-row"><button class="valid" data-val="'+k+'|menu">Valider</button>'+
     blocApport(e)+'</div></div>';
  /* 3 · protocole tendineux réellement fait. « fasciaFait » et non
     « fascia » : le second dit ce que le plan prescrit ce jour-là, et
     cocher la prescription à la place de la réalisation ferait mentir les
     deux. */
  const ff=!!e.fasciaFait;
  h+='<div class="log-row"><span class="log-lab">Protocole tendineux<span class="hint">Talon, mollets. Fait aujourd\'hui.</span></span>'+
     '<button class="box" data-ff="'+k+'" data-on="'+(ff?1:0)+'">'+(ff?chk(15):"")+'</button></div>';
  /* 4 · heure de coucher. Le zip donne une durée de sommeil, jamais une
     heure d'endormissement : sans cette saisie, « avant 23h30 quatre
     soirs sur sept » ne s'évalue pas. */
  h+='<div class="log-row"><span class="log-lab">Heure de coucher<span class="hint">Cible avant '+fmtMin(BED_LIMIT)+'.</span></span>'+
     '<input type="time" value="'+esc(e.bedTime||"")+'" data-f="'+k+'|bedTime"><span class="unit"></span></div>';
  /* 5 · commentaire de séance, les jours de salle seulement, replié.
     C'est la seule source restante du second signal d'arrêt du déficit :
     un commentaire non vide vaut alerte, son absence vaut séance tenue. */
  if(hasSalle(d)){
    const sn=e.seanceNote||"",snOpen=!!e.done["sn"]||!!sn;
    h+='<div class="log-row col"><span class="log-lab">Séance de salle'+
       '<span class="hint">Vide = tenue comme prévue.</span></span>';
    if(snOpen)h+='<textarea class="menu" rows="2" placeholder="charges, douleur, séance écourtée…" data-f="'+k+'|seanceNote">'+esc(sn)+'</textarea>'+
       '<div class="valid-row"><button class="valid" data-val="'+k+'|seanceNote">Valider</button></div>';
    else h+='<button class="lnk" data-sn="'+k+'">ajouter un commentaire</button>';
    h+='</div>';
  }
  /* Exception : le talon ne s'ouvre que si on le demande. Un champ vide
     tous les jours finit par se remplir de « rien à signaler ». */
  const tl=e.talon||"",tlOpen=!!e.done["tl"]||!!tl;
  h+='<div class="log-row col">';
  if(tlOpen)h+='<span class="log-lab">Talon<span class="hint">Vide = pas de problème.</span></span>'+
     '<textarea class="menu" rows="2" placeholder="gêne au réveil, douleur en fin de sortie…" data-f="'+k+'|talon">'+esc(tl)+'</textarea>'+
     '<div class="valid-row"><button class="valid" data-val="'+k+'|talon">Valider</button></div>';
  /* Le lien se nomme : deux « signaler quelque chose » l'un sous l'autre
     ne disaient pas lequel parlait du talon. */
  else h+='<button class="lnk" data-tl="'+k+'">signaler une gêne au talon</button>';
  h+='</div>';
  h+='</div>';        /* .log */
  h+=mesureBlock(k);
  h+='</div>';        /* .detail */
  return h;
}
/* Repas du jour, tels que le plan les a posés : des aliments et des
   portions, jamais un total. Ni kilocalories, ni grammes de protéines, ni
   jauge, ni couleur — les champs kcal et prot du plan existent pour la
   validation et restent internes. L'estimation d'apport est hebdomadaire
   et n'apparaît qu'à la revue. */
function blocRepas(d){
  const n=d.nutrition;
  if(!n||!Array.isArray(n.creneaux)||!n.creneaux.length)return "";
  const k=d.d,e=rd(k);
  let h='<div class="repas"><div class="repas-t">Repas'+
    (n.feculentDiner?' · <b>féculent au dîner</b>'+(n.feculentG?" ("+n.feculentG+" g)":""):' · sans féculent au dîner')+
    '</div>';
  n.creneaux.forEach((c,i)=>{
    const on=!!e.done["n"+i];
    h+='<div class="sess-head" style="padding:7px 0">'+
      '<button class="box sm" data-t="'+k+'|n'+i+'" data-on="'+(on?1:0)+'">'+(on?chk(13):"")+'</button>'+
      '<div style="flex:1;min-width:0"><div class="cre-h">'+esc(c.h||"")+(c.subi?' · <span class="subi">subi</span>':'')+'</div>'+
      '<div class="sess-lab '+(on?"off":"")+'" style="font-size:13px">'+esc(c.contenu||"")+'</div></div></div>';
  });
  if(d.note)h+='<div class="cue">'+esc(d.note)+'</div>';
  return h+'</div>';
}
/* Estimation du jour, telle qu'elle a été demandée à Valider. Une
   fourchette et une date, jamais un compteur qui court. */
function blocApport(e){
  const a=e.apport;
  if(estBusy===e.d)return '<span class="apport">Estimation…</span>';
  if(!a)return "";
  if(a.err)return '<span class="apport warn">'+esc(a.err)+'</span>';
  return '<span class="apport">≈ <b>'+esc(String(a.kcal))+' kcal</b> · '+esc(String(a.prot))+' g prot.'+
    (a.inc?' · '+esc(a.inc):'')+'</span>';
}
/* Les jours de salle portent le commentaire d'exception. Le type de
   séance vient du plan ; à défaut, une séance de salle importée. */
function hasSalle(d){
  if(kept(d).some(x=>x.s.kind==="force"||/salle|force/i.test(x.s.label||"")))return true;
  return seancesAt(d.d).some(s=>s.kind==="salle");
}
/* Mesures : lecture seule, et la source est nommée. Rien de ce bloc ne
   se saisit — tout vient du zip Apple Santé. */
/* Un millier se lit avec une espace : 16 927, pas 16927. Espace fine
   insécable, pour que le nombre ne se coupe pas en fin de ligne. */
function milliers(v){return String(v).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");}
const MESURE_VUE=[
  ["weight","Poids","kg"],["mg","Masse grasse",""],
  ["maigre","Masse maigre","kg"],["waist","Tour de taille","cm"],
  ["rhr","FC repos","bpm"],["hrv","VFC","ms"],["vo2","VO2max","ml/kg/min"],
  ["sleep","Sommeil",""],["pas","Pas",""],["kcalActives","Énergie active","kcal"],
  ["sys","Tension systolique","mmHg"],["dia","Tension diastolique","mmHg"]
];
function mesureBlock(k){
  const e=rd(k),S=seancesAt(k),dg=digestAt(k);
  const rows=MESURE_VUE.map(m=>{
    let val;
    if(m[0]==="mg"){
      /* Les kilogrammes et le pourcentage disent la même mesure : deux
         lignes du même nom se liraient comme deux mesures distinctes. */
      const kg=num(e.mgKg),pc=num(e.mgPct);
      if(kg===null&&pc===null)return "";
      val=(kg===null?"":kg+" kg")+(kg!==null&&pc!==null?" · ":"")+(pc===null?"":pc+" %");
    }else{
      const v=num(e[m[0]]);
      if(v===null)return "";
      val=m[0]==="sleep"?fmtDur(v):(m[0]==="pas"||m[0]==="kcalActives")?milliers(e[m[0]]):String(e[m[0]]);
    }
    return'<div class="log-row"><span class="log-lab">'+esc(m[1])+'</span><span class="ro">'+
      esc(val)+(m[2]?' <span class="unit">'+esc(m[2])+'</span>':'')+'</span></div>';
  }).filter(Boolean);
  if(!rows.length&&!S.length)return "";
  let h='<div class="mes"><div class="mes-t">Mesuré — Apple Santé'+
    (dg&&isDate(dg.importe)?', import du '+esc(dm(dg.importe)):'')+'</div><div class="log">';
  /* Une séance tient sur plusieurs lignes : alignée à droite comme une
     valeur, elle sortait en escalier. Elle a sa propre ligne. */
  S.forEach(s=>{h+='<div class="log-row seance"><span class="log-lab">'+esc(s.debut)+'</span>'+
    '<span class="ro">'+esc(seanceTxt(s))+'</span></div>';});
  h+=rows.join("")+'</div></div>';
  return h;
}

/* Les journées « figées » des versions antérieures n'existent plus :
   une journée importée est une journée comme une autre, dont les mesures
   viennent du zip et dont les cinq champs déclaratifs restent saisissables.
   Le drapeau frozen subsiste sans effet dans les bases anciennes. */
function chk(s){return'<svg width="'+s+'" height="'+s+'" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.4 6.4 11.2 12.5 4.9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

/* ================= Panneau Cibles (§7.2) ================= */
/* st(v,ok) : ✓ atteint · → échéance à venir · ✗ échéance passée et non
   atteinte · — donnée manquante (la ligne est alors une estimation). */
function st(ok,mileD){
  if(ok===null)return'<span class="t-st dim">—</span>';
  if(ok)return'<span class="t-st ok">✓</span>';
  return TODAY>mileD?'<span class="t-st warn">✗</span>':'<span class="t-st dim">→</span>';
}
/* Les valeurs sont recalculées ici : le panneau est rendu à la demande,
   quand on ouvre son onglet, et non plus dans la foulée de l'en-tête. */
/* Fenêtre du tableau mensuel : mois en cours −1 à +3. Treize colonnes ne
   tiennent pas sur un téléphone, et les mois lointains ne se pilotent
   pas. Le bouton « Tous les mois » lève la fenêtre. */
let allMonths=false;
function monthIdx(){
  const c=MOISKEY(TODAY);
  const T=monthsTable(),i=T.findIndex(x=>x.m===c);
  return i>=0?i:(TODAY<T[0].m?0:T.length-1);
}
function monthWindow(){
  const T=monthsTable();
  if(allMonths)return T;
  const i=monthIdx();
  /* Du mois précédent jusqu'à l'horizon. Le tableau défile
     horizontalement : mieux vaut voir toute la pente que quatre mois. */
  const end=Math.max(i+1,T.findIndex(x=>x.m===HORIZON)+1);
  return T.slice(Math.max(0,i-1),end);
}
/* Réel HEBDOMADAIRE, cible MENSUELLE, sur le même axe de dates.
   Le réel garde sa finesse — une courbe mensuelle n'aurait qu'un point
   avant octobre et ne tracerait rien — et la cible court jusqu'à
   l'horizon. C'est l'écart entre les deux qui se lit.
   Les grandeurs sont celles que le tableau juge : moyenne hebdomadaire
   pour le poids, médiane 4 semaines pour le volume, maximum de la
   semaine pour la VO2max. */
function progWeeks(){
  const a=[],end=mondayOf(TODAY);
  let m=mondayOf(monthStart(BASE_MOIS));
  for(let i=0;i<80&&m<=end;i++){a.push(m);m=addDays(m,7);}
  return a;
}
function monthSeries(t){
  const pts=[],goal=[];
  monthsTable().forEach(x=>{
    if(!allMonths&&x.m>HORIZON)return;
    const tv=tgtValue(x,t);
    if(tv!==null)goal.push({k:monthStart(x.m),lab:mois3(x.m),v:tv});
  });
  progWeeks().forEach(m=>{
    let v=null,hollow=false;
    if(t.k==="w"){v=weekWeight(m);hollow=(weekWeightN(m)===2);}
    else if(t.k==="vol")v=runMedian4(m);
    else if(t.k==="vo2")v=weekVo2Max(m);
    else v=snapAt(addDays(m,6)<TODAY?addDays(m,6):TODAY)[t.k];
    if(v!==null)pts.push({k:m,lab:fmt(m).num,v:r1(v),hollow:hollow});
  });
  return{pts:pts,goal:goal};
}
function moisLab(m){return MOIS[+m.slice(5,7)-1].slice(0,4)+" "+m.slice(2,4);}
/* Prochain test à venir, et dernier test passé avec son résultat. */
function testAt(){
  const done=DB.settings.tests||{};
  let next=null,last=null,late=null;
  ((DB.milestones||{}).tests||[]).slice()
    .sort((a,b)=>String(a.d).localeCompare(String(b.d))).forEach(t=>{
    const r=done[t.d];
    if(t.d>=TODAY){if(!next)next=t;return;}
    if(parseMMSS(r)!==null)last={t:t,r:r};
    else if(!late)late=t;
  });
  return{next:next,last:last,late:late};
}

     '</span></div>';

  h+='<p class="pace">Allure d\'endurance de référence : <b>'+esc(paceAt(TODAY))+'</b>. Indication, jamais évaluée.</p>';

      /* Un mois écoulé se juge sur ce qu'il affichait à sa fin ; le mois

  h+='<div class="graph">'+weightChart()+'</div>';

/* Les graphes qui ne dépendent d'aucune cible. */
function graphesMesure(){
  return '<div class="graph">'+mgChart()+'</div>'+
         '<div class="graph">'+seriesChart("FC de repos — moyenne sur 7 jours",rhrSeries(),rhrCible()===null?[]:[{v:rhrCible(),txt:rhrCible()+" · cible"}],1)+'</div>'+

function lastVal(f){
  const ks=Object.keys(DB.days).sort();
  for(let i=ks.length-1;i>=0;i--){const v=num(DB.days[ks[i]][f]);if(v!==null)return v;}
  return null;

/* Une date venue des réglages peut arriver de n'importe où — champ vide,
   base importée, saisie d'un autre navigateur. La formater sans vérifier
   donnait « NaN/ne ». */
function isDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(String(k||""));}
/* jj/mm — les dates d'un tableau tiennent en six caractères. */
function dm(k){return isDate(k)?fmt(k).num+"/"+k.slice(5,7):"—";}
/* Chrono mm:ss en secondes. null si le format n'est pas respecté : une
   valeur en texte libre n'était comparée à rien. */
function parseMMSS(s){
  const t=String(s||"").trim();
  /* Une seule heure : un chrono de course ne dépasse pas 9 h, et
     « 26:30:00 » est une faute de frappe sur un 5 km, pas 26 h 30. */
  let m=/^([0-9]):([0-5]\d):([0-5]\d)$/.exec(t);
  if(m)return (+m[1])*3600+(+m[2])*60+(+m[3]);
  m=/^(\d{1,3}):([0-5]\d)$/.exec(t);
  return m?(+m[1])*60+(+m[2]):null;
}
function weekList(n){
  const a=[],m=mondayOf(TODAY);
  for(let i=n-1;i>=0;i--)a.push(addDays(m,-7*i));
  return a;
}
/* Première moyenne hebdomadaire enregistrée, origine de la jauge poids. */
function firstWeekWeight(){
  const ms=Object.keys(DB.days).sort().map(mondayOf);
  const seen={};
  for(const m of ms){if(seen[m])continue;seen[m]=1;const v=weekWeight(m);if(v!==null)return v;}
  return null;
}
/* Tant qu'aucune moyenne n'existe, le graphe n'affiche que les jalons :
   aucune valeur de poids n'a été mesurée, il n'y a rien à tracer. */
/* Les trois graphes portant une cible sont mensuels et prolongés jusqu'à
   l'horizon : la valeur réelle est exactement celle que le tableau juge,
   même chiffre et même règle, et la cible court jusqu'au bout. Le détail
   hebdomadaire du poids se lit dans le journal, la pente se lit ici. */
function tgtChart(key,title,dec){
  const t=TGT.filter(x=>x.k===key)[0],S=monthSeries(t);
  return seriesChart(title,S.pts,[],dec,S.goal);
}
function weightChart(){
  /* La trajectoire se trace même sans mesure : avant la première pesée,
     la pente attendue est la seule chose à montrer, et une ligne la dit
     mieux que trois repères horizontaux qui se chevauchent. */
  const h=tgtChart("w","Poids — en trait plein, la cible en pointillé",1);
  return monthSeries(TGT[0]).pts.length?h
    :h+'<p class="empty">Première pesée le '+MEASURE_START+'. La trajectoire est tracée, rien d\'autre n\'est mesuré.</p>';
}

/* Série FC repos : moyennes hebdomadaires figées, puis moyennes mobiles
   7 jours dès qu'il y a des saisies quotidiennes. */
/* Un point par semaine. Sans cela, les moyennes figées et les moyennes
   glissantes calculées sur les quotidiennes traçaient deux fois la même
   période — une courbe qui se doublait elle-même sur trois semaines.
   La moyenne des jours prime, mais seulement si la semaine est assez
   couverte : celle du 27/07 n'a que ses deux derniers jours dans le
   relevé quotidien, et leur moyenne (70) vaut moins que la moyenne
   hebdomadaire figée, calculée sur les sept (64,8). */
const WEEK_MIN=4;
/* Un point par semaine, calculé sur les jours. Les moyennes hebdomadaires
   figées ont disparu avec l'historique en dur : tout vient du zip. */
function rhrSeries(){
  const a=[];
  weekList(12).forEach(m=>{
    const d=vals(weekDays(m),"rhr");
    if(d.length>=WEEK_MIN)a.push({k:m,lab:fmt(m).num,v:r1(avg(d))});
  });
  return a;
}

function volumeChart(){
  /* Le réel est la médiane 4 semaines, celle que la cible juge — pas le
     total d'une semaine, qu'un pic isolé gonflerait. Le plafond dur en
     vigueur reste dans le titre. */
  return tgtChart("vol","Volume de course — médiane sur 4 semaines, cible en pointillé. Plafond dur "+runAbsMax()+" km",1);
}
/* Masse grasse absolue, en kilogrammes : c'est elle qu'on veut voir
   descendre, pas le poids total, qui mêle la masse maigre. Droite de
   régression par moindres carrés sur les points mesurés — une pente sur
   quarante jours dit ce qu'une variation quotidienne de 400 g cache. */
function mgSeries(){
  const ks=Object.keys(DB.days).sort(),a=[];
  ks.forEach(k=>{const v=num(DB.days[k].mgKg);if(v!==null)a.push({k:k,lab:dm(k),v:r1(v)});});
  return a.slice(-120);
}
function trendOf(pts){
  if(pts.length<3)return null;
  const xs=pts.map(p=>parseD(p.k).getTime()/86400000);
  const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=pts.reduce((a,p)=>a+p.v,0)/n;
  let num0=0,den=0;
  for(let i=0;i<n;i++){num0+=(xs[i]-mx)*(pts[i].v-my);den+=(xs[i]-mx)*(xs[i]-mx);}
  if(!den)return null;
  const b=num0/den,a0=my-b*mx;
  return{pts:[{k:pts[0].k,lab:"",v:a0+b*xs[0]},{k:pts[n-1].k,lab:"",v:a0+b*xs[n-1]}],
         parSemaine:r1(b*7*10)/10};
}
function mgChart(){
  const pts=mgSeries(),T=trendOf(pts);
  const t="Masse grasse — en kilogrammes, l'indicateur qui compte"+
    (T?". Tendance "+(T.parSemaine>=0?"+":"−")+Math.abs(T.parSemaine).toFixed(1)+" kg par semaine":"");
  return seriesChart(t,pts,[],1,null,T?T.pts:null)+
    (pts.length?"":'<p class="empty">Aucun import : la masse grasse vient du zip, elle ne se saisit pas.</p>');
}
/* Toutes les séances connues, doublons d'imports chevauchants écartés. */
function allSeances(){
  const out=[],vus={};
  (DB.imports||[]).forEach(d=>(d.seances||[]).forEach(s=>{
    const id=s.date+"|"+s.heureCle+"|"+s.kind;
    if(vus[id])return;vus[id]=1;out.push(s);
  }));
  return out.sort((a,b)=>(a.date+a.debut).localeCompare(b.date+b.debut));
}
/* % de temps passé au-dessus de la zone haute, sortie par sortie. En
   barres : ce sont des événements distincts, pas une série continue —
   une ligne suggérerait une progression entre deux sorties espacées de
   dix jours. */
function horsZoneChart(){
  const S=allSeances().filter(s=>s.kind==="course"&&s.pctHorsZoneHaut!==null&&s.pctHorsZoneHaut!==undefined).slice(-14);
  const z=DB.settings.zones||{bas:128,haut:141};
  const title="Hors zone — part de chaque sortie au-dessus de "+z.haut+" bpm";
  if(!S.length)return gTitre(title)+'<p class="empty">Aucune sortie de course avec série de fréquence cardiaque importée.</p>';
  const W=600,H=150,n=S.length;
  const hi=Math.max(40,Math.max.apply(null,S.map(s=>s.pctHorsZoneHaut)));
  const y=v=>18+((hi-v)/hi)*(H-48);
  const bw=Math.min(34,(W-70)/n*0.62);
  let s=gTitre(title)+'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  S.forEach((x,i)=>{
    const cx=34+(n===1?(W-70)/2:(i*(W-70))/(n-1)),v=x.pctHorsZoneHaut;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+Math.max(1,(H-30)-y(v))+
       '" class="g-bar'+(v>HZ_REF?" hot":"")+'"/>';
    s+='<text x="'+cx+'" y="'+(y(v)-4)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+v+'</text>';
    if(n<=8||i%2===0)s+='<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+esc(dm(x.date))+'</text>';
  });
  /* Repère à 20 % tracé APRÈS les barres : dessous, il disparaissait
     derrière elles dès que toutes les sorties dépassaient le seuil —
     c'est-à-dire précisément quand il fallait le voir. */
  s+='<line x1="26" y1="'+y(HZ_REF)+'" x2="'+(W-20)+'" y2="'+y(HZ_REF)+'" class="gl-ref" stroke-dasharray="4 5"/>';
  s+='<text x="'+(W-20)+'" y="'+(y(HZ_REF)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">'+HZ_REF+' % · seuil</text>';
  s+='</svg><div class="gsub">Dernière sortie '+S[n-1].pctHorsZoneHaut+' %</div>';
  return s;
}
const HZ_REF=20;
/* Un graphe porte un nom, pas une phrase en capitales. Ce qui suit le
   tiret cadratin est son mode d'emploi : il passe en sous-titre, plus
   léger, et n'entre pas en concurrence avec la courbe. */
function gTitre(t){
  const i=String(t).indexOf(" — ");
  const nom=i<0?t:t.slice(0,i),sous=i<0?"":t.slice(i+3);
  return'<div class="gtitle">'+esc(nom)+'</div>'+(sous?'<div class="gsub">'+esc(sous)+'</div>':'');
}
function seriesChart(title,pts,refs,dec,goal,trend){
  const G=goal||[],TR=trend||[];
  if(!pts.length&&!G.length)return gTitre(title)+'<p class="empty">Aucune donnée saisie.</p>';
  const W=600,H=150;
  const all=pts.concat(G).concat(TR);
  let lo=Math.min.apply(null,all.map(p=>p.v)),hi=Math.max.apply(null,all.map(p=>p.v));
  refs.forEach(r=>{lo=Math.min(lo,r.v);hi=Math.max(hi,r.v);});
  if(hi-lo<1){hi+=1;lo-=1;}
  const padV=(hi-lo)*0.15;lo-=padV;hi+=padV;
  const y=v=>18+((hi-v)/(hi-lo))*(H-48);
  /* Axe par date dès que les points en portent une. Le réel s'arrête au
     jour dit, la cible continue jusqu'à l'horizon : sur un axe indexé,
     une courbe de trois points et une de douze seraient étirées l'une
     sur l'autre et l'écart deviendrait illisible. */
  const dated=all.length&&all[0].k;
  let t0=0,t1=1;
  if(dated){
    const ts=all.map(p=>parseD(p.k).getTime());
    t0=Math.min.apply(null,ts);t1=Math.max.apply(null,ts);
    if(t1===t0)t1=t0+1;
  }
  const X=(p,i)=>dated?34+((parseD(p.k).getTime()-t0)/(t1-t0))*(W-70)
                      :34+(i*(W-70))/Math.max(pts.length-1,1);
  let s=gTitre(title)+'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">';
  refs.forEach(r=>{
    s+='<line x1="26" y1="'+y(r.v)+'" x2="'+(W-20)+'" y2="'+y(r.v)+'" class="gl-ref" stroke-dasharray="4 5"/>';
    s+='<text x="'+(W-20)+'" y="'+(y(r.v)-6)+'" text-anchor="end" class="gt-ref" font-size="10" font-family="monospace">'+esc(r.txt)+'</text>';
  });
  /* La cible d'abord, en pointillé, sous la courbe réelle. */
  if(G.length>1)
    s+='<polyline points="'+G.map((p,i)=>X(p,i)+","+y(p.v)).join(" ")+'" fill="none" class="g-goal" stroke-width="1.4" stroke-dasharray="5 4"/>';
  if(pts.length>1)
    s+='<polyline points="'+pts.map((p,i)=>X(p,i)+","+y(p.v)).join(" ")+'" fill="none" class="g-line" stroke-width="1.8"/>';
  /* Droite de régression : deux points, tracée par-dessus le nuage. */
  if(TR.length===2)
    s+='<line x1="'+X(TR[0],0)+'" y1="'+y(TR[0].v)+'" x2="'+X(TR[1],1)+'" y2="'+y(TR[1].v)+'" class="g-trend" stroke-width="1.6" stroke-dasharray="7 4"/>';
  /* Point creux : moyenne partielle, tracée mais distinguée. */
  pts.forEach((p,i)=>{s+='<circle cx="'+X(p,i)+'" cy="'+y(p.v)+'" r="3.4" class="g-dot'+(p.hollow?" hollow":"")+'"/>';});
  /* Les libellés viennent de la plus longue des deux séries, sinon ils se
     tasseraient tous à gauche quand le réel ne couvre qu'un mois. */
  const axe=G.length>=pts.length?G:pts;
  const pas=Math.ceil(axe.length/12);
  axe.forEach((p,i)=>{if(i%pas===0)s+='<text x="'+X(p,i)+'" y="'+(H-6)+'" text-anchor="middle" class="g-txt" font-size="10" font-family="monospace">'+esc(p.lab)+'</text>';});
  s+='</svg><div class="gsub">'+
     (pts.length?'Dernier point '+pts[pts.length-1].v.toFixed(dec):'Aucune mesure encore')+'</div>';
  return s;
}

/* onDone n'est appelé que si quelque chose est réellement sorti : le
   presse-papiers a accepté, ou la boîte de repli a été validée. Dater la
   sauvegarde avant de le savoir affichait « sauvegardé aujourd'hui »
   quand l'utilisateur venait d'annuler. */
function copyOut(s,msg,onDone){
  const fallback=()=>{if(prompt("Copie ce texte :",s)!==null&&onDone)onDone();};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(s).then(()=>{alert(msg);if(onDone)onDone();},fallback);
  else fallback();
}
/* Rattrapage : le plan importé peut porter un bloc `backfill`, des
   mesures par date relevées dans Santé au moment de la revue. Elles ne
   s'appliquent qu'aux jours passés et seulement là où le champ est vide,
   donc une saisie manuelle n'est jamais écrasée. Les champs déclaratifs
   — protéines, alcool, coucher, talon — en sont exclus : ils ne se
   lisent nulle part et personne d'autre que toi ne peut les affirmer. */
const BACKFILL_FIELDS=["runKm","hikeKm","swimKm","bikeKm","vo2","rhr","hrv","sleep","weight","waist","bedTime","sys","dia"];
function applyBackfill(bf){
  let n=0,days=0;
  Object.keys(bf||{}).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||k>TODAY)return;
    const src=bf[k]; if(!src||typeof src!=="object")return;
    /* La journée n'est créée qu'au premier champ réellement rempli :
       un rattrapage sans rien à dire ne doit pas ajouter de jour vide. */
    let e=DB.days[k]||null,touched=0;
    BACKFILL_FIELDS.forEach(f=>{
      if(!(f in src))return;
      /* Poids et taille n'existent pas avant la première pesée : les
         remplir avant alimenterait une jauge avec une valeur que l'app
         n'affiche pas et qu'on ne pourrait pas corriger. */
      if((f==="weight"||f==="waist")&&k<MEASURE_START)return;
      const cur=e?e[f]:"";
      if(cur!==""&&cur!==null&&cur!==undefined)return;
      const v=src[f];
      if(v===null||v===undefined||v==="")return;
      if(!e)e=entry(k);
      e[f]=String(v);n++;touched=1;
    });
    if(touched)days++;
  });
  return{n:n,days:days};
}
function importPlan(txt){
  let p;try{p=JSON.parse(txt);}catch(e){return{err:"Plan non reconnu"};}
  if(!p||typeof p!=="object"||!Array.isArray(p.weeks)||!p.weeks.length)return{err:"Plan non reconnu"};
  const dre=/^\d{4}-\d{2}-\d{2}$/;
  for(const w of p.weeks){
    if(!w||typeof w.start!=="string"||!dre.test(w.start)||!Array.isArray(w.days))return{err:"Plan non reconnu"};
    for(const d of w.days){
      if(!d||typeof d.d!=="string"||!dre.test(d.d))return{err:"Plan non reconnu"};
      if(d.sessions!==undefined&&!Array.isArray(d.sessions))return{err:"Plan non reconnu"};
      for(const s of (d.sessions||[]))if(!s||typeof s.label!=="string")return{err:"Plan non reconnu"};
    }
  }
  if(p.backfill!==undefined){
    if(!p.backfill||typeof p.backfill!=="object"||Array.isArray(p.backfill))return{err:"Plan non reconnu"};
    for(const k in p.backfill){
      const o=p.backfill[k];
      if(!dre.test(k)||!o||typeof o!=="object"||Array.isArray(o))return{err:"Plan non reconnu"};
    }
  }
  DB.plan=p;
  /* Un plan neuf reprend la main sur les bascules manuelles : elles
     visaient les semaines qu'il remplace. */
  (p.weeks||[]).forEach(w=>{if(DB.settings.regime)delete DB.settings.regime[w.start];});
  const bf=applyBackfill(p.backfill);
  save();open=null;render();
  return{filled:bf.n,days:bf.days};
}

/* Dépôt d'un ou plusieurs zips. Le travail est asynchrone : le bouton
   passe en « lecture en cours » pour qu'un export de trois méga-octets ne
   ressemble pas à un tap sans effet. */
document.addEventListener("change",async ev=>{

    const a=ev.target.dataset.ms.split("|"),v=String(ev.target.value||"").trim();
    if(!DB.milestones[a[0]])DB.milestones[a[0]]={};
    if(v==="")delete DB.milestones[a[0]][a[1]];
    else DB.milestones[a[0]][a[1]]=(a[1]==="date")?v:num(v);
    save();renderTargets();renderRefs();return;
  }
  const f=ev.target.dataset.f,s=ev.target.dataset.s,n=ev.target.dataset.n,hm=ev.target.dataset.hm;
  if(f){const a=f.split("|");entry(a[0])[a[1]]=ev.target.value;save();refreshLive();return;}
  /* Champ numérique dont le type compte : drinksIn() n'additionne que les
     nombres, une chaîne sortirait la journée du comptage. */
  if(n){const a=n.split("|"),v=num(ev.target.value);
    entry(a[0])[a[1]]=(v===null||v<0)?"":v;save();refreshLive();return;}
  /* Durée saisie en h:mm, rangée en heures décimales. */
  if(hm){const a=hm.split("|");entry(a[0])[a[1]]=hmTo(ev.target.value);save();refreshLive();return;}
  if(s){const a=s.split("|");DB.settings[a[0]][a[1]]=ev.target.value;save();refreshLive();return;}
  /* Résultat d'un test chronométré, rangé par date de test. */
  if(ev.target.dataset.tst){
    if(!DB.settings.tests)DB.settings.tests={};
    DB.settings.tests[ev.target.dataset.tst]=ev.target.value;
    save();renderTargets();renderRefs();}
});

/* ================= Démarrage ================= */
document.title=APP;
const mt=document.querySelector('meta[name="apple-mobile-web-app-title"]');
if(mt)mt.setAttribute("content",APP);
document.getElementById("title").textContent=APP;
load();
{const o=ses("get",null,OKEY);if(o!==null){open=o||null;ses("del",null,OKEY);}
 const tb=ses("get",null,TKEY);if(tb&&TABS.some(x=>x[0]===tb)){tab=tb;ses("del",null,TKEY);}}
if(open===null){
  const ap=activePlan();
  open=dayOf(TODAY)?TODAY:((ap.weeks[0].days||[])[0]||{}).d||null;
}
bg();render();checkVersion();
</script>
